<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Signaturas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Efecto de libro para el área de descripción */
        .book-container {
            perspective: 1000px;
        }

        .book-cover {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #ecf0f1;
            box-shadow: 
                -5px 5px 15px rgba(0,0,0,0.3),
                inset 5px 0 20px rgba(0,0,0,0.2),
                inset -5px 0 10px rgba(255,255,255,0.1);
            border-radius: 5px 15px 15px 5px;
            font-family: 'Playfair Display', serif;
            transition: all 0.4s ease;
            transform-style: preserve-3d;
            position: relative;
        }

        /* Lomo del libro simulado */
        .book-cover::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            background: linear-gradient(to right, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            border-radius: 5px 0 0 5px;
            border-right: 1px solid rgba(0,0,0,0.1);
        }
        
        /* Hojas del libro simuladas */
        .book-cover::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 5px;
            bottom: 5px;
            width: 10px;
            background: #fdfbf7;
            border-radius: 0 5px 5px 0;
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.1);
            z-index: -1;
            border: 1px solid #dcdde1;
            border-left: none;
        }

        /* Estilo para los items de la lista al hacer hover */
        .signature-item {
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }

        .signature-item:hover, .signature-item.active {
            background-color: #e2e8f0;
            border-left: 4px solid #3b82f6;
            cursor: pointer;
            transform: translateX(5px);
        }

        /* Animación suave para la aparición del texto */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Decoración estilo libro antiguo */
        .book-decoration {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 20px;
            height: calc(100% - 40px);
            margin: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body class="h-screen overflow-hidden text-gray-800">

    <div class="container mx-auto h-full flex flex-col p-6">
        
        <!-- Encabezado -->
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-700">Catálogo de Signaturas</h1>
            <p class="text-gray-500 text-sm mt-2">Pasa el ratón o haz clic sobre una signatura para ver su descripción</p>
        </header>

        <!-- Contenedor del contenido principal (lista + libro) -->
        <div class="flex-1 flex flex-col md:flex-row gap-8 overflow-hidden bg-white rounded-xl shadow-lg p-6">
            
            <!-- Panel izquierdo: Lista de Signaturas (Columna A) -->
            <div class="w-full md:w-1/3 flex flex-col h-full border-r border-gray-200 pr-4">
                <h2 class="text-xl font-semibold mb-4 text-gray-600 border-b pb-2">Signaturas</h2>
                
                <!-- Buscador y Botón de guardado -->
                <div class="mb-4 flex flex-col gap-3">
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" placeholder="Buscar signatura..." class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded transition-colors">Buscar</button>
                    </div>
                    <button id="downloadJsonBtn" class="hidden w-full bg-green-600 text-white font-bold py-2 px-4 rounded shadow hover:bg-green-700 transition-colors flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Guardar Cambios (Descargar JSON)
                    </button>
                </div>

                <!-- Contenedor scrollable para la lista -->
                <div class="overflow-y-auto flex-1 pr-2" id="signatureList">
                    <!-- Los elementos se generarán dinámicamente con JavaScript -->
                    <p class="text-gray-400 italic text-sm text-center mt-10">Cargando datos...</p>
                </div>
            </div>

            <!-- Panel derecho: Portada del Libro (Descripción - Columna B) -->
            <div class="w-full md:w-2/3 h-full flex items-center justify-center book-container p-4">
                
                <!-- El libro en sí -->
                <div class="book-cover w-full max-w-lg aspect-[3/4] flex flex-col relative" id="bookCover">
                    <div class="book-decoration text-center relative overflow-hidden">
                        
                        <!-- Botón Eliminar (Oculto por defecto) -->
                        <div class="absolute top-2 right-2 z-10">
                            <button id="deleteBtn" class="hidden text-red-400 hover:text-red-600 bg-red-50/10 hover:bg-red-50/20 p-2 rounded-full transition-all" title="Eliminar esta signatura">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>

                        <!-- Elemento decorativo superior -->
                        <div class="text-yellow-500/50 text-2xl mb-6 mt-4">❦</div>
                        <div class="w-24 h-[1px] bg-gradient-to-r from-transparent via-yellow-500/50 to-transparent mx-auto mb-8"></div>

                        <!-- Descripción (El contenido) -->
                        <div id="bookDescription" class="text-lg leading-relaxed text-gray-300 px-6 font-light overflow-y-auto max-h-[50%] scrollbar-hide">
                            <p class="italic text-gray-400 text-sm">Pasa el cursor o haz clic sobre la lista de la izquierda para explorar el contenido de este archivo.</p>
                        </div>

                        <!-- Elemento decorativo inferior -->
                        <div class="absolute bottom-6 left-0 right-0 text-center">
                            <div class="w-12 h-1 bg-yellow-600/30 mx-auto rounded"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Personalizado -->
    <div id="customModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-md w-full relative">
            <h3 class="text-xl font-bold mb-4 text-gray-800" id="modalTitle">Título</h3>
            <p id="modalMessage" class="mb-4 text-gray-600">Mensaje</p>
            
            <div id="modalForm" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Signatura</label>
                    <input type="text" id="newSignaturaId" class="mt-1 block w-full border border-gray-300 bg-gray-50 rounded-md p-2 text-gray-700" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Descripción <span class="text-red-500">*</span></label>
                    <textarea id="newSignaturaDesc" rows="4" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Escribe la descripción aquí..."></textarea>
                    <p id="modalError" class="hidden mt-1 text-sm text-red-600 font-medium"></p>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button id="modalCancel" class="px-4 py-2 bg-gray-100 text-gray-800 rounded font-medium hover:bg-gray-200 transition-colors">Cancelar</button>
                <button id="modalConfirm" class="px-4 py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700 transition-colors">Aceptar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('signatureList');
            const bookDescription = document.getElementById('bookDescription');
            const bookCover = document.getElementById('bookCover');
            
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const downloadJsonBtn = document.getElementById('downloadJsonBtn');
            const deleteBtn = document.getElementById('deleteBtn');

            let globalData = [];
            let currentKeys = { sig: 'signatura', desc: 'descripcion' };
            let currentDisplayedSignatura = null;
            let dataModified = false;

            function identificarClaves(datos) {
                if (datos.length > 0) {
                    const keys = Object.keys(datos[0]);
                    currentKeys.sig = keys.find(k => k.toLowerCase().includes('signatura')) || keys[0] || 'signatura';
                    currentKeys.desc = keys.find(k => k.toLowerCase().includes('descrip')) || keys[1] || 'descripcion';
                }
            }

            function marcarModificado() {
                dataModified = true;
                downloadJsonBtn.classList.remove('hidden');
            }

            // Función centralizada para mostrar la signatura en el libro
            function mostrarEnLibro(dato, itemDiv) {
                currentDisplayedSignatura = dato;
                deleteBtn.classList.remove('hidden');

                const valorSignatura = dato[currentKeys.sig] || "Sin Signatura";
                const valorDescripcion = dato[currentKeys.desc] || "Sin Descripción";

                bookDescription.innerHTML = `
                    <div class="mb-4 pb-2 border-b border-yellow-600/30">
                        <span class="text-yellow-500 font-semibold text-sm uppercase tracking-wider">Referencia:</span>
                        <p class="text-white text-xl font-bold">${valorSignatura}</p>
                    </div>
                    <p>${valorDescripcion}</p>
                `;

                bookDescription.classList.remove('fade-in');
                void bookDescription.offsetWidth;
                bookDescription.classList.add('fade-in');

                document.querySelectorAll('.signature-item').forEach(el => el.classList.remove('active', 'bg-blue-50'));
                if (itemDiv) {
                    itemDiv.classList.add('active', 'bg-blue-50');
                }
                
                bookCover.style.transform = `rotateY(-5deg) scale(1.02)`;
                setTimeout(() => {
                    bookCover.style.transform = `rotateY(0deg) scale(1)`;
                }, 300);
            }

            function renderizarLista(datosParaMostrar) {
                listContainer.innerHTML = '';

                if (datosParaMostrar.length === 0) {
                    listContainer.innerHTML = '<p class="text-gray-500 italic text-sm text-center mt-10">No hay resultados.</p>';
                    return;
                }

                datosParaMostrar.forEach((dato) => {
                    const valorSignatura = dato[currentKeys.sig] || "Sin Signatura";

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'signature-item p-4 mb-2 rounded bg-gray-50 text-gray-900 font-bold shadow-sm text-lg border border-gray-100';
                    itemDiv.textContent = valorSignatura;
                    
                    // Evento hover y click para máxima comodidad
                    itemDiv.addEventListener('mouseenter', () => mostrarEnLibro(dato, itemDiv));
                    itemDiv.addEventListener('click', () => mostrarEnLibro(dato, itemDiv));

                    listContainer.appendChild(itemDiv);
                });
            }

            function mostrarModal(opciones) {
                document.getElementById('modalTitle').textContent = opciones.titulo;
                document.getElementById('modalMessage').textContent = opciones.mensaje;
                document.getElementById('modalError').classList.add('hidden');
                
                const modalForm = document.getElementById('modalForm');
                if (opciones.mostrarFormulario) {
                    modalForm.classList.remove('hidden');
                    document.getElementById('newSignaturaId').value = opciones.valorSignatura || '';
                    document.getElementById('newSignaturaDesc').value = '';
                } else {
                    modalForm.classList.add('hidden');
                }

                const btnConfirmOld = document.getElementById('modalConfirm');
                const btnCancelOld = document.getElementById('modalCancel');
                btnConfirmOld.replaceWith(btnConfirmOld.cloneNode(true));
                btnCancelOld.replaceWith(btnCancelOld.cloneNode(true));
                
                const btnConfirm = document.getElementById('modalConfirm');
                const btnCancel = document.getElementById('modalCancel');

                btnConfirm.textContent = opciones.textoConfirmar || 'Aceptar';
                btnConfirm.className = `px-4 py-2 text-white rounded font-medium transition-colors ${opciones.colorConfirmar || 'bg-blue-600 hover:bg-blue-700'}`;

                document.getElementById('customModal').classList.remove('hidden');

                btnCancel.addEventListener('click', () => {
                    document.getElementById('customModal').classList.add('hidden');
                });

                btnConfirm.addEventListener('click', () => {
                    if (opciones.mostrarFormulario) {
                        const desc = document.getElementById('newSignaturaDesc').value.trim();
                        if (!desc) {
                            const err = document.getElementById('modalError');
                            err.textContent = "¡La descripción no puede estar en blanco!";
                            err.classList.remove('hidden');
                            return;
                        }
                        opciones.alConfirmar(desc);
                    } else {
                        opciones.alConfirmar();
                    }
                    document.getElementById('customModal').classList.add('hidden');
                });
            }

            function realizarBusqueda() {
                const term = searchInput.value.trim();
                
                if (!term) {
                    renderizarLista(globalData);
                    return;
                }

                const termLower = term.toLowerCase();
                
                // Buscar coincidencia exacta
                const exactMatch = globalData.find(d => (d[currentKeys.sig] || "").toString().toLowerCase() === termLower);

                if (exactMatch) {
                    renderizarLista([exactMatch]);
                    // Seleccionar automáticamente el elemento encontrado en la lista y en el libro
                    setTimeout(() => {
                        const firstItem = document.querySelector('.signature-item');
                        if (firstItem) {
                            mostrarEnLibro(exactMatch, firstItem);
                        }
                    }, 50);
                } else {
                    const partialMatches = globalData.filter(d => (d[currentKeys.sig] || "").toString().toLowerCase().includes(termLower));
                    renderizarLista(partialMatches);

                    if (partialMatches.length > 0) {
                        // Seleccionar el primero de las coincidencias parciales
                        setTimeout(() => {
                            const firstItem = document.querySelector('.signature-item');
                            if (firstItem) {
                                mostrarEnLibro(partialMatches[0], firstItem);
                            }
                        }, 50);
                    } else {
                        mostrarModal({
                            titulo: "Signatura no encontrada",
                            mensaje: `La signatura exacta "${term}" no existe en el catálogo. ¿Deseas añadirla ahora?`,
                            mostrarFormulario: false,
                            textoConfirmar: "Sí, añadir",
                            alConfirmar: () => abrirFormularioAñadir(term)
                        });
                    }
                }
            }

            function abrirFormularioAñadir(nuevaSignaturaStr) {
                mostrarModal({
                    titulo: "Añadir Nueva Signatura",
                    mensaje: "Por favor, introduce una descripción obligatoria para esta nueva entrada.",
                    mostrarFormulario: true,
                    valorSignatura: nuevaSignaturaStr,
                    textoConfirmar: "Guardar Signatura",
                    colorConfirmar: "bg-green-600 hover:bg-green-700",
                    alConfirmar: (descripcion) => {
                        const maxId = globalData.reduce((max, item) => (item.id && item.id > max ? item.id : max), 0);
                        const nuevoItem = {
                            id: maxId + 1,
                            [currentKeys.sig]: nuevaSignaturaStr,
                            [currentKeys.desc]: descripcion
                        };
                        
                        globalData.push(nuevoItem);
                        marcarModificado();
                        searchInput.value = '';
                        renderizarLista(globalData);
                        
                        setTimeout(() => {
                            const items = document.querySelectorAll('.signature-item');
                            const lastItem = Array.from(items).find(el => el.textContent === nuevaSignaturaStr);
                            if(lastItem) mostrarEnLibro(nuevoItem, lastItem);
                        }, 100);
                    }
                });
            }

            searchBtn.addEventListener('click', realizarBusqueda);
            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') realizarBusqueda();
                if (searchInput.value.trim() === '') renderizarLista(globalData);
            });

            deleteBtn.addEventListener('click', () => {
                if (!currentDisplayedSignatura) return;

                const sigEliminar = currentDisplayedSignatura[currentKeys.sig];

                mostrarModal({
                    titulo: "Confirmar Eliminación",
                    mensaje: `¿Estás seguro de que deseas eliminar la signatura "${sigEliminar}"?`,
                    mostrarFormulario: false,
                    textoConfirmar: "Sí, Eliminar",
                    colorConfirmar: "bg-red-600 hover:bg-red-700",
                    alConfirmar: () => {
                        globalData = globalData.filter(d => d[currentKeys.sig] !== sigEliminar);
                        marcarModificado();
                        
                        bookDescription.innerHTML = '<p class="italic text-gray-400 text-sm">Signatura eliminada. Selecciona otra de la lista.</p>';
                        deleteBtn.classList.add('hidden');
                        currentDisplayedSignatura = null;
                        
                        if (searchInput.value.trim() !== '') {
                            realizarBusqueda();
                        } else {
                            renderizarLista(globalData);
                        }
                    }
                });
            });

            downloadJsonBtn.addEventListener('click', () => {
                const jsonString = JSON.stringify(globalData, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'signaturas.json';
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                downloadJsonBtn.classList.add('hidden');
                dataModified = false;
                
                mostrarModal({
                    titulo: "¡Cambios guardados!",
                    mensaje: "Se ha descargado el archivo 'signaturas.json'. Recuerda reemplazar el archivo en tu repositorio de GitHub o en tu carpeta local con este nuevo archivo.",
                    mostrarFormulario: false,
                    textoConfirmar: "Entendido"
                });
            });

            async function cargarArchivoJSON() {
                try {
                    listContainer.innerHTML = '<p class="text-blue-500 italic text-sm text-center mt-10">Cargando signaturas desde JSON...</p>';
                    
                    const response = await fetch('signaturas.json');
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const datosJSON = await response.json();
                    globalData = datosJSON;
                    identificarClaves(globalData);
                    renderizarLista(globalData);
                    
                } catch (e) {
                    console.error("Error al cargar el archivo JSON:", e);
                    listContainer.innerHTML = `
                        <div class="text-red-500 text-sm text-center mt-10 p-4 bg-red-50 rounded-lg border border-red-200 shadow-inner">
                            <strong>Error de carga</strong><br>
                            No se pudo leer <code>signaturas.json</code>.<br><br>
                            <span class="text-xs text-gray-500 block mt-2">Asegúrate de que el archivo está en la misma carpeta.</span>
                        </div>`;
                }
            }

            cargarArchivoJSON();
        });
    </script>
</body>
</html>
