<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación del Libro · Biblioteca de Humanidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { stone: { 50: '#FAF8F5', 100: '#F4F0E8', 200: '#E6DFC', 300: '#D5CBBF', 800: '#2A2725', 900: '#1A1817' }, sand: '#C5A059' }, fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['Space Grotesk', 'monospace'] } } } }
    </script>
    <style>
        body { background-color: #F4F0E8; color: #1A1817; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .editorial-title { font-family: 'Cormorant Garamond', serif; letter-spacing: -0.02em; line-height: 0.95; }
        .grid-line-b { border-bottom: 1px solid rgba(26, 24, 23, 0.12); }
    </style>
</head>
<body class="antialiased selection:bg-stone-800 selection:text-stone-50 flex flex-col min-h-screen">

    <header class="sticky top-0 z-40 bg-stone-100/90 backdrop-blur-md grid-line-b">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center gap-4">
            <div class="flex-1">
                <!-- Muestra dinámicamente la signatura del libro -->
                <span id="headerSignatura" class="block text-sm font-mono font-bold tracking-widest text-stone-800 uppercase">SIGNATURA DEL LIBRO</span>
                <!-- Muestra dinámicamente el título del libro -->
                <span id="headerTitulo" class="text-xs text-stone-600 font-sans tracking-wide block mt-0.5 line-clamp-2">NOMBRE DEL LIBRO</span>
            </div>
            <span class="text-xs font-mono text-sand font-bold tracking-widest uppercase flex-shrink-0 text-right">
                <i class="fa-solid fa-map-pin mr-1"></i> UBICACIÓN FÍSICA
            </span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-12 flex flex-col items-center justify-center gap-6 flex-1 w-full">
        
        <!-- Tarjeta de Localización -->
        <div id="contenedorUbicacion" class="w-full bg-stone-50 border-2 border-stone-900 p-8 shadow-lg relative">
            <div class="flex justify-between items-start border-b border-stone-200 pb-4 mb-6">
                <div>
                    <span class="text-xs font-mono text-sand font-bold tracking-widest uppercase block mb-1">SIGNATURA CONSULTADA</span>
                    <h2 id="lblSignaturaOriginal" class="editorial-title text-3xl md:text-4xl font-bold text-stone-900">--</h2>
                </div>
                <span id="badgeBase" class="bg-stone-900 text-sand text-xs font-mono font-bold px-3 py-1 uppercase tracking-wider">
                    SALA DE LECTURA
                </span>
            </div>

            <!-- Parámetros de Ubicación -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 font-mono text-xs">
                <div class="bg-stone-100 p-4 border border-stone-200">
                    <span class="text-stone-500 uppercase block mb-1">PLANTA</span>
                    <span id="lblPlanta" class="text-base font-bold text-stone-900">--</span>
                </div>
                <div class="bg-stone-100 p-4 border border-stone-200">
                    <span class="text-stone-500 uppercase block mb-1">SALA</span>
                    <span id="lblSala" class="text-base font-bold text-stone-900">--</span>
                </div>
                <div class="bg-stone-100 p-4 border border-stone-200">
                    <span class="text-stone-500 uppercase block mb-1">ESTANTERÍA / MÓDULO</span>
                    <span id="lblEstanteria" class="text-base font-bold text-stone-900">--</span>
                </div>
                <div class="bg-stone-100 p-4 border border-stone-200">
                    <span class="text-stone-500 uppercase block mb-1">DETALLE UBICACIÓN</span>
                    <span id="lblUbicacion" class="text-base font-bold text-stone-900">--</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        function cargarDatosUrl() {
            const params = new URLSearchParams(window.location.search);
            const orig = params.get('orig');
            const sig = params.get('sig');
            const planta = params.get('planta');
            const sala = params.get('sala');
            const ubicacion = params.get('ubicacion');
            const estanteria = params.get('estanteria');
            const titulo = params.get('titulo'); 

            const signaturaMostrar = orig || sig || 'SIGNATURA DEL LIBRO';

            // Actualizar la cabecera dinámica
            document.getElementById('headerSignatura').textContent = signaturaMostrar;
            document.getElementById('headerTitulo').textContent = titulo || 'NOMBRE DEL LIBRO';

            // Actualizar los datos de la tarjeta central
            document.getElementById('lblSignaturaOriginal').textContent = signaturaMostrar;
            document.getElementById('lblPlanta').textContent = planta || '--';
            document.getElementById('lblSala').textContent = sala || '--';
            document.getElementById('lblEstanteria').textContent = estanteria || '--';
            document.getElementById('lblUbicacion').textContent = ubicacion || '--';
        }

        document.addEventListener("DOMContentLoaded", cargarDatosUrl);
    </script>
</body>
</html>
