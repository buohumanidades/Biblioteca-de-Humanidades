<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda por Signatura · Biblioteca de Humanidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { stone: { 50: '#FAF8F5', 100: '#F4F0E8', 200: '#E6DFC', 300: '#D5CBBF', 800: '#2A2725', 900: '#1A1817' }, sand: '#C5A059' }, fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['Space Grotesk', 'monospace'] } } } }
    </script>
    <style>
        body { background-color: #F4F0E8; color: #1A1817; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .editorial-title { font-family: 'Cormorant Garamond', serif; letter-spacing: -0.02em; line-height: 0.95; }
        .grid-line-b { border-bottom: 1px solid rgba(26, 24, 23, 0.12); }
        .modal-active { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content-active { transform: translateY(0) !important; }
    </style>
</head>
<body class="antialiased selection:bg-stone-800 selection:text-stone-50 flex flex-col min-h-screen">

    <header class="sticky top-0 z-40 bg-stone-100/90 backdrop-blur-md grid-line-b">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div>
                <span class="block text-xs font-mono font-medium tracking-[0.3em] text-stone-800 uppercase">B . U . O</span>
                <span class="text-[11px] text-stone-500 font-mono tracking-wider block mt-0.5">CAMPUS DE EL MILÁN</span>
            </div>
            <a href="index.html" class="inline-flex items-center space-x-2 text-xs font-mono px-4 py-2 border border-stone-800 text-stone-800 hover:bg-stone-900 hover:text-stone-100 transition-all uppercase tracking-wider">
                <i class="fa-solid fa-arrow-left text-[10px]"></i><span>Volver al inicio</span>
            </a>
        </div>
    </header>

    <section class="grid-line-b bg-stone-900 text-stone-100 relative overflow-hidden">
        <img src="imagenes/buobh.png" onerror="this.src='https://via.placeholder.com/1300x400?text=Biblioteca'" alt="Biblioteca" class="absolute inset-0 w-full h-full object-cover opacity-20 filter">
        <div class="max-w-7xl mx-auto px-6 py-16 md:py-24 relative z-10 text-center">
            <span class="text-xs font-mono text-sand font-semibold uppercase tracking-widest block mb-4">[ BÚSQUEDA DIRECTA ]</span>
            <h1 class="editorial-title text-4xl md:text-6xl font-light mb-6">Búsqueda por Signatura.</h1>
        </div>
    </section>

    <main class="max-w-3xl mx-auto px-6 py-16 flex flex-col items-center gap-8 flex-1">
        
        <p class="font-mono text-sm text-stone-600 text-center leading-relaxed">
            Recuerda que los libros que se encuentran en las salas son de acceso libre y sus signaturas comienzan por HG.
        </p>
        
        <div class="w-full flex flex-col items-center gap-4">
            <input type="text" id="campoSignatura" class="w-full md:w-3/4 px-6 py-4 text-center font-mono text-xl border-2 border-stone-300 bg-stone-50 text-stone-900 focus:outline-none focus:border-stone-900 focus:bg-white transition-all uppercase placeholder:text-stone-400" 
                   placeholder="HG..." 
                   onfocus="if(this.value.trim() === '') { this.value = 'HG'; setTimeout(() => this.setSelectionRange(2, 2), 0); }" 
                   oninput="this.value = this.value.toUpperCase();">
            
            <button onclick="localizarLibro(event)" class="w-full md:w-3/4 bg-stone-900 text-sand hover:bg-sand hover:text-stone-900 py-4 px-8 font-mono text-sm uppercase tracking-widest font-bold transition-all flex items-center justify-center gap-3">
                <i class="fa-solid fa-location-dot"></i> Localizar en la estantería
            </button>
        </div>

        <div class="w-full md:w-3/4 bg-stone-100 border border-stone-200 p-8 flex flex-col items-center gap-4 mt-8">
            <span class="font-serif text-xl text-stone-800">¿Quieres ver si está disponible?</span>
            <button onclick="buscarEnCatalogo()" class="w-full border border-stone-800 bg-transparent text-stone-800 hover:bg-stone-900 hover:text-stone-100 py-3 font-mono text-xs uppercase tracking-widest transition-all">
                <i class="fa-solid fa-book-open mr-2"></i> Búscalo en el catálogo
            </button>
        </div>
    </main>

    <!-- Modal Alerta -->
    <div id="customModal" class="fixed inset-0 z-[3000] bg-stone-900/60 backdrop-blur-sm flex justify-center items-center opacity-0 pointer-events-none transition-all duration-300" onclick="cerrarModal()">
        <div class="bg-stone-50 w-11/12 max-w-sm p-8 text-center border border-stone-200 transform translate-y-4 transition-transform duration-300 modal-content" onclick="event.stopPropagation()">
            <i class="fa-solid fa-circle-exclamation text-4xl text-sand mb-4"></i>
            <p id="modalMessage" class="font-sans text-sm text-stone-700 mb-8 whitespace-pre-wrap leading-relaxed">Mensaje</p>
            <button onclick="cerrarModal()" class="w-full bg-stone-900 text-stone-100 py-3 font-mono text-xs uppercase tracking-widest hover:bg-sand hover:text-stone-900 transition-colors">
                Aceptar
            </button>
        </div>
    </div>

    <script>
        function mostrarModal(mensaje) {
            document.getElementById("modalMessage").innerText = mensaje;
            const modal = document.getElementById("customModal");
            const content = modal.querySelector('.modal-content');
            modal.classList.add("modal-active");
            content.classList.add("modal-content-active");
        }

        function cerrarModal() {
            const modal = document.getElementById("customModal");
            const content = modal.querySelector('.modal-content');
            modal.classList.remove("modal-active");
            content.classList.remove("modal-content-active");
        }

        function localizarLibro(event) {
            event.preventDefault();
            let signatura = document.getElementById("campoSignatura").value.trim();

            if (signatura === "" || signatura === "HG") {
                mostrarModal("Por favor, escribe una signatura válida.");
                return;
            }
            if (!signatura.startsWith("HG")) {
                mostrarModal("Recuerda que los libros que se encuentran en las salas comienzan por HG.\n\nSi tu signatura: " + signatura + " es correcta, te ayudaremos a localizar el libro. Pregunta en el mostrador al personal de biblioteca.");
                return; 
            }

            let fichero = signatura.replace(/\/AST$/i, "").replace(/\/COMIC$/i, "");
            if (!fichero.endsWith("/4")) {
                fichero = fichero.replace(/(?<![a-zA-Z])CR(?![a-zA-Z]).*/i, "CR");
            }

            let sig = "";
            let ultimoIndiceBarra = fichero.lastIndexOf("/");

            if (ultimoIndiceBarra !== -1) {
                let parteDerecha = fichero.substring(ultimoIndiceBarra + 1);
                if (parteDerecha === "4") sig = "HG/4";
                else sig = fichero.substring(0, ultimoIndiceBarra);
            } else {
                sig = fichero;
            }

            window.open("localizador.html?sig=" + encodeURIComponent(sig) + "&orig=" + encodeURIComponent(signatura), "_blank");
        }
        
        function buscarEnCatalogo() {
            const signatura = document.getElementById("campoSignatura").value.trim();
            if (signatura === "" || signatura === "HG") {
                window.open("https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac", "_blank");
            } else {
                const urlBase = "https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=131&xsqf01=";
                const urlFinal = urlBase + encodeURIComponent('"' + signatura + '"') + "&START=1&FORM=1";
                window.open(urlFinal, "_blank");
            }
        }
    </script>
</body>
</html>
