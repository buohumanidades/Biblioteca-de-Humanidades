<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación del Libro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stone: {
                            50: '#FAF8F5',
                            100: '#F4F0E8',
                            200: '#E6DFC6',
                            300: '#D5CBBF',
                            800: '#2A2725',
                            900: '#1A1817',
                        },
                        sand: '#C5A059',
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'Georgia', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: transparent; /* Permite que se vea limpio dentro del modal */
        }
        /* Oculta scrollbar por estética */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #FAF8F5; }
        ::-webkit-scrollbar-thumb { background: #D5CBBF; border-radius: 4px; }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center">

    <div class="w-full h-full flex flex-col bg-[#FAF8F5] max-w-4xl">
        
        <!-- BARRA SUPERIOR: EXCLUSIVA PARA CERRAR -->
        <div class="flex justify-end items-center p-4 border-b border-stone-200 bg-white">
            <button onclick="cerrarUbicacion()" class="font-mono text-xs text-stone-600 hover:text-stone-900 border border-stone-300 hover:border-stone-800 px-4 py-2 transition-colors uppercase tracking-wider flex items-center gap-2 rounded-sm shadow-sm">
                <i class="fa-solid fa-xmark text-sm"></i>
                <span>CERRAR VENTANA</span>
            </button>
        </div>

        <!-- CONTENIDO PRINCIPAL: TÍTULO Y SIGNATURA -->
        <div class="flex-1 p-6 md:p-10 flex flex-col justify-center overflow-y-auto">
            
            <div class="mb-10 text-center">
                <span class="text-xs font-mono text-stone-500 tracking-widest uppercase block mb-3">
                    Título del Libro
                </span>
                <h1 id="headerTitulo" class="text-3xl md:text-5xl font-serif text-stone-900 leading-tight mb-6 font-bold px-4">
                    Cargando título...
                </h1>
                
                <span class="text-xs font-mono text-stone-500 tracking-widest uppercase block mb-2">
                    Signatura
                </span>
                <span id="headerSignatura" class="inline-block bg-stone-900 text-sand px-6 py-2.5 font-mono text-lg md:text-xl font-bold tracking-wider rounded-md shadow-md">
                    --
                </span>
            </div>

            <!-- TARJETA DE UBICACIÓN (Planta, Sala, Ubicación, Estantería) -->
            <div class="bg-stone-900 text-stone-100 rounded-lg shadow-xl overflow-hidden border border-stone-800 mx-auto w-full max-w-3xl">
                <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-stone-700">
                    
                    <!-- Planta -->
                    <div class="p-6 md:p-8 flex flex-col items-center text-center bg-stone-900/50">
                        <span class="font-mono text-[11px] uppercase text-stone-400 tracking-widest mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-building text-stone-500"></i> Planta
                        </span>
                        <span id="lblPlanta" class="font-sans text-2xl md:text-3xl text-stone-100 font-semibold">--</span>
                    </div>

                    <!-- Sala -->
                    <div class="p-6 md:p-8 flex flex-col items-center text-center bg-stone-900/50">
                        <span class="font-mono text-[11px] uppercase text-stone-400 tracking-widest mb-2 flex items-center gap-2">
                            <i class="fa-regular fa-map text-stone-500"></i> Sala
                        </span>
                        <span id="lblSala" class="font-sans text-2xl md:text-3xl text-stone-100 font-semibold">--</span>
                    </div>

                    <!-- Ubicación -->
                    <div class="p-6 md:p-8 flex flex-col items-center text-center bg-stone-900/50">
                        <span class="font-mono text-[11px] uppercase text-stone-400 tracking-widest mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-location-crosshairs text-stone-500"></i> Ubicación
                        </span>
                        <span id="lblUbicacion" class="font-sans text-2xl md:text-3xl text-stone-100 font-semibold">--</span>
                    </div>
                </div>
                
                <!-- Estantería (Destacado en bloque inferior dorado) -->
                <div class="bg-sand text-stone-900 p-8 text-center border-t border-stone-800">
                    <span class="font-mono text-[12px] font-bold uppercase tracking-widest block mb-2 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-books"></i> NÚMERO DE ESTANTERÍA
                    </span>
                    <span id="lblEstanteria" class="font-sans text-5xl md:text-6xl font-extrabold block tracking-tight">
                        --
                    </span>
                </div>
            </div>

        </div>
    </div>

    <script>
        function cargarDatosUrl() {
            const params = new URLSearchParams(window.location.search);
            const orig = params.get('orig');
            const sig = params.get('sig');
            const planta = params.get('planta');
            const sala = params.get('sala');
            const ubicacion = params.get('ubicacion');
            const estanteria = params.get('estanteria');
            const titulo = params.get('titulo');

            const signaturaMostrar = orig || sig;

            document.getElementById('headerTitulo').textContent = titulo || 'Libro sin título especificado';
            document.getElementById('headerSignatura').textContent = signaturaMostrar || 'S/S';
            
            document.getElementById('lblPlanta').textContent = planta || '--';
            document.getElementById('lblSala').textContent = sala || '--';
            document.getElementById('lblUbicacion').textContent = ubicacion || '--';
            document.getElementById('lblEstanteria').textContent = estanteria || '--';
        }

        // Función para cerrar que se comunica con el contenedor Iframe padre
        function cerrarUbicacion() {
            if (window.parent && typeof window.parent.cerrarModalLocalizador === 'function') {
                window.parent.cerrarModalLocalizador();
            } else if (window.opener) {
                window.close();
            } else {
                window.history.back();
            }
        }

        document.addEventListener("DOMContentLoaded", cargarDatosUrl);
    </script>
</body>
</html>
