<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente de Biblioteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #d1d7db;
        }
        .chat-bg {
            background-color: #efeae2;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .message-in::before {
            content: "";
            position: absolute;
            top: 0;
            left: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 10px 10px 0;
            border-color: transparent #ffffff transparent transparent;
        }
        .message-out::before {
            content: "";
            position: absolute;
            top: 0;
            right: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 10px 10px;
            border-color: transparent transparent transparent #dcf8c6;
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .markdown-body p { margin-bottom: 0.4rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.2rem; margin-bottom: 0.4rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.2rem; margin-bottom: 0.4rem; }
        .markdown-body strong { font-weight: 700; color: #111827; }
    </style>
</head>
<body class="flex justify-center items-center h-screen m-0 p-0 overflow-hidden sm:py-6">

    <div class="w-full h-full sm:max-w-xl md:max-w-2xl lg:max-w-3xl sm:h-[850px] sm:max-h-full flex flex-col bg-white sm:rounded-xl sm:shadow-2xl overflow-hidden relative">
        
        <header class="bg-[#008069] text-white flex items-center px-4 py-3 shadow-md z-10 flex-shrink-0">
            <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center overflow-hidden mr-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#008069]" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M12 1.586l-4 4v12.828l4-4V1.586zM3.707 3.293A1 1 0 002 4v10a1 1 0 00.293.707L6 18.414V5.586L3.707 3.293zM17.707 5.293L14 1.586v12.828l2.293 2.293A1 1 0 0018 16V6a1 1 0 00-.293-.707z" clip-rule="evenodd" />
                </svg>
            </div>
            
            <div class="flex-1 cursor-pointer">
                <h1 class="text-base font-semibold whitespace-nowrap overflow-hidden text-ellipsis">Asistente de Biblioteca</h1>
                <p class="text-xs text-green-100" id="status-text">en línea</p>
            </div>
            
            <div class="flex gap-2 items-center">
                <button type="button" id="reset-btn" title="Nueva consulta (Borrar memoria)" class="hover:bg-white/20 px-2.5 py-1 rounded-lg transition flex items-center gap-1 text-xs bg-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="hidden sm:inline">Nueva consulta</span>
                </button>
            </div>
        </header>

        <main id="chat-container" class="flex-1 overflow-y-auto chat-bg p-4 flex flex-col gap-3 relative pb-24">
            <div class="flex justify-center my-2">
                <span class="text-xs text-gray-500 bg-[#f4f4f4] px-3 py-1 rounded-lg shadow-sm">Hoy</span>
            </div>

            <div class="flex w-full mt-2 space-x-3 max-w-[88%] sm:max-w-lg md:max-w-xl">
                <div class="relative bg-white p-3 rounded-lg rounded-tl-none shadow-sm text-sm text-gray-800 message-in">
                    <p>¡Hola! Soy el asistente virtual de la biblioteca. 📚 ¿En qué puedo ayudarte hoy? Puedes preguntarme por títulos, autores o temáticas.</p>
                    
                    <div class="mt-2.5 pt-2 border-t border-gray-100">
                        <span class="text-[11px] text-gray-500 block mb-1">Prueba una consulta temática:</span>
                        <button type="button" onclick="sendQuickPrompt('Libros relacionados con la industria en Asturias y preferentemente con el acero')" 
                                class="text-left text-xs bg-[#f0fdf4] hover:bg-[#dcfce7] text-[#008069] border border-[#bbf7d0] rounded-lg px-2.5 py-1.5 transition block w-full font-medium">
                            💡 "Industria en Asturias y acero"
                        </button>
                    </div>
                    <span class="text-[10px] text-gray-400 float-right mt-1 ml-2 text-right" id="initial-time"></span>
                </div>
            </div>
        </main>

        <footer class="bg-[#f0f0f0] p-2 flex items-end gap-2 absolute bottom-0 w-full z-10">
            <div class="flex-1 bg-white rounded-3xl flex items-center px-4 py-2 shadow-sm min-h-[44px]">
                <input type="text" id="chat-input" placeholder="Describe un tema, autor o haz una pregunta..." 
                       class="flex-1 bg-transparent focus:outline-none text-sm py-1 w-full disabled:opacity-50"
                       autocomplete="off">
            </div>
            
            <button type="button" id="send-btn" class="bg-[#00a884] text-white rounded-full h-11 w-11 flex items-center justify-center flex-shrink-0 hover:bg-[#008069] transition shadow-sm focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </footer>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwPQ8TCivmIH_zTkFnNk8kt9g4o9n4kcwCfwDhZTEexX3CL1RCypmF0j3flagF_3dTTDA/exec";

        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusText = document.getElementById('status-text');

        let historialConversacion = [];
        let titulosMostradosGlobal = [];

        function getCurrentTime() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        document.getElementById('initial-time').innerText = getCurrentTime();

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        // Normalización idéntica a la del backend (protegiendo la ñ para evitar desajustes)
        function normalizarClave(texto) {
            let base = String(texto || '').split(/[:\/]/)[0].replace(/\([^)]*\)/g, '');
            let limpia = base
                .toLowerCase()
                .replace(/ñ/g, '__enye__')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/__enye__/g, 'ñ')
                .replace(/[^a-z0-9ñ\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            return limpia.length >= 5 ? limpia : String(texto || '').toLowerCase().trim();
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function setLoadingState(isLoading) {
            chatInput.disabled = isLoading;
            sendBtn.disabled = isLoading;
            if (!isLoading) chatInput.focus();
        }

        function addMessage(text, isUser = false) {
            const time = getCurrentTime();
            const messageDiv = document.createElement('div');
            
            historialConversacion.push({
                rol: isUser ? "Usuario" : "Asistente",
                texto: text
            });
            if (historialConversacion.length > 8) {
                historialConversacion.shift();
            }

            if (isUser) {
                messageDiv.className = "flex w-full mt-2 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg ml-auto justify-end";
                messageDiv.innerHTML = `
                    <div class="relative bg-[#dcf8c6] p-2.5 rounded-lg rounded-tr-none shadow-sm text-sm text-gray-800 message-out">
                        <p class="break-words whitespace-pre-wrap">${escapeHTML(text)}</p>
                        <span class="text-[10px] text-gray-500 float-right mt-1 ml-2 text-right flex items-center gap-1">
                            ${time}
                            <svg viewBox="0 0 16 15" width="16" height="15" class="text-blue-500 fill-current">
                                <path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.365.365 0 0 0-.063-.51z"></path>
                            </svg>
                        </span>
                    </div>
                `;
            } else {
                const formattedHTML = marked.parse(text);
                messageDiv.className = "flex w-full mt-2 space-x-3 max-w-[88%] sm:max-w-lg md:max-w-xl";
                messageDiv.innerHTML = `
                    <div class="relative bg-white p-3 rounded-lg rounded-tl-none shadow-sm text-sm text-gray-800 message-in">
                        <div class="markdown-body break-words">${formattedHTML}</div>
                        <span class="text-[10px] text-gray-400 float-right mt-1 ml-2 text-right">${time}</span>
                    </div>
                `;
            }
            
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function showTypingIndicator() {
            statusText.innerText = "buscando en el catálogo...";
            const typingDiv = document.createElement('div');
            typingDiv.id = "typing-indicator";
            typingDiv.className = "flex w-full mt-2 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg";
            typingDiv.innerHTML = `
                <div class="relative bg-white p-3 rounded-lg rounded-tl-none shadow-sm text-sm text-gray-500 message-in flex items-center justify-center gap-1">
                    <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            statusText.innerText = "en línea";
            const typingDiv = document.getElementById('typing-indicator');
            if (typingDiv) typingDiv.remove();
        }

        function sendQuickPrompt(promptText) {
            chatInput.value = promptText;
            handleSend();
        }

        async function handleSend() {
            const texto = chatInput.value.trim();
            if (!texto) return;

            // 1. Guardar copia del historial ANTES de añadir el mensaje nuevo para no enviarlo duplicado
            const historialPrevio = [...historialConversacion];

            addMessage(texto, true);
            chatInput.value = '';
            setLoadingState(true);
            showTypingIndicator();
            
            try {
                const respuesta = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ 
                        mensaje: texto,
                        historial: historialPrevio,
                        excluidos: titulosMostradosGlobal
                    })
                });
                
                const datos = await respuesta.json();
                removeTypingIndicator();
                setLoadingState(false);
                
                if (datos.texto) {
                    addMessage(datos.texto, false);
                }
                
                if (datos.libros && Array.isArray(datos.libros) && datos.libros.length > 0) {
                    const librosAgrupadosMap = new Map();

                    datos.libros.forEach(libro => {
                        const titulo = String(libro.titulo || libro.Titulo || libro.Título || 'Sin título').trim();
                        const autor = String(libro.autor || libro.Autor || 'Sin autor').trim();
                        
                        let listaSignaturas = [];
                        if (Array.isArray(libro.signaturas) && libro.signaturas.length > 0) {
                            listaSignaturas = libro.signaturas.map(s => String(s).trim()).filter(Boolean);
                        } else {
                            const sigRaw = String(libro.signatura || libro.Signatura || 'S/N');
                            listaSignaturas = sigRaw.split(/\s*\|\|\|\s*/).map(s => s.trim()).filter(Boolean);
                        }

                        const claveTitulo = normalizarClave(titulo);
                        
                        if (!titulosMostradosGlobal.includes(claveTitulo)) {
                            titulosMostradosGlobal.push(claveTitulo);
                        }

                        if (!librosAgrupadosMap.has(claveTitulo)) {
                            librosAgrupadosMap.set(claveTitulo, {
                                titulo: titulo,
                                autor: autor,
                                signaturas: [...listaSignaturas]
                            });
                        } else {
                            const libroExistente = librosAgrupadosMap.get(claveTitulo);
                            listaSignaturas.forEach(sig => {
                                if (!libroExistente.signaturas.some(s => s.toLowerCase() === sig.toLowerCase())) {
                                    libroExistente.signaturas.push(sig);
                                }
                            });
                        }
                    });

                    // Añadir resumen de títulos mostrados al historial en memoria para que la IA sepa qué recomendó en segundas preguntas
                    const titulosPresentados = Array.from(librosAgrupadosMap.values())
                        .map(l => `"${l.titulo}" (${l.autor})`)
                        .join('; ');
                    if (historialConversacion.length > 0 && historialConversacion[historialConversacion.length - 1].rol === "Asistente") {
                        historialConversacion[historialConversacion.length - 1].texto += ` [Libros aportados: ${titulosPresentados}]`;
                    }

                    let htmlTarjetas = '';
                    librosAgrupadosMap.forEach(libro => {
                        const safeTitulo = escapeHTML(libro.titulo);
                        const safeAutor = escapeHTML(libro.autor);
                        
                        const etiquetasSignaturas = libro.signaturas.map(sig => {
                            let queryParaOpac = '';
                            const esHG = sig.trim().toUpperCase().startsWith('HG');
                            
                            if (esHG) {
                                queryParaOpac = libro.titulo;
                                queryParaOpac = queryParaOpac.replace(/ñ/g, '__ENYE__').replace(/Ñ/g, '__ENYEMAY__');
                                queryParaOpac = queryParaOpac.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); 
                                queryParaOpac = queryParaOpac.replace(/__ENYE__/g, 'ñ').replace(/__ENYEMAY__/g, 'Ñ');
                                queryParaOpac = queryParaOpac.replace(/[^a-zA-Z0-9\sñÑ]/g, ' '); 
                                
                                const stopwords = ['el','la','los','las','un','una','unos','unas','a','ante','bajo','cabe','con','contra','de','desde','en','entre','hacia','hasta','para','por','segun','sin','so','sobre','tras','y','e','ni','que','o','u','al','del','su','sus'];
                                const stopRegex = new RegExp('\\b(' + stopwords.join('|') + ')\\b', 'gi');
                                queryParaOpac = queryParaOpac.replace(stopRegex, ' ');
                                queryParaOpac = queryParaOpac.replace(/\s+/g, ' ').trim();
                            } else {
                                queryParaOpac = sig.trim();
                            }
                            
                            const searchParams = new URLSearchParams();
                            searchParams.append('ACC', 'DOSEARCH');
                            searchParams.append('xsqf99', queryParaOpac);
                            const opacUrl = `https://buoabsys.cpd.uniovi.es/cgi-bin/abnetopac?${searchParams.toString()}`;

                            return `<a href="${opacUrl}" target="_blank" rel="noopener noreferrer" title="Buscar en OPAC" class="bg-[#f0f0f0] border border-gray-200 px-2 py-1 rounded font-mono text-[11px] font-bold text-[#008069] hover:bg-green-50 hover:border-green-300 transition-colors cursor-pointer inline-flex items-center gap-1 no-underline">
                                📍 ${escapeHTML(sig)}
                            </a>`;
                        }).join('');

                        htmlTarjetas += `
                            <div class="flex w-full mt-1.5 space-x-3 max-w-[92%] sm:max-w-lg md:max-w-xl">
                                <div class="relative bg-white p-3.5 rounded-lg shadow-sm border-l-4 border-[#00a884] text-sm text-gray-800 w-full ml-1">
                                    <strong class="text-gray-900 block break-words leading-snug" title="${safeTitulo}">${safeTitulo}</strong>
                                    <span class="text-xs text-gray-600 block break-words mt-1" title="${safeAutor}">${safeAutor}</span>
                                    <div class="mt-3 pt-2.5 border-t border-gray-100 flex justify-between items-center gap-2 flex-wrap">
                                        <div class="flex flex-wrap gap-1.5">
                                            ${etiquetasSignaturas}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    chatContainer.insertAdjacentHTML('beforeend', htmlTarjetas);
                    scrollToBottom();
                }
            } catch (error) {
                console.error("Error en handleSend:", error);
                removeTypingIndicator();
                setLoadingState(false);
                addMessage("⚠️ Error de conexión o formato de datos. Revisa la consola (F12) para ver los detalles del problema.", false);
            }
        }

        resetBtn.addEventListener('click', () => {
            historialConversacion = [];
            titulosMostradosGlobal = [];
            const divider = document.createElement('div');
            divider.className = "flex justify-center my-3";
            divider.innerHTML = `<span class="text-[11px] text-[#008069] bg-green-50 border border-green-200 px-3 py-1 rounded-full shadow-sm">🔄 Memoria reiniciada. ¿Qué nueva temática buscamos?</span>`;
            chatContainer.appendChild(divider);
            scrollToBottom();
        });

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        });

        window.onload = scrollToBottom;
    </script>
</body>
</html>
