<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente de Biblioteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #d1d7db;
        }
        .chat-bg {
            background-color: #efeae2;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .message-in::before {
            content: "";
            position: absolute;
            top: 0;
            left: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 10px 10px 0;
            border-color: transparent #ffffff transparent transparent;
        }
        .message-out::before {
            content: "";
            position: absolute;
            top: 0;
            right: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 10px 10px;
            border-color: transparent transparent transparent #dcf8c6;
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex justify-center items-center h-screen m-0 p-0 overflow-hidden sm:py-6">

    <!-- Contenedor principal: 100% en móvil, más ancho en tablet/ordenador -->
    <div class="w-full h-full sm:max-w-xl md:max-w-2xl lg:max-w-3xl sm:h-[850px] sm:max-h-full flex flex-col bg-white sm:rounded-xl sm:shadow-2xl overflow-hidden relative">
        
        <header class="bg-[#008069] text-white flex items-center px-4 py-3 shadow-md z-10 flex-shrink-0">
            <button class="mr-2 hover:bg-white/20 p-1 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </button>
            
            <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center overflow-hidden mr-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#008069]" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M12 1.586l-4 4v12.828l4-4V1.586zM3.707 3.293A1 1 0 002 4v10a1 1 0 00.293.707L6 18.414V5.586L3.707 3.293zM17.707 5.293L14 1.586v12.828l2.293 2.293A1 1 0 0018 16V6a1 1 0 00-.293-.707z" clip-rule="evenodd" />
                </svg>
            </div>
            
            <div class="flex-1 cursor-pointer">
                <h1 class="text-base font-semibold whitespace-nowrap overflow-hidden text-ellipsis">Asistente de Biblioteca</h1>
                <p class="text-xs text-green-100" id="status-text">en línea</p>
            </div>
            
            <div class="flex gap-4 items-center">
                <button class="hover:bg-white/20 p-1 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </header>

        <main id="chat-container" class="flex-1 overflow-y-auto chat-bg p-4 flex flex-col gap-3 relative pb-20">
            <div class="flex justify-center my-2">
                <span class="text-xs text-gray-500 bg-[#f4f4f4] px-3 py-1 rounded-lg shadow-sm">Hoy</span>
            </div>

            <div class="flex w-full mt-2 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg">
                <div class="relative bg-white p-2 rounded-lg rounded-tl-none shadow-sm text-sm text-gray-800 message-in">
                    <p>¡Hola! Soy el asistente virtual de la biblioteca. 📚 ¿En qué puedo ayudarte hoy? Puedes preguntarme por títulos, autores o temáticas.</p>
                    <span class="text-[10px] text-gray-400 float-right mt-1 ml-2 text-right" id="initial-time"></span>
                </div>
            </div>
        </main>

        <footer class="bg-[#f0f0f0] p-2 flex items-end gap-2 absolute bottom-0 w-full z-10">
            <div class="flex-1 bg-white rounded-3xl flex items-center px-4 py-2 shadow-sm min-h-[44px]">
                <button class="text-gray-400 hover:text-gray-600 mr-2 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>
                
                <input type="text" id="chat-input" placeholder="Escribe un mensaje" 
                       class="flex-1 bg-transparent focus:outline-none text-sm py-1 w-full"
                       autocomplete="off">
                
                <button class="text-gray-400 hover:text-gray-600 ml-2 focus:outline-none transform -rotate-45">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                </button>
            </div>
            
            <button id="send-btn" class="bg-[#00a884] text-white rounded-full h-11 w-11 flex items-center justify-center flex-shrink-0 hover:bg-[#008069] transition shadow-sm focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </footer>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const statusText = document.getElementById('status-text');

        function getCurrentTime() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        document.getElementById('initial-time').innerText = getCurrentTime();

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addMessage(text, isUser = false) {
            const time = getCurrentTime();
            const messageDiv = document.createElement('div');
            
            if (isUser) {
                messageDiv.className = "flex w-full mt-2 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg ml-auto justify-end";
                messageDiv.innerHTML = `
                    <div class="relative bg-[#dcf8c6] p-2 rounded-lg rounded-tr-none shadow-sm text-sm text-gray-800 message-out">
                        <p>${text}</p>
                        <span class="text-[10px] text-gray-500 float-right mt-1 ml-2 text-right flex items-center gap-1">
                            ${time}
                            <svg viewBox="0 0 16 15" width="16" height="15" class="text-gray-400 fill-current checkmarks">
                                <path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.365.365 0 0 0-.063-.51z"></path>
                            </svg>
                        </span>
                    </div>
                `;
            } else {
                messageDiv.className = "flex w-full mt-2 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg";
                messageDiv.innerHTML = `
                    <div
