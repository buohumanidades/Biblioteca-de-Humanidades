<script>
    const chatContainer = document.getElementById('chat-container');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const statusText = document.getElementById('status-text');

    // Memoria local de la conversación y libros mostrados para evitar repeticiones
    let historialConversacion = [];
    let titulosMostradosGlobal = [];

    function getCurrentTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    document.getElementById('initial-time').innerText = getCurrentTime();

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function normalizarClave(texto) {
        let base = String(texto || '').split(/[:\/]/)[0].replace(/\([^)]*\)/g, '');
        let limpia = base
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^\w\s]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
        return limpia.length >= 5 ? limpia : String(texto || '').toLowerCase().trim();
    }

    function addMessage(text, isUser = false) {
        const time = getCurrentTime();
        const messageDiv = document.createElement('div');
        
        // Guardar en el historial local para la IA
        historialConversacion.push({
            rol: isUser ? "Usuario" : "Asistente",
            texto: text
        });
        // Mantener solo los últimos 6 mensajes para no saturar
        if (historialConversacion.length > 6) {
            historialConversacion.shift();
        }

        if (isUser) {
            messageDiv.className = "flex w-full mt-2 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg ml-auto justify-end";
            messageDiv.innerHTML = `
                <div class="relative bg-[#dcf8c6] p-2 rounded-lg rounded-tr-none shadow-sm text-sm text-gray-800 message-out">
                    <p class="break-words">${text}</p>
                    <span class="text-[10px] text-gray-500 float-right mt-1 ml-2 text-right flex items-center gap-1">
                        ${time}
                        <svg viewBox="0 0 16 15" width="16" height="15" class="text-gray-400 fill-current checkmarks">
                            <path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.365.365 0 0 0-.063-.51z"></path>
                        </svg>
                    </span>
                </div>
            `;
        } else {
            messageDiv.className = "flex w-full mt-2 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg";
            messageDiv.innerHTML = `
                <div class="relative bg-white p-2 rounded-lg rounded-tl-none shadow-sm text-sm text-gray-800 message-in">
                    <p class="break-words">${text}</p>
                    <span class="text-[10px] text-gray-400 float-right mt-1 ml-2 text-right">${time}</span>
                </div>
            `;
        }
        
        chatContainer.appendChild(messageDiv);
        scrollToBottom();
        
        if (isUser) {
            const checkmarks = messageDiv.querySelector('.checkmarks');
            setTimeout(() => {
                checkmarks.classList.remove('text-gray-400');
                checkmarks.classList.add('text-blue-500');
            }, 800);
        }
    }

    function showTypingIndicator() {
        statusText.innerText = "escribiendo...";
        const typingDiv = document.createElement('div');
        typingDiv.id = "typing-indicator";
        typingDiv.className = "flex w-full mt-2 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg";
        typingDiv.innerHTML = `
            <div class="relative bg-white p-3 rounded-lg rounded-tl-none shadow-sm text-sm text-gray-500 message-in flex items-center justify-center gap-1">
                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
            </div>
        `;
        chatContainer.appendChild(typingDiv);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        statusText.innerText = "en línea";
        const typingDiv = document.getElementById('typing-indicator');
        if (typingDiv) typingDiv.remove();
    }

    async function handleSend() {
        const texto = chatInput.value.trim();
        if (!texto) return;

        addMessage(texto, true);
        chatInput.value = '';
        
        showTypingIndicator();
        
        try {
            // Enviamos el mensaje junto con el historial y los títulos ya mostrados
            const respuesta = await fetch('https://script.google.com/macros/s/AKfycbwPQ8TCivmIH_zTkFnNk8kt9g4o9n4kcwCfwDhZTEexX3CL1RCypmF0j3flagF_3dTTDA/exec', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    mensaje: texto,
                    historial: historialConversacion,
                    excluidos: titulosMostradosGlobal
                })
            });
            
            const datos = await respuesta.json();
            removeTypingIndicator();
            
            if (datos.texto) {
                addMessage(datos.texto, false);
            }
            
            if (datos.libros && Array.isArray(datos.libros) && datos.libros.length > 0) {
                const librosAgrupadosMap = new Map();

                datos.libros.forEach(libro => {
                    const titulo = String(libro.titulo || libro.Titulo || libro.Título || 'Sin título').trim();
                    const autor = String(libro.autor || libro.Autor || 'Sin autor').trim();
                    
                    let listaSignaturas = [];
                    if (Array.isArray(libro.signaturas) && libro.signaturas.length > 0) {
                        listaSignaturas = libro.signaturas.map(s => String(s).trim()).filter(Boolean);
                    } else {
                        const sigRaw = String(libro.signatura || libro.Signatura || 'S/N');
                        listaSignaturas = sigRaw.split(/\s*\|\|\|\s*/).map(s => s.trim()).filter(Boolean);
                    }

                    const claveTitulo = normalizarClave(titulo);
                    
                    // Guardamos en la memoria global para no repetirlos si piden más resultados
                    if (!titulosMostradosGlobal.includes(claveTitulo)) {
                        titulosMostradosGlobal.push(claveTitulo);
                    }

                    if (!librosAgrupadosMap.has(claveTitulo)) {
                        librosAgrupadosMap.set(claveTitulo, {
                            titulo: titulo,
                            autor: autor,
                            signaturas: [...listaSignaturas]
                        });
                    } else {
                        const libroExistente = librosAgrupadosMap.get(claveTitulo);
                        listaSignaturas.forEach(sig => {
                            if (!libroExistente.signaturas.some(s => s.toLowerCase() === sig.toLowerCase())) {
                                libroExistente.signaturas.push(sig);
                            }
                        });
                    }
                });

                let htmlTarjetas = '';
                librosAgrupadosMap.forEach(libro => {
                    const etiquetasSignaturas = libro.signaturas.map(sig => 
                        `<span class="bg-[#f0f0f0] border border-gray-200 px-2 py-1 rounded font-mono text-[11px] font-bold text-gray-700">📍 ${sig}</span>`
                    ).join('');

                    htmlTarjetas += `
                        <div class="flex w-full mt-1 space-x-3 max-w-[85%] sm:max-w-md md:max-w-lg">
                            <div class="relative bg-white p-3 rounded-lg shadow-sm border-l-4 border-[#00a884] text-sm text-gray-800 w-full ml-2">
                                <strong class="text-gray-900 block break-words" title="${libro.titulo}">${libro.titulo}</strong>
                                <span class="text-xs text-gray-600 block break-words mt-0.5" title="${libro.autor}">${libro.autor}</span>
                                <div class="mt-2 flex justify-between items-end gap-2">
                                    <div class="flex flex-wrap gap-1.5">
                                        ${etiquetasSignaturas}
                                    </div>
                                    <span class="text-[10px] text-gray-400 flex-shrink-0">${getCurrentTime()}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                chatContainer.insertAdjacentHTML('beforeend', htmlTarjetas);
                scrollToBottom();
            }
        } catch (error) {
            removeTypingIndicator();
            addMessage("Error de conexión con el servidor en la nube. Verifica tu URL de Google Apps Script.", false);
        }
    }

    sendBtn.addEventListener('click', handleSend);
    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSend();
        }
    });

    window.onload = scrollToBottom;
</script>
