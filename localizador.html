import json

def buscar_signatura(signatura_libro, archivo_json):
    # Pasamos la signatura del libro a minúsculas para ignorar mayúsculas/minúsculas
    sig_libro = signatura_libro.lower()
    
    with open(archivo_json, 'r', encoding='utf-8') as f:
        registros = json.load(f)
        
    for registro in registros:
        # Extraemos los campos y los pasamos a minúsculas
        sig_campo = registro.get("signatura", "").lower()
        inicio = registro.get("inicio", "").lower()
        fin = registro.get("fin", "").lower()
        
        # 1. Comprobamos que el campo signatura base coincide (ej. HG860)
        if sig_campo in sig_libro:
            
            # 2. Si inicio está en blanco, este es el registro correcto
            if inicio == "":
                return registro
            
            # 3. Si inicio NO está en blanco, comparamos si es menor o igual
            if inicio <= sig_libro:
                
                # 4. Comparamos si el fin es mayor o igual
                if fin >= sig_libro:
