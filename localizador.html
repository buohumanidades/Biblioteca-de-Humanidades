<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizando en mapa | Biblioteca</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f2f2f7; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            color: #1c1c1e;
        }
        
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        h1 { color: #007AFF; margin-top: 0; font-size: 1.6em; }
        
        .signatura-badge {
            display: inline-block;
            font-size: 1.2em;
            font-weight: bold;
            color: #ffffff;
            background-color: #34495e;
            padding: 8px 15px;
            border-radius: 8px;
            margin: 15px 0;
            letter-spacing: 1px;
        }
        
        .info-text { color: #8e8e93; font-size: 1em; line-height: 1.4; }

        .loader { 
            border: 6px solid #e5e5ea; 
            border-top: 6px solid #007AFF; 
            border-radius: 50%; 
            width: 60px; 
            height: 60px; 
            animation: spin 1s linear infinite; 
            margin: 30px auto; 
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Localizando estantería...</h1>
        <p class="info-text">Calculando la ruta óptima para encontrar el libro con la signatura:</p>
        
        <div id="sig-display" class="signatura-badge">Cargando...</div>
        
        <div class="loader"></div>
        <p class="info-text" id="mensaje-estado">Sigue las indicaciones del mapa...</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const signaturaBuscada = params.get('sig');
        
        if (signaturaBuscada) {
            document.getElementById('sig-display').innerText = signaturaBuscada;
        } else {
            document.getElementById('sig-display').innerText = "Signatura no proporcionada";
        }

        setTimeout(() => {
            document.getElementById('mensaje-estado').innerText = "¡Has llegado al pasillo!";
            
            if (signaturaBuscada) {
                localStorage.setItem('signaturaObjetivo', signaturaBuscada);
            }
            
            window.location.href = "encontrado.html";
            
        }, 3000); 
    </script>
</body>
</html>
