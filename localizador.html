<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando Búsqueda...</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #2c3e50; }
        .loader-container { text-align: center; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 400px; width: 90%; }
        .spinner { border: 5px solid #ecf0f1; border-top: 5px solid #2980b9; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-family: 'Romana Moderna', Georgia, serif; color: #1a252f; margin-bottom: 10px; font-size: 1.5em; }
        p { color: #7f8c8d; font-size: 0.95em; line-height: 1.4; }
        .icono-aviso { font-size: 3em; margin-bottom: 10px; }
    </style>
</head>
<body class="antialiased selection:bg-sand selection:text-stone-900">
    <div class="loader-container" id="contenedor-principal">
        <div class="spinner"></div>
        <h2>Buscando ubicación...</h2>
        <p>Comprobando los datos en la base de datos de la biblioteca.</p>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    let sigBuscada = params.get('sig');
    const sigOriginal = params.get('orig'); 
    const valTitulo = params.get('titulo'); 
    // Recuperamos autor y fecha de la URL
    const valAutor = params.get('autor') || '';
    const valFecha = params.get('fecha') || '';

    if (sigBuscada) {
        sigBuscada = sigBuscada.replace(/\/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ\s]+(?=\d+=)/gi, "/");
    }

    const signaturaClicada = sigOriginal || sigBuscada || 'Desconocida';

    const STOP_WORDS = new Set([
        'el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas',
        'a', 'ante', 'bajo', 'cabe', 'con', 'contra', 'de', 'del', 'desde',
        'durante', 'en', 'entre', 'hacia', 'hasta', 'mediante', 'para',
        'por', 'según', 'sin', 'so', 'sobre', 'tras', 'versus', 'vía',
        'y', 'e', 'o', 'u', 'que', 'al'
    ]);

    function limpiarTextoLocal(str) {
        if (!str) return '';
        return str.toString()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();
    }

    // Algoritmo de búsqueda en niveles secuenciales
    function buscarLibrosPorTituloLocal(libros, textoIngresado) {
        // Descartar resultados cuya signatura empiece por 'EXP'
        libros = libros.filter(libro => {
            const sig = (libro.signatura || libro.Signatura || libro.SIGNATURA || '').trim().toUpperCase();
            return !sig.startsWith('EXP');
        });

        const queryOriginal = textoIngresado.trim();
        if (!queryOriginal) return [];

        const queryNorm = limpiarTextoLocal(queryOriginal);
        const palabrasQuery = queryNorm.split(/\s+/).filter(p => p.length > 0);
        const keywords = palabrasQuery.filter(p => !STOP_WORDS.has(p));

        let resultados = [];

        // NIVEL 1: Exacto en Título
        resultados = libros.filter(libro => {
            const tituloNorm = limpiarTextoLocal(libro.titulo || libro.Titulo || libro.TITULO || '');
            return tituloNorm.includes(queryNorm);
        });

        // NIVEL 2: Keywords en Título
        if (resultados.length === 0 && keywords.length > 0) {
            resultados = libros.filter(libro => {
                const tituloNorm = limpiarTextoLocal(libro.titulo || libro.Titulo || libro.TITULO || '');
                return keywords.every(kw => tituloNorm.includes(kw));
            });
        }

        // NIVEL 3: Primera palabra en Autor y siguientes en Título
        if (resultados.length === 0 && keywords.length > 0) {
            const primeraPalabra = keywords[0];
            let resultadosAutor = libros.filter(libro => {
                const autorNorm = limpiarTextoLocal(libro.autor || libro.Autor || libro.AUTOR || '');
                return autorNorm.includes(primeraPalabra);
            });

            if (resultadosAutor.length > 0 && keywords.length > 1) {
                const palabrasTitulo = keywords.slice(1, 3);
                resultados = resultadosAutor.filter(libro => {
                    const tituloNorm = limpiarTextoLocal(libro.titulo || libro.Titulo || libro.TITULO || '');
                    return palabrasTitulo.every(kw => tituloNorm.includes(kw));
                });
            } else {
                resultados = resultadosAutor;
            }
        }

        // NIVEL 4: Última palabra en Autor y dos primeras en Título
        if (resultados.length === 0 && keywords.length > 1) {
            const ultimaPalabra = keywords[keywords.length - 1];
            const dosPrimerasPalabras = keywords.slice(0, 2);
            
            let resultadosAutor = libros.filter(libro => {
                const autorNorm = limpiarTextoLocal(libro.autor || libro.Autor || libro.AUTOR || '');
                return autorNorm.includes(ultimaPalabra);
            });

            if (resultadosAutor.length > 0) {
                resultados = resultadosAutor.filter(libro => {
                    const tituloNorm = limpiarTextoLocal(libro.titulo || libro.Titulo || libro.TITULO || '');
                    return dosPrimerasPalabras.every(kw => tituloNorm.includes(kw));
                });
            }
        }

        // Ordenar resultados y evitar duplicados
        const sortFn = (a, b) => {
            const tA = (a.titulo || a.Titulo || a.TITULO || '').trim();
            const tB = (b.titulo || b.Titulo || b.TITULO || '').trim();
            return tA.localeCompare(tB, 'es');
        };
        resultados.sort(sortFn);

        const vistos = new Set();
        const resultadosUnicos = [];
        for (const item of resultados) {
            const idUnico = (item.signatura || item.Signatura || '') + '|' + (item.titulo || item.Titulo || '');
            if (!vistos.has(idUnico)) {
                vistos.add(idUnico);
                resultadosUnicos.push(item);
            }
        }
        return resultadosUnicos;
    }

    // CASO 1: Búsqueda por Título o Autor
    if (!sigBuscada && valTitulo) {
        Promise.all([
            fetch('signaturas.json').then(res => {
                if (!res.ok) throw new Error("Error cargando signaturas.json");
                return res.json();
            }),
            fetch('plano.json').then(res => {
                if (!res.ok) throw new Error("Error cargando plano.json");
                return res.json();
            })
        ])
        .then(([baseDatos, planosDatos]) => {
            setTimeout(() => {
                let arrDatos = Array.isArray(baseDatos) ? baseDatos : 
                    Object.keys(baseDatos).map(k => {
                        let v = baseDatos[k];
                        if (!v.signatura && !v.signaturas) v.signatura = k;
                        return v;
                    });

                let arrPlanos = Array.isArray(planosDatos) ? planosDatos : Object.values(planosDatos);

                let candidatos = buscarLibrosPorTituloLocal(arrDatos, valTitulo);

                if (candidatos.length > 0) {
                    let datosEncontrados = candidatos[0]; 
                    let zona = datosEncontrados.zona || "";
                    let planoInfo = arrPlanos.find(p => p.pos_plano == zona) || {};

                    const paramsUrl = new URLSearchParams({
                        sig: datosEncontrados.signatura || datosEncontrados.signaturas || '',
                        orig: datosEncontrados.signatura || datosEncontrados.signaturas || '',
                        planta: datosEncontrados.planta || '',
                        sala: datosEncontrados.sala || '',
                        ubicacion: datosEncontrados.ubicacion || '',
                        estanteria: datosEncontrados.estanteria || '',
                        titulo: datosEncontrados.titulo || valTitulo,
                        autor: datosEncontrados.autor || datosEncontrados.Autor || valAutor,
                        fecha: datosEncontrados.fecha || datosEncontrados.Fecha || valFecha,
                        mapa: planoInfo.mapa || '',
                        pos_x: planoInfo.pos_x || '',
                        pos_y: planoInfo.pos_y || '',
                        tam_punto: planoInfo.tam_punto || '20'
                    });

                    window.location.href = (datosEncontrados.html || 'Encontrado.html') + "?" + paramsUrl.toString();
                } else {
                    mostrarAvisoPersonal({ signaturas: valTitulo, descripcion: `con el texto "${valTitulo}"` });
                }
            }, 600);
        })
        .catch(error => {
            console.error("Error:", error);
            mostrarAvisoPersonal({ signaturas: valTitulo });
        });
    } 
    // CASO 2: Búsqueda por Signatura
    else if (sigBuscada && sigBuscada.trim().toUpperCase().startsWith('HG')) {
        Promise.all([
            fetch('signaturas.json').then(res => {
                if (!res.ok) throw new Error("Error cargando signaturas.json");
                return res.json();
            }),
            fetch('plano.json').then(res => {
                if (!res.ok) throw new Error("Error cargando plano.json");
                return res.json();
            })
        ])
        .then(([baseDatos, planosDatos]) => {
            setTimeout(() => {
                let sigBuscadaUpper = sigBuscada.trim().toUpperCase();
                
                let arrDatos = Array.isArray(baseDatos) ? baseDatos : 
                    Object.keys(baseDatos).map(k => {
                        let v = baseDatos[k];
                        if (!v.signatura && !v.signaturas) v.signatura = k;
                        return v;
                    });

                let arrPlanos = Array.isArray(planosDatos) ? planosDatos : Object.values(planosDatos);

                let candidatos = arrDatos.filter(item => {
                    let sigItem = (item.signatura || item.signaturas || "").trim().toUpperCase();
                    // Descartar EXP explícitamente si se hace una búsqueda de prefijo genérica
                    if (!sigItem || sigItem.startsWith('EXP')) return false; 
                    
                    if (sigBuscadaUpper === sigItem) return true;
                    if (sigBuscadaUpper.startsWith(sigItem)) {
                        let nextChar = sigBuscadaUpper.charAt(sigItem.length);
                        if (/[0-9]/.test(nextChar) && /[0-9]/.test(sigItem.slice(-1))) {
                            return false; 
                        }
                        return true;
                    }
                    return false;
                });

                candidatos.sort((a, b) => {
                    let lenA = (a.signatura || a.signaturas || "").trim().length;
                    let lenB = (b.signatura || b.signaturas || "").trim().length;
                    return lenB - lenA;
                });

                let datosEncontrados = null;

                for (let item of candidatos) {
                    let inicio = (item.inicio || "").trim().toUpperCase();
                    let fin = (item.fin || "").trim().toUpperCase();

                    if (inicio === "") {
                        datosEncontrados = item;
                        break;
                    } else {
                        let sigOriginalUpper = sigOriginal.trim().toUpperCase();
                        let esMayorOIgual = sigOriginalUpper.localeCompare(inicio, 'es') >= 0;
                        let esMenorOIgual = sigOriginalUpper.localeCompare(fin, 'es') <= 0;
                        let empiezaPorFin = sigOriginal.startsWith(fin);

                        if (esMayorOIgual && (esMenorOIgual || empiezaPorFin)) {
                            datosEncontrados = item;
                            break;
                        }
                    }
                }

                if (datosEncontrados) {
                    let zona = datosEncontrados.zona || "";
                    let planoInfo = arrPlanos.find(p => p.pos_plano == zona) || {};

                    const paramsUrl = new URLSearchParams({
                        sig: sigBuscada,
                        orig: signaturaClicada,
                        planta: datosEncontrados.planta || '',
                        sala: datosEncontrados.sala || '',
                        ubicacion: datosEncontrados.ubicacion || '',
                        estanteria: datosEncontrados.estanteria || '',
                        titulo: valTitulo || datosEncontrados.titulo || 'Sin título especificado',
                        autor: valAutor || datosEncontrados.autor || datosEncontrados.Autor || '',
                        fecha: valFecha || datosEncontrados.fecha || datosEncontrados.Fecha || '',
                        mapa: planoInfo.mapa || '',
                        pos_x: planoInfo.pos_x || '',
                        pos_y: planoInfo.pos_y || '',
                        tam_punto: planoInfo.tam_punto || '20'
                    });

                    window.location.href = (datosEncontrados.html || 'Encontrado.html') + "?" + paramsUrl.toString();
                } else {
                    mostrarAvisoPersonal({ signaturas: signaturaClicada });
                }
            }, 600);
        })
        .catch(error => {
            console.error("Error:", error);
            mostrarAvisoPersonal({ signaturas: signaturaClicada });
        });
    } else {
        mostrarAvisoPersonal({ signaturas: signaturaClicada });
    }

    function mostrarAvisoPersonal(datos) {
        const contenedor = document.getElementById('contenedor-principal');
        const descripcionTexto = datos.descripcion ? ` ${datos.descripcion}` : '';
        contenedor.innerHTML = `
            <div class="icono-aviso">ℹ️</div>
            <h2>Aviso de ubicación</h2>
            <p>La búsqueda de <strong>${datos.signaturas}</strong>${descripcionTexto} no se encuentra disponible en las SALAS. Acuda al personal de la biblioteca para solicitarlo.</p>
        `;
    }
    </script>
</body>
</html>
