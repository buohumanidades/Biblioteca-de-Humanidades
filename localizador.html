<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Signaturas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #resultado {
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .exito {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <h2>Búsqueda de Signaturas</h2>

    <div class="search-container">
        <input type="text" id="inputSignatura" placeholder="Ej: AC860-0001">
        <button onclick="ejecutarBusqueda()">Buscar</button>
    </div>

    <div id="resultado"></div>

    <script>
        function ejecutarBusqueda() {
            const input = document.getElementById('inputSignatura').value;
            buscarEnTodasSignaturas(input);
        }

        function buscarEnTodasSignaturas(sig) {
            if (!sig || sig.trim().length < 2) {
                mostrarError(sig, "Por favor, introduce una signatura de al menos 2 caracteres.");
                return;
            }

            fetch('todassignaturas.json')
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo cargar el archivo");
                    return response.json();
                })
                .then(todas => {
                    if (!Array.isArray(todas)) {
                        mostrarError(sig, "Estructura de datos no válida en el JSON.");
                        return;
                    }

                    let currentSig = sig.trim().toLowerCase();
                    let encontrada = null;

                    // Recorrido progresivo: busca y recorta hasta mantener un mínimo de 2 caracteres
                    while (currentSig.length >= 2) {
                        encontrada = todas.find(item => 
                            item.signaturas && item.signaturas.trim().toLowerCase() === currentSig
                        );

                        if (encontrada) {
                            break; // Coincidencia encontrada, se detiene el bucle
                        }

                        // Recorta el último carácter para la siguiente iteración
                        currentSig = currentSig.slice(0, -1);
                    }

                    if (encontrada) {
                        mostrarAvisoPersonal(encontrada);
                    } else {
                        mostrarError(sig);
                    }
                })
                .catch(error => mostrarError(sig, "Error al cargar la base de datos secundaria."));
        }

        function mostrarAvisoPersonal(datos) {
            const contenedor = document.getElementById('resultado');
            contenedor.className = 'exito';
            contenedor.style.display = 'block';
            contenedor.innerHTML = `<strong>Coincidencia encontrada:</strong> ${datos.signaturas}`;
        }

        function mostrarError(sig, mensajeExtra) {
            const contenedor = document.getElementById('resultado');
            contenedor.className = 'error';
            contenedor.style.display = 'block';
            contenedor.innerHTML = `No se encontraron resultados para la signatura <strong>${sig || ''}</strong>. ${mensajeExtra || ''}`;
        }
    </script>

</body>
</html>
