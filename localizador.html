            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #2c3e50;
        }
        .loader-container {
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            border: 5px solid #ecf0f1;
            border-top: 5px solid #2980b9; 
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-family: 'Romana Moderna', Georgia, serif;
            color: #1a252f;
            margin-bottom: 10px;
            font-size: 1.5em;
        }
        p {
            color: #7f8c8d;
            font-size: 0.95em;
            line-height: 1.4;
        }
        .btn-volver {
            background-color: #e67e22; 
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        .btn-volver:hover {
            background-color: #d35400;
        }
        .icono-error {
            font-size: 3em;
            margin-bottom: 10px;
        }
    </style>
</head>
