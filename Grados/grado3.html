<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliografía de Asignaturas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }

        /* Estilos del modal */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.5); 
        }

        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 900px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Estilo para convertir el texto bibliográfico en enlace al OPAC */
        .bib-texto-link {
            color: #2b2b2b;
            text-decoration: none;
            cursor: pointer;
            display: block;
            transition: color 0.2s ease;
        }

        .bib-texto-link:hover {
            color: #1976d2;
            text-decoration: underline;
        }

        /* Badges para las signaturas */
        .sig-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .sig-badge {
            background-color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            font-size: 0.9em;
        }

        .sig-badge:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>

    <!-- Estructura del Modal -->
    <div id="modalBibliografia" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2 id="modalTitulo">Título Asignatura</h2>
            <table>
                <thead>
                    <tr>
                        <th>Bibliografía Recomendada (Haz clic para abrir en OPAC)</th>
                        <th>Signaturas</th>
                    </tr>
                </thead>
                <tbody id="modalTablaCuerpo">
                    <!-- Contenido cargado dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Carga de datos JSON
        async function cargarDatos() {
            const response = await fetch('grado3.json');
            if (!response.ok) {
                throw new Error('Error al cargar el archivo grado3.json');
            }
            return await response.json();
        }

        function cerrarModal() {
            document.getElementById("modalBibliografia").style.display = "none";
        }

        function localizarLibro(event, elemento) {
            event.preventDefault();
            alert("Localizando libro con signatura: " + elemento.textContent);
        }

        // Función para abrir modal y generar enlaces al OPAC
        async function abrirModalBibliografia(nombreAsignatura, codigoGrado) {
            const modal = document.getElementById("modalBibliografia");
            const tituloModal = document.getElementById("modalTitulo");
            const cuerpoTabla = document.getElementById("modalTablaCuerpo");

            tituloModal.innerText = nombreAsignatura;
            cuerpoTabla.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 20px;">Cargando bibliografía...</td></tr>';
            modal.style.display = "block";

            try {
                const data = await cargarDatos();

                // Filtrar por asignatura y código GRADO
                const items = data.filter(item => 
                    item.ASIGNATURA && 
                    item.ASIGNATURA.trim().toLowerCase() === nombreAsignatura.trim().toLowerCase() &&
                    (codigoGrado ? Number(item.GRADO) === Number(codigoGrado) : true)
                );

                cuerpoTabla.innerHTML = "";

                if (items.length === 0) {
                    cuerpoTabla.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 20px;">No se encontraron textos recomendados para esta asignatura.</td></tr>';
                    return;
                }

                items.forEach(item => {
                    const tr = document.createElement("tr");

                    // 1. Preparar texto bibliográfico con título en negrita
                    let textoCompleto = item["Texto completo de la obra donde se extrae la información"] || "";
                    let titulo = item["Obra/Título"] || "";
                    let autor = item["AUTOR"] || "";

                    if (titulo && textoCompleto.includes(titulo)) {
                        textoCompleto = textoCompleto.replace(titulo, '<strong>' + titulo + '</strong>');
                    }

                    const tdBib = document.createElement("td");

                    // URL de la búsqueda en el OPAC
                    const urlOpac = item["URL de búsqueda OPAC"] || 
                        `https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=DOSEARCH&xsqf01=${encodeURIComponent(autor + ' ' + titulo)}`;

                    // Crear el enlace <a> interactivo sobre la bibliografía
                    const aBib = document.createElement("a");
                    aBib.className = "bib-texto-link";
                    aBib.href = urlOpac;
                    aBib.target = "_blank";
                    aBib.title = `Buscar "${titulo}" en el OPAC`;
                    aBib.innerHTML = textoCompleto;

                    tdBib.appendChild(aBib);

                    // 2. Columna de Signaturas
                    const tdSig = document.createElement("td");
                    const divSigContainer = document.createElement("div");
                    divSigContainer.className = "sig-container";

                    let rawSignaturas = item["SIGNATURAS"] || "";
                    if (rawSignaturas.trim() !== "") {
                        const listaSignaturas = rawSignaturas.split(",").map(s => s.trim()).filter(s => s.length > 0);
                        listaSignaturas.forEach(sigText => {
                            const aBadge = document.createElement("a");
                            aBadge.href = "#";
                            aBadge.className = "sig-badge";
                            aBadge.onclick = function(e) { localizarLibro(e, this); };
                            aBadge.textContent = sigText;
                            divSigContainer.appendChild(aBadge);
                        });
                    }

                    tdSig.appendChild(divSigContainer);
                    tr.appendChild(tdBib);
                    tr.appendChild(tdSig);

                    cuerpoTabla.appendChild(tr);
                });

            } catch (error) {
                console.error("Error al cargar la bibliografía:", error);
                cuerpoTabla.innerHTML = '<tr><td colspan="2" style="text-align: center; color: red; padding: 20px;">Error al cargar la información bibliográfica.</td></tr>';
            }
        }
    </script>

</body>
</html>
