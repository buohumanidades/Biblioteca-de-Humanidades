<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador por Título</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .busqueda-container {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 320px;
            padding: 8px;
            font-size: 14px;
        }
        button {
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        #resultado-busqueda {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            background-color: #f4f4f9;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <h2>Buscador de Catálogo (Regla de las 9 palabras)</h2>
    
    <div class="busqueda-container">
        <input type="text" id="input-titulo" placeholder="Escribe el título de la obra...">
        <button id="btn-buscar">Buscar</button>
    </div>

    <div id="resultado-busqueda">El resultado aparecerá aquí.</div>

    <script>
        // Carga o simulación de la estructura de datos libros.json
        const librosJson = [
            {
                "signatura": "HG17/Clif",
                "titulo": "La voluntad de creer un debate sobre la ética de la creencia"
            }
        ];

        /**
         * Normaliza una cadena de texto y extrae un máximo de N palabras.
         * @param {string} texto Cadena de texto a procesar.
         * @param {number} limitePalabras Cantidad máxima de palabras a recortar (por defecto 9).
         * @returns {string} Cadena normalizada con un máximo de N palabras.
         */
        function extraerPalabras(texto, limitePalabras = 9) {
            if (!texto) return "";
            return texto
                .trim()
                .toLowerCase()
                .replace(/[^\w\sáéíóúüñ]/gi, '') // Elimina signos de puntuación y símbolos
                .split(/\s+/)
                .slice(0, limitePalabras)
                .join(" ");
        }

        /**
         * Ejecuta la búsqueda de coincidencias y actualiza el DOM.
         */
        function buscarLibro() {
            const inputElement = document.getElementById("input-titulo");
            const contenedorDOM = document.getElementById("resultado-busqueda");
            const terminoBuscado = inputElement.value;

            if (!terminoBuscado.trim()) {
                contenedorDOM.textContent = "Por favor, introduce un título para realizar la consulta.";
                return;
            }

            const fragmentoBuscado = extraerPalabras(terminoBuscado, 9);

            // Filtra los libros comparando las primeras 9 palabras
            const coincidencias = librosJson.filter(libro => {
                const fragmentoLibro = extraerPalabras(libro.titulo, 9);
                return fragmentoLibro === fragmentoBuscado;
            });

            // Renderizado en el DOM
            if (coincidencias.length > 0) {
                const listadoHTML = coincidencias
                    .map(libro => `<li><strong>Signatura:</strong> ${libro.signatura} | <strong>Título:</strong> ${libro.titulo}</li>`)
                    .join("");
                contenedorDOM.innerHTML = `<ul>${listadoHTML}</ul>`;
            } else {
                contenedorDOM.textContent = "Libro no encontrado en el catálogo.";
            }
        }

        // Event listeners
        document.getElementById("btn-buscar").addEventListener("click", buscarLibro);

        document.getElementById("input-titulo").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                buscarLibro();
            }
        });
    </script>

</body>
</html>
