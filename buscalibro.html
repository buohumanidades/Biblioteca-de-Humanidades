<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegación Completa: Flechas, Voz y Vibración</title>
    <!-- Cargamos Tesseract.js -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; margin: 0; padding: 15px; background-color: #121214; color: #fff; }
        #contenedor-camara { position: relative; width: 100%; max-width: 400px; margin: 0 auto; border: 3px solid #333; border-radius: 16px; overflow: hidden; }
        video { width: 100%; display: block; }
        .guia-enfoque { position: absolute; top: 35%; left: 10%; width: 80%; height: 30%; border: 3px dashed #00ffcc; box-sizing: border-box; pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); }
        
        /* Panel de Flechas */
        #panel-direccion { margin: 20px auto; width: 100%; max-width: 400px; height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 16px; background: #22222b; border: 2px solid #333; transition: all 0.2s ease; }
        .flecha { font-size: 80px; line-height: 1; margin: 0; }
        .texto-dir { font-size: 22px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
        
        /* Colores de alto contraste */
        .dir-izq { background-color: #0288d1 !important; border-color: #00e5ff !important; }
        .dir-der { background-color: #388e3c !important; border-color: #00e676 !important; }
        .dir-arr { background-color: #f57c00 !important; border-color: #ffea00 !important; }
        .dir-aba { background-color: #d32f2f !important; border-color: #ff1744 !important; }

        #lectura { font-size: 14px; color: #888; margin-top: 15px; }
        #texto-visto { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="margin: 10px 0;">Navegador háptico y visual</h2>
    
    <div id="contenedor-camara">
        <video id="camara" autoplay playsinline></video>
        <div class="guia-enfoque"></div>
    </div>

    <div id="panel-direccion">
        <p class="flecha">📷</p>
        <p class="texto-dir">Apunta a una palabra</p>
    </div>
    
    <div id="lectura">Viendo: <span id="texto-visto">-</span></div>
    <canvas id="canvas-procesamiento" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('camara');
        const canvas = document.getElementById('canvas-procesamiento');
        const panelDir = document.getElementById('panel-direccion');
        const textoVisto = document.getElementById('texto-visto');
        
        let trabajadorOCR = null;
        let direccionActual = ""; 

        async function iniciarOCR() {
            textoVisto.innerText = "Iniciando sistemas...";
            trabajadorOCR = await Tesseract.createWorker('spa');
            textoVisto.innerText = "Esperando cámara...";
            arrancarCamara();
        }

        function arrancarCamara() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } })
            .then(stream => { video.srcObject = stream; video.onloadedmetadata = () => bucleEscaneo(); })
            .catch(err => {
                navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { video.srcObject = stream; video.onloadedmetadata = () => bucleEscaneo(); })
                .catch(e => alert("Error de cámara: " + e.message));
            });
        }

        async function bucleEscaneo() {
            const ctx = canvas.getContext('2d');
            const x = video.videoWidth * 0.10;
            const y = video.videoHeight * 0.35;
            const ancho = video.videoWidth * 0.80;
            const alto = video.videoHeight * 0.30;

            canvas.width = ancho;
            canvas.height = alto;
            ctx.drawImage(video, x, y, ancho, alto, 0, 0, ancho, alto);

            try {
                const { data: { text } } = await trabajadorOCR.recognize(canvas);
                evaluarTexto(text);
            } catch (error) { console.error(error); }

            setTimeout(bucleEscaneo, 250);
        }

        function evaluarTexto(textoLimpio) {
            const texto = textoLimpio.toUpperCase().trim();
            textoVisto.innerText = texto || "(Buscando...)";

            let nuevaDireccion = "";
            let HTMLFlecha = "";

            if (texto.includes("IZQUIERDA") || texto.includes("IZQ")) {
                nuevaDireccion = "IZQUIERDA";
                HTMLFlecha = `<p class="flecha">◀</p><p class="texto-dir">Izquierda</p>`;
            } 
            else if (texto.includes("DERECHA") || texto.includes("DER")) {
                nuevaDireccion = "DERECHA";
                HTMLFlecha = `<p class="flecha">▶</p><p class="texto-dir">Derecha</p>`;
            } 
            else if (texto.includes("ARRIBA") || texto.includes("ARR")) {
                nuevaDireccion = "ARRIBA";
                HTMLFlecha = `<p class="flecha">▲</p><p class="texto-dir">Arriba</p>`;
            } 
            else if (texto.includes("ABAJO") || texto.includes("ABA")) {
                nuevaDireccion = "ABAJO";
                HTMLFlecha = `<p class="flecha">▼</p><p class="texto-dir">Abajo</p>`;
            }

            if (nuevaDireccion !== "") {
                panelDir.className = ""; 
                if (nuevaDireccion === "IZQUIERDA") panelDir.classList.add("dir-izq");
                if (nuevaDireccion === "DERECHA") panelDir.classList.add("dir-der");
                if (nuevaDireccion === "ARRIBA") panelDir.classList.add("dir-arr");
                if (nuevaDireccion === "ABAJO") panelDir.classList.add("dir-aba");
                
                panelDir.innerHTML = HTMLFlecha;

                // Solo ejecuta acciones si la dirección ha cambiado realmente
                if (nuevaDireccion !== direccionActual) {
                    direccionActual = nuevaDireccion;
                    emitirVoz(nuevaDireccion);
                    ejecutarVibracion(nuevaDireccion);
                }
            }
        }

        function emitirVoz(mensaje) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(mensaje);
            utterance.lang = 'es-ES';
            utterance.rate = 1.2;
            window.speechSynthesis.speak(utterance);
        }

        // 5. Lógica de Vibración Inteligente por Patrones
        function ejecutarVibracion(direccion) {
            if (!("vibrate" in navigator)) return; // Si el dispositivo no soporta vibración, no hace nada

            // Los números representan milisegundos: [vibración, pausa, vibración, pausa...]
            switch (direccion) {
                case "IZQUIERDA":
                    // Un pulso largo único
                    navigator.vibrate(400); 
                    break;
                case "DERECHA":
                    // Dos pulsos cortos rápidos
                    navigator.vibrate([150, 100, 150]); 
                    break;
                case "ARRIBA":
                    // Tres pulsos ultra-cortos tipo ráfaga
                    navigator.vibrate([80, 80, 80, 80, 80]); 
                    break;
                case "ABAJO":
                    // Un pulso corto y uno muy largo (estilo código morse)
                    navigator.vibrate([100, 150, 500]); 
                    break;
            }
        }

        window.addEventListener('DOMContentLoaded', iniciarOCR);
    </script>
</body>
</html>
