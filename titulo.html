<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda por Título | Biblioteca</title>
    <style>
        /* Fuentes */
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Playfair+Display:wght@600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1c1c1e;
        }

        body { 
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #a8edea, #fed6e3, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenedor principal */
        .container { 
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            width: 95vw;
            max-width: 1300px;
            height: 94vh; 
            height: 94dvh; 
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.25); 
            overflow: hidden;
        }

        /* Cabecera / Sección Hero */
        .hero-section {
            width: 100%;
            height: 180px; 
            position: relative; 
            background-color: #34495e;
            overflow: hidden;
            flex-shrink: 0;
        }

        .shelf-photo-desktop {
            display: block; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1; 
            width: 100%;
            height: 200%;
            object-fit: cover; 
            object-position: center 100%;
            filter: brightness(0.65); 
        }

        .shelf-photo-mobile {
            display: none; 
        }

        .library-title {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.5em; 
            font-weight: 700;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            z-index: 10; 
        }

        .professional-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            font-size: 1.3em;
            font-weight: 700;
            text-align: right;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            z-index: 10; 
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 20px 30px;
            min-height: 0;
            overflow-y: auto;
            justify-content: space-between;
        }

        .search-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: auto 0;
            width: 100%;
        }

        .input-titulo {
            width: 65%;
            padding: 16px;
            font-size: 1.2em;
            text-align: center;
            color: #1c1c1e;
            background-color: #F2F2F7;
            border: 2px solid transparent;
            border-radius: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }
        .input-titulo::placeholder {
            color: #8e8e93;
            font-weight: 500;
        }
        .input-titulo:focus {
            background-color: #ffffff;
            border-color: #007AFF;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 65%;
            padding: 16px;
            font-size: 1.15em;
            font-weight: 600;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, background-color 0.2s ease;
        }
        
        .btn-local {
            width: 48%;
            min-width: 260px;
            max-width: 400px;
            padding: 16px 24px;
            font-size: 1.2em;
            font-weight: 700;
            border-radius: 30px; 
            background: linear-gradient(135deg, #0061ff, #60efff);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 97, 255, 0.45), 0 0 20px rgba(96, 239, 255, 0.4);
            animation: float 3.5s ease-in-out infinite; 
            margin-top: 10px;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        @keyframes float {
            0% { transform: translateY(0px); box-shadow: 0 10px 30px rgba(0, 97, 255, 0.45), 0 0 20px rgba(96, 239, 255, 0.4); }
            50% { transform: translateY(-6px); box-shadow: 0 16px 36px rgba(0, 97, 255, 0.55), 0 0 26px rgba(96, 239, 255, 0.6); }
            100% { transform: translateY(0px); box-shadow: 0 10px 30px rgba(0, 97, 255, 0.45), 0 0 20px rgba(96, 239, 255, 0.4); }
        }

        .btn-local:hover {
            background: linear-gradient(135deg, #0052d9, #4ed9ee);
            box-shadow: 0 12px 35px rgba(0, 97, 255, 0.6), 0 0 30px rgba(96, 239, 255, 0.6);
        }
        .btn-local:active {
            animation: none;
            transform: scale(0.96) translateY(2px);
            background: #0040b0;
            box-shadow: 0 5px 15px rgba(0, 97, 255, 0.4);
        }

        .catalog-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 65%;
            margin-top: 10px;
            padding: 20px;
            background-color: #F2F2F7;
            border-radius: 18px;
            gap: 12px;
        }
        .availability-text {
            margin: 0;
            color: #3a3a3c;
            font-weight: 600;
            font-size: 0.95em;
        }
        
        .btn-catalog {
            background-color: #ffffff;
            color: #5856D6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            width: 100%;
        }
        .btn-catalog:active {
            background-color: #e5e5ea;
            transform: scale(0.96);
        }

        .icon {
            font-size: 1.2em;
        }

        .back-btn {
            display: block;
            text-align: center;
            padding: 14px;
            background: transparent;
            color: #007AFF;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1em;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.15s;
            width: 30%;
            margin: 0 auto;
        }
        .back-btn:active {
            background: #F2F2F7;
            transform: scale(0.96);
        }

        /* --- MODALES GENERALES --- */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        /* Modal de Alertas (Errores / Límite) */
        .modal-alert-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 18px;
            max-width: 80%;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            color: #1c1c1e;
        }

        /* --- NUEVO: VENTANA MODAL DE RESULTADOS --- */
        .modal-resultados-content {
            background: #f9f9fb;
            border-radius: 20px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0,0,0,0.35);
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-resultados-header {
            background: #ffffff;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5ea;
        }
        
        .modal-resultados-header h3 {
            margin: 0;
            font-size: 1.3em;
            color: #1c1c1e;
        }

        .btn-cerrar-modal {
            background: #F2F2F7;
            border: none;
            color: #FF3B30;
            font-weight: 700;
            font-size: 1em;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-cerrar-modal:active {
            background: #e5e5ea;
            transform: scale(0.95);
        }

        .modal-resultados-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .modal-resultados-body::-webkit-scrollbar { width: 8px; }
        .modal-resultados-body::-webkit-scrollbar-thumb { background-color: #c7c7cc; border-radius: 10px; }

        /* Estilo de los libros dentro de la ventana de resultados */
        .libro-item {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-left: 5px solid #007AFF;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-align: left;
            position: relative;
        }

        .libro-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        
        .libro-item::after {
            content: "Ir a OPAC ↗";
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 0.8em;
            font-weight: 700;
            color: #007AFF;
            opacity: 0.7;
        }

        .libro-titulo-res {
            font-weight: 700;
            font-size: 1.15em;
            color: #1c1c1e;
            padding-right: 70px; /* Para no pisar el texto de OPAC */
        }

        .libro-signatura-res {
            font-size: 0.95em;
            color: #5856D6;
            font-weight: 700;
            display: inline-block;
            background: #f0f0fb;
            padding: 4px 8px;
            border-radius: 6px;
            align-self: flex-start;
        }

        /* Botón de localización dentro de la tarjeta */
        .libro-localizacion-res {
            font-size: 0.9em;
            color: #34C759;
            font-weight: 600;
            margin-top: 6px;
            display: inline-block;
            background: #eaffea;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #c3f3c3;
            cursor: pointer;
            transition: all 0.2s ease;
            align-self: flex-start;
        }
        .libro-localizacion-res:hover {
            background: #d4f8d4;
            transform: translateY(-1px);
        }
        .libro-localizacion-res:active {
            transform: translateY(1px);
        }

        .modal-btn {
            background: #007AFF;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1.05em;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        .modal-btn:active {
            background: #005bb5;
            transform: scale(0.96);
        }

        /* PANTALLAS GRANDES */
        @media (min-width: 901px) {
            .hero-section { height: 25vh; height: 25dvh; } 
            .library-title { font-size: 2.3em; top: 25px; left: 35px; }
            .professional-badge { font-size: 2.2em; bottom: 25px; right: 35px; }
            .content-wrapper { padding: 3vh 4vw; }
        }

        /* MÓVILES */
        @media (max-width: 900px) {
            body { align-items: flex-start; }
            .container { height: 100vh; height: 100dvh; width: 100vw; border-radius: 0; }
            .shelf-photo-desktop { display: none; }
            .shelf-photo-mobile {
                display: block; position: absolute; top: 50%; left: 50%;
                transform: translate(-50%, -50%); z-index: 1; width: 100%;
                height: 100%; object-fit: cover; object-position: center 80%; 
                filter: brightness(0.65);
            }
            .input-titulo { width: 90%; }
            .action-btn:not(.btn-local) { width: 90%; }
            .btn-local { width: 75%; min-width: unset; }
            .catalog-section { width: 90%; padding: 18px 15px; }
            .back-btn { width: 60%; }
            .modal-resultados-content { width: 95%; max-height: 90vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero -->
        <div class="hero-section">
            <img src="imagenes/buobh.png" alt="Interior biblioteca" class="shelf-photo-desktop" onerror="this.src='https://via.placeholder.com/1300x400?text=Biblioteca+de+Humanidades'">
            <img src="imagenes/buobh_movil.png" alt="Interior biblioteca móvil" class="shelf-photo-mobile" onerror="this.src='https://via.placeholder.com/800x600?text=Biblioteca+Móvil'">
            
            <div class="library-title"></div>
            <div class="professional-badge">Título</div>
        </div>

        <div class="content-wrapper">
            <div class="search-area">
                <p style="text-align: center; color: #8e8e93; font-size: 0.90em; margin: 0 10px; font-weight: 500;">
                    Escribe el título o parte del mismo para consultar los libros en el fondo bibliográfico de la biblioteca.
                </p>
                
                <input type="text" id="campoTitulo" class="input-titulo" placeholder="<Escribe el título o parte del mismo>">

                <button class="action-btn btn-local" onclick="localizarPorTitulo(event)">
                    <span class="icon">🔍</span> Localizar libros
                </button>

                <div class="catalog-section">
                    <p class="availability-text">¿Quieres consultar el catálogo general?</p>
                    <button onclick="buscarEnCatalogo()" class="action-btn btn-catalog">
                        <span class="icon">📚</span> Búscalo en el catálogo
                    </button>
                </div>
            </div>
            
            <a href="index.html" class="back-btn">⬅ Volver al inicio</a>
        </div>
    </div>

    <!-- Modal de Alertas (Mensajes) -->
    <div id="modalAlerta" class="modal-overlay">
        <div class="modal-alert-content">
            <p id="mensajeAlerta" style="font-size: 1.05em; font-weight: 500; margin-bottom: 20px; white-space: pre-wrap;"></p>
            <button onclick="cerrarAlerta()" class="modal-btn">Aceptar</button>
        </div>
    </div>

    <!-- NUEVO: Ventana Modal de Resultados -->
    <div id="ventanaResultados" class="modal-overlay">
        <div class="modal-resultados-content">
            <div class="modal-resultados-header">
                <h3 id="tituloVentanaResultados">Libros Localizados</h3>
                <button onclick="cerrarVentanaResultados()" class="btn-cerrar-modal">Cerrar ✕</button>
            </div>
            <div id="listaResultados" class="modal-resultados-body">
                <!-- Los libros se inyectarán aquí -->
            </div>
        </div>
    </div>

    <script>
        // Variable para guardar una acción al cerrar la alerta
        let accionAlCerrarAlerta = null;

        function mostrarAlerta(mensaje, accionOpcional = null) {
            document.getElementById("mensajeAlerta").innerText = mensaje;
            document.getElementById("modalAlerta").style.display = "flex";
            accionAlCerrarAlerta = accionOpcional;
        }

        function cerrarAlerta() {
            document.getElementById("modalAlerta").style.display = "none";
            // Ejecutar la acción configurada si la hay
            if (accionAlCerrarAlerta) {
                accionAlCerrarAlerta();
                accionAlCerrarAlerta = null; // Reiniciarla
            }
        }

        function cerrarVentanaResultados() {
            document.getElementById("ventanaResultados").style.display = "none";
        }

        // Función para quitar acentos y pasar a minúsculas
        function normalizarTexto(texto) {
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        // Función reutilizada de Signatura.html para procesar el click en "Ubicación en sala"
        function procesarLocalizacion(event, signaturaStr) {
            event.stopPropagation(); // Prevenir que el clic se propague y abra el OPAC
            
            let signatura = signaturaStr ? signaturaStr.trim() : "";

            if (signatura === "" || signatura === "HG") {
                mostrarAlerta("No se ha encontrado una signatura válida para este libro.");
                return;
            }

            if (!signatura.startsWith("HG")) {
                mostrarAlerta("Recuerda que los libros que se encuentran en las salas comienzan por HG.\n\nSi tu signatura: " + signatura + " es correcta, te ayudaremos a localizar el libro. Pregunta en el mostrador al personal de biblioteca.");
                return; 
            }

            let fichero = signatura;

            fichero = fichero.replace(/\/AST$/i, "");
            fichero = fichero.replace(/\/COMIC$/i, "");

            if (!fichero.endsWith("/4")) {
                fichero = fichero.replace(/(?<![a-zA-Z])CR(?![a-zA-Z]).*/i, "CR");
            }

            let sig = "";
            let ultimoIndiceBarra = fichero.lastIndexOf("/");

            if (ultimoIndiceBarra !== -1) {
                let parteDerecha = fichero.substring(ultimoIndiceBarra + 1);

                if (parteDerecha === "4") {
                    sig = "HG/4";
                } else {
                    sig = fichero.substring(0, ultimoIndiceBarra);
                }
            } else {
                sig = fichero;
            }

            window.location.href = "localizador.html?sig=" + encodeURIComponent(sig) + "&orig=" + encodeURIComponent(signatura);
        }

        async function localizarPorTitulo(event) {
            event.preventDefault();
            const tituloInput = document.getElementById("campoTitulo").value.trim();
            
            if (tituloInput === "") {
                mostrarAlerta("Por favor, introduce un título o parte de él para realizar la búsqueda.");
                return;
            }

            const queryNormalizada = normalizarTexto(tituloInput);
            let librosEncontrados = [];
            let archivoIndice = 1;
            let seguirBuscando = true;

            try {
                while (seguirBuscando) {
                    let respuesta = await fetch(`Grados/libros_${archivoIndice}.json`);
                    
                    if (!respuesta.ok) {
                        seguirBuscando = false; 
                        break;
                    }
                    
                    let libros = await respuesta.json();
                    
                    for (let libro of libros) {
                        if (libro.titulo) {
                            const tituloLibroNormalizado = normalizarTexto(libro.titulo);
                            
                            if (tituloLibroNormalizado.includes(queryNormalizada)) {
                                librosEncontrados.push(libro);
                                
                                if (librosEncontrados.length > 20) {
                                    // Se le pasa la función buscarEnCatalogo para que se ejecute al pulsar "Aceptar"
                                    mostrarAlerta(
                                        "Se han encontrado demasiados resultados (más de 20). Por favor, refina el título para realizar una búsqueda más concreta.",
                                        buscarEnCatalogo
                                    );
                                    return; 
                                }
                            }
                        }
                    }
                    archivoIndice++;
                }

                if (librosEncontrados.length === 0) {
                    mostrarAlerta("No se ha encontrado ningún libro que contenga ese texto en el título.");
                } else {
                    renderizarResultadosEnVentana(librosEncontrados);
                }

            } catch (error) {
                console.error("Error al buscar en los archivos JSON:", error);
                mostrarAlerta("Se ha producido un error al intentar localizar los libros. Verifica que los archivos .json estén accesibles.");
            }
        }

        function renderizarResultadosEnVentana(resultados) {
            const contenedorLista = document.getElementById("listaResultados");
            contenedorLista.innerHTML = ""; // Limpiar resultados anteriores
            
            document.getElementById("tituloVentanaResultados").innerText = `Resultados: ${resultados.length} libro(s)`;

            resultados.forEach(libro => {
                const divLibro = document.createElement("div");
                divLibro.className = "libro-item";
                
                // Acción al hacer clic en la tarjeta (abre OPAC solo por título)
                divLibro.onclick = () => {
                    const urlBase = "https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=131&START=1&FORM=1";
                    let queryParams = "";
                    if (libro.titulo) {
                        queryParams += "&xsqf01=" + encodeURIComponent('"' + libro.titulo + '"');
                    }
                    window.open(urlBase + queryParams, "_blank");
                };
                
                // Título
                const divTitulo = document.createElement("div");
                divTitulo.className = "libro-titulo-res";
                divTitulo.innerText = libro.titulo || "Título no disponible";
                
                // Signatura
                const divSignatura = document.createElement("div");
                divSignatura.className = "libro-signatura-res";
                const textoSignatura = libro.signatura ? libro.signatura : "No disponible";
                divSignatura.innerHTML = `<span>🔖</span> ${textoSignatura}`;

                // Localización convertida en botón de redirección
                const divLocalizacion = document.createElement("div");
                divLocalizacion.className = "libro-localizacion-res";
                const textoLocalizacion = libro.localizacion ? libro.localizacion : "Consultar ubicación en sala";
                divLocalizacion.innerHTML = `<span>📍</span> ${textoLocalizacion}`;
                divLocalizacion.onclick = (e) => procesarLocalizacion(e, libro.signatura);
                
                // Agregar todo a la tarjeta (el autor ha sido omitido)
                divLibro.appendChild(divTitulo);
                divLibro.appendChild(divSignatura);
                divLibro.appendChild(divLocalizacion);
                
                contenedorLista.appendChild(divLibro);
            });

            // Mostrar la ventana modal
            document.getElementById("ventanaResultados").style.display = "flex";
        }
        
        function buscarEnCatalogo() {
            const titulo = document.getElementById("campoTitulo").value.trim();

            if (titulo === "") {
                window.open("https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac", "_blank");
            } else {
                const urlBase = "https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=131&xsqf01=";
                const urlFinal = urlBase + encodeURIComponent('"' + titulo + '"') + "&START=1&FORM=1";
                window.open(urlFinal, "_blank");
            }
        }
    </script>
</body>
</html>
