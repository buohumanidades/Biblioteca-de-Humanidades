<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda por Título · Biblioteca de Humanidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { stone: { 50: '#FAF8F5', 100: '#F4F0E8', 200: '#E6DFC', 300: '#D5CBBF', 800: '#2A2725', 900: '#1A1817' }, sand: '#C5A059' }, fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['Space Grotesk', 'monospace'] } } } }
    </script>
    <style>
        body { background-color: #F4F0E8; color: #1A1817; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .editorial-title { font-family: 'Cormorant Garamond', serif; letter-spacing: -0.02em; line-height: 0.95; }
        .grid-line-b { border-bottom: 1px solid rgba(26, 24, 23, 0.12); }
        .modal-active { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content-active { transform: translateY(0) !important; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #F4F0E8; } ::-webkit-scrollbar-thumb { background: #1A1817; }
    </style>
</head>
<body class="antialiased selection:bg-stone-800 selection:text-stone-50 flex flex-col min-h-screen">

    <header class="sticky top-0 z-40 bg-stone-100/90 backdrop-blur-md grid-line-b">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div>
                <span class="block text-xs font-mono font-medium tracking-[0.3em] text-stone-800 uppercase">B . U . O</span>
                <span class="text-[11px] text-stone-500 font-mono tracking-wider block mt-0.5">CAMPUS DE EL MILÁN</span>
            </div>
            <a href="index.html" class="inline-flex items-center space-x-2 text-xs font-mono px-4 py-2 border border-stone-800 text-stone-800 hover:bg-stone-900 hover:text-stone-100 transition-all uppercase tracking-wider">
                <i class="fa-solid fa-arrow-left text-[10px]"></i><span>Volver al inicio</span>
            </a>
        </div>
    </header>

    <section class="grid-line-b bg-stone-900 text-stone-100 relative overflow-hidden">
        <img src="imagenes/buobh.png" onerror="this.src='https://via.placeholder.com/1300x400?text=Biblioteca'" alt="Biblioteca" class="absolute inset-0 w-full h-full object-cover opacity-20 filter">
        <div class="max-w-7xl mx-auto px-6 py-16 md:py-24 relative z-10 text-center">
            <span class="text-xs font-mono text-sand font-semibold uppercase tracking-widest block mb-4">[ BÚSQUEDA DIRECTA ]</span>
            <h1 class="editorial-title text-4xl md:text-6xl font-light mb-6">Búsqueda por Título.</h1>
        </div>
    </section>

    <main class="max-w-3xl mx-auto px-6 py-16 flex flex-col items-center gap-8 flex-1">
        
        <p class="font-mono text-sm text-stone-600 text-center leading-relaxed">
            Escribe el título o parte del mismo para consultar los libros registrados en el fondo de las salas de lectura.
        </p>
        
        <div class="w-full flex flex-col items-center gap-4">
            <input type="text" id="campoTitulo" class="w-full md:w-3/4 px-6 py-4 text-center font-mono text-xl border-2 border-stone-300 bg-stone-50 text-stone-900 focus:outline-none focus:border-stone-900 focus:bg-white transition-all placeholder:text-stone-400" 
                   placeholder="Título de la obra...">
            
            <button onclick="localizarPorTitulo(event)" class="w-full md:w-3/4 bg-stone-900 text-sand hover:bg-sand hover:text-stone-900 py-4 px-8 font-mono text-sm uppercase tracking-widest font-bold transition-all flex items-center justify-center gap-3">
                <i class="fa-solid fa-magnifying-glass"></i> Localizar libros
            </button>
        </div>

        <div class="w-full md:w-3/4 bg-stone-100 border border-stone-200 p-8 flex flex-col items-center gap-4 mt-8">
            <span class="font-serif text-xl text-stone-800 text-center">¿No lo encuentras aquí o quieres ver el catálogo general?</span>
            <button onclick="buscarEnCatalogo()" class="w-full border border-stone-800 bg-transparent text-stone-800 hover:bg-stone-900 hover:text-stone-100 py-3 font-mono text-xs uppercase tracking-widest transition-all">
                <i class="fa-solid fa-book-open mr-2"></i> Búscalo en el catálogo
            </button>
        </div>
    </main>

    <!-- Modal Alertas -->
    <div id="modalAlerta" class="fixed inset-0 z-[3000] bg-stone-900/60 backdrop-blur-sm flex justify-center items-center opacity-0 pointer-events-none transition-all duration-300" onclick="cerrarAlerta()">
        <div class="bg-stone-50 w-11/12 max-w-sm p-8 text-center border border-stone-200 transform translate-y-4 transition-transform duration-300 modal-content" onclick="event.stopPropagation()">
            <i class="fa-solid fa-circle-info text-4xl text-sand mb-4"></i>
            <p id="mensajeAlerta" class="font-sans text-sm text-stone-700 mb-8 whitespace-pre-wrap leading-relaxed">Mensaje</p>
            <button onclick="cerrarAlerta()" class="w-full bg-stone-900 text-stone-100 py-3 font-mono text-xs uppercase tracking-widest hover:bg-sand hover:text-stone-900 transition-colors">
                Aceptar
            </button>
        </div>
    </div>

    <!-- Modal Resultados -->
    <div id="ventanaResultados" class="fixed inset-0 z-[2000] bg-stone-900/80 backdrop-blur-sm flex justify-center items-center opacity-0 pointer-events-none transition-all duration-300" onclick="cerrarVentanaResultados()">
        <div class="bg-stone-50 w-11/12 max-w-3xl max-h-[85vh] flex flex-col relative rounded-sm shadow-2xl transform translate-y-4 transition-transform duration-300 modal-content" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center p-6 md:p-8 border-b border-stone-200 shrink-0">
                <h3 id="tituloVentanaResultados" class="editorial-title text-2xl md:text-3xl font-light text-stone-900">Libros Localizados</h3>
                <button onclick="cerrarVentanaResultados()" class="text-stone-400 hover:text-stone-900 transition-colors text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="listaResultados" class="p-6 md:p-8 overflow-y-auto flex-1 flex flex-col gap-4 font-sans">
                <!-- Se inyectan las tarjetas aquí -->
            </div>
        </div>
    </div>

    <script>
        let accionAlCerrarAlerta = null;

        function mostrarAlerta(mensaje, accionOpcional = null) {
            document.getElementById("mensajeAlerta").innerText = mensaje;
            const modal = document.getElementById("modalAlerta");
            const content = modal.querySelector('.modal-content');
            modal.classList.add("modal-active");
            content.classList.add("modal-content-active");
            accionAlCerrarAlerta = accionOpcional;
        }

        function cerrarAlerta() {
            const modal = document.getElementById("modalAlerta");
            const content = modal.querySelector('.modal-content');
            modal.classList.remove("modal-active");
            content.classList.remove("modal-content-active");
            if (accionAlCerrarAlerta) {
                accionAlCerrarAlerta();
                accionAlCerrarAlerta = null;
            }
        }

        function cerrarVentanaResultados() {
            const modal = document.getElementById("ventanaResultados");
            const content = modal.querySelector('.modal-content');
            modal.classList.remove("modal-active");
            content.classList.remove("modal-content-active");
        }

        function normalizarTexto(texto) {
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function procesarLocalizacion(event, signaturaStr) {
            event.stopPropagation();
            let signatura = signaturaStr ? signaturaStr.trim() : "";

            if (signatura === "" || signatura === "HG") {
                mostrarAlerta("No se ha encontrado una signatura válida para este libro.");
                return;
            }
            if (!signatura.startsWith("HG")) {
                mostrarAlerta("Recuerda que los libros que se encuentran en las salas comienzan por HG.\n\nSi tu signatura: " + signatura + " es correcta, te ayudaremos a localizar el libro. Pregunta en el mostrador al personal de biblioteca.");
                return; 
            }

            let fichero = signatura.replace(/\/AST$/i, "").replace(/\/COMIC$/i, "");
            if (!fichero.endsWith("/4")) fichero = fichero.replace(/(?<![a-zA-Z])CR(?![a-zA-Z]).*/i, "CR");

            let sig = "";
            let ultimoIndiceBarra = fichero.lastIndexOf("/");

            if (ultimoIndiceBarra !== -1) {
                let parteDerecha = fichero.substring(ultimoIndiceBarra + 1);
                if (parteDerecha === "4") sig = "HG/4";
                else sig = fichero.substring(0, ultimoIndiceBarra);
            } else {
                sig = fichero;
            }

            window.open("localizador.html?sig=" + encodeURIComponent(sig) + "&orig=" + encodeURIComponent(signatura), "_blank");
        }

        async function localizarPorTitulo(event) {
            event.preventDefault();
            const tituloInput = document.getElementById("campoTitulo").value.trim();
            
            if (tituloInput === "") {
                mostrarAlerta("Por favor, introduce un título o parte de él para realizar la búsqueda.");
                return;
            }

            const botonLocalizar = event.currentTarget;
            const contenidoOriginalBoton = botonLocalizar.innerHTML;
            
            botonLocalizar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Buscando...';
            botonLocalizar.style.pointerEvents = 'none';
            botonLocalizar.style.opacity = '0.7';

            const queryNormalizada = normalizarTexto(tituloInput);
            let librosEncontrados = [];
            let archivoIndice = 1;
            let seguirBuscando = true;

            try {
                while (seguirBuscando) {
                    let respuesta = await fetch(`Grados/libros_${archivoIndice}.json`);
                    
                    if (!respuesta.ok) { seguirBuscando = false; break; }
                    
                    let libros = await respuesta.json();
                    for (let libro of libros) {
                        if (libro.titulo) {
                            const tituloLibroNormalizado = normalizarTexto(libro.titulo);
                            if (tituloLibroNormalizado.includes(queryNormalizada)) {
                                librosEncontrados.push(libro);
                                if (librosEncontrados.length > 20) {
                                    botonLocalizar.innerHTML = contenidoOriginalBoton;
                                    botonLocalizar.style.pointerEvents = 'auto';
                                    botonLocalizar.style.opacity = '1';
                                    
                                    mostrarAlerta(
                                        "Se han encontrado demasiados resultados. Por favor, refina el título para realizar una búsqueda más concreta.\n\nTe reenvío al catálogo general para que valores los resultados.",
                                        buscarEnCatalogo
                                    );
                                    return; 
                                }
                            }
                        }
                    }
                    archivoIndice++;
                }

                botonLocalizar.innerHTML = contenidoOriginalBoton;
                botonLocalizar.style.pointerEvents = 'auto';
                botonLocalizar.style.opacity = '1';

                if (librosEncontrados.length === 0) {
                    mostrarAlerta("No se ha encontrado ningún libro que contenga ese texto en el título.");
                } else {
                    renderizarResultadosEnVentana(librosEncontrados);
                }
            } catch (error) {
                botonLocalizar.innerHTML = contenidoOriginalBoton;
                botonLocalizar.style.pointerEvents = 'auto';
                botonLocalizar.style.opacity = '1';
                console.error("Error:", error);
                mostrarAlerta("Error al intentar localizar los libros. Verifica que los datos estén accesibles.");
            }
        }

        function renderizarResultadosEnVentana(resultados) {
            const contenedorLista = document.getElementById("listaResultados");
            contenedorLista.innerHTML = "";
            document.getElementById("tituloVentanaResultados").innerText = `Resultados: ${resultados.length} libro(s)`;

            resultados.forEach(libro => {
                const divLibro = document.createElement("div");
                divLibro.className = "bg-white border border-stone-200 p-6 flex flex-col gap-3 border-l-4 border-l-sand hover:shadow-md transition-all cursor-pointer relative group rounded-sm";
                
                divLibro.onclick = () => {
                    const urlBase = "https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=131&START=1&FORM=1";
                    let queryParams = libro.titulo ? "&xsqf01=" + encodeURIComponent('"' + libro.titulo + '"') : "";
                    window.open(urlBase + queryParams, "_blank");
                };
                
                // Texto superior derecha
                const textoCat = document.createElement("span");
                textoCat.className = "absolute top-6 right-6 text-[10px] font-mono uppercase tracking-widest text-stone-400 group-hover:text-stone-900 transition-colors hidden sm:block";
                textoCat.innerText = "Catálogo ↗";
                divLibro.appendChild(textoCat);

                // Titulo
                const divTitulo = document.createElement("div");
                divTitulo.className = "font-serif text-xl text-stone-900 sm:pr-20";
                divTitulo.innerText = libro.titulo || "Título no disponible";
                
                // Signatura
                const divSignatura = document.createElement("div");
                divSignatura.className = "inline-flex items-center gap-2 bg-stone-100 text-stone-600 px-3 py-1 font-mono text-xs font-bold w-max rounded-sm";
                const textoSignatura = libro.signatura ? libro.signatura : "No disponible";
                divSignatura.innerHTML = `<i class="fa-solid fa-bookmark text-sand"></i> ${textoSignatura}`;

                // Localizacion
                const divLocalizacion = document.createElement("div");
                divLocalizacion.className = "inline-flex items-center gap-2 bg-stone-900 text-stone-100 px-4 py-2 font-mono text-xs uppercase tracking-widest w-max rounded-sm hover:bg-sand hover:text-stone-900 transition-colors mt-2";
                const textoLocalizacion = libro.localizacion ? libro.localizacion : "Consultar ubicación en sala";
                divLocalizacion.innerHTML = `<i class="fa-solid fa-location-dot"></i> Ubicar Estantería`;
                divLocalizacion.onclick = (e) => procesarLocalizacion(e, libro.signatura);
                
                divLibro.appendChild(divTitulo);
                divLibro.appendChild(divSignatura);
                divLibro.appendChild(divLocalizacion);
                
                contenedorLista.appendChild(divLibro);
            });

            const modal = document.getElementById("ventanaResultados");
            const content = modal.querySelector('.modal-content');
            modal.classList.add("modal-active");
            content.classList.add("modal-content-active");
        }
        
        function buscarEnCatalogo() {
            const titulo = document.getElementById("campoTitulo").value.trim();
            if (titulo === "") {
                window.open("https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac", "_blank");
            } else {
                const urlBase = "https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=131&xsqf01=";
                const urlFinal = urlBase + encodeURIComponent('"' + titulo + '"') + "&START=1&FORM=1";
                window.open(urlFinal, "_blank");
            }
        }
    </script>
</body>
</html>
