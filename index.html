<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Humanidades | Búsqueda</title>
    
    <!-- Cargamos Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        /* Importar fuente elegante para encabezados */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            /* 👇 ZONA PARA RETOCAR EL TAMAÑO DE LA IMAGEN 👇 */
            --alto-de-la-imagen: 25vh;  
            --ancho-de-la-imagen: 100%; 
            /* 👆 ========================================== 👆 */
        }

        /* Animación para el fondo juvenil */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Estilos generales */
        body { 
            font-family: 'Inter', Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #e0c3fc, #ffc3a0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #2c3e50; 
            height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }
        
        /* Contenedor principal con efecto "Glassmorphism" */
        .container { 
            width: 95vw; 
            max-width: 1300px; 
            height: 94vh; 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px); 
            border-radius: 16px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }
        
        /* =========================================
           SECCIÓN DE LA IMAGEN
           ========================================= */
        .hero-section {
            width: var(--ancho-de-la-imagen);
            flex: 0 0 var(--alto-de-la-imagen); 
            position: relative;
            background-color: #34495e;
            overflow: hidden;
        }

        .shelf-photo-panoramic {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center 60%;
            filter: brightness(0.85); 
        }

        /* "Necesito encontrar un libro" */
        .professional-badge {
            position: absolute;
            bottom: 25px;
            right: 35px;
            background: transparent;
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);
            padding: 0;
            border: none;
        }

        /* =========================================
           CONTENIDO PRINCIPAL
           ========================================= */
        .main-content {
            flex: 1; 
            padding: 2vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        /* Título */
        h1 { 
            font-family: 'Playfair Display', serif; 
            color: #1a252f; 
            text-align: center; 
            border-bottom: 1px solid #dce6f1; 
            padding-bottom: 1vh; 
            font-size: 2.2em; 
            margin: 0;
        }

        /* Recuadro de materias (Estilo "Página de libro") */
        .subjects-fieldset {
            border: 1px solid #d3cbb8; 
            border-radius: 12px;
            padding: 1.8vh 2vw;
            margin: 0;
            background: linear-gradient(135deg, #fdfcfb 0%, #f4efe6 100%);
            box-shadow: inset 0 0 20px rgba(139, 115, 85, 0.03), 0 4px 15px rgba(0,0,0,0.02);
        }

        .subjects-legend {
            font-weight: 600;
            color: #5c4b37; 
            font-size: 1.1em;
            padding: 0 12px;
            margin-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #fdfcfb; 
            border-radius: 4px;
        }

        /* Cuadrícula de botones */
        .subjects-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vh 2vw;
        }

        /* Botones de materias */
        .subject-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5vh 1.5vw; 
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #4b6584, #2c3e50); 
            font-weight: 500;
            font-size: 1.05em;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .subject-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #34495e, #1a252f);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* =========================================
           BOTONES DESTACADOS (Signatura y Cámara)
           ========================================= */
        .action-buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 1.5vh 0;
            flex-wrap: wrap;
        }

        /* Botón original de Signatura */
        .signature-btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 30px 12px 12px; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #0f2027 100%); 
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 60px; 
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.25em; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 12px 30px rgba(30, 60, 114, 0.4), 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        .signature-btn:hover {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 50%, #1f4037 100%); 
            transform: translateY(-6px) scale(1.02); 
            box-shadow: 0 18px 40px rgba(30, 60, 114, 0.5), 0 6px 12px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.8);
        }

        /* NUEVO: Botón de Escáner de Cámara */
        .camera-btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 30px 12px 12px; 
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); 
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 60px; 
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.25em; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 12px 30px rgba(15, 32, 39, 0.4), 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        .camera-btn:hover {
            background: linear-gradient(135deg, #2c5364 0%, #203a43 50%, #0f2027 100%); 
            transform: translateY(-6px) scale(1.02); 
            box-shadow: 0 18px 40px rgba(15, 32, 39, 0.5), 0 6px 12px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            background-color: #ffffff; 
            border-radius: 50%; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-right: 15px;
        }

        /* Servicios Adicionales */
        .services-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        h2.section-title { 
            color: #7f8c8d; 
            font-size: 0.9em; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vw;
        }

        .links-container a { 
            display: block; 
            padding: 1.4vh 1vw; 
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%); 
            text-decoration: none; 
            color: #1e293b; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: 600; 
            border: 1px solid #cbd5e1; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.06); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-size: 0.95em;
        }
        
        .links-container a:hover { 
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); 
            color: #0f172a;
            transform: translateY(-3px); 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            border-color: #94a3b8;
        }

        /* Colores de alto contraste para el panel de direcciones */
        .dir-izq { background-color: #0288d1 !important; border-color: #00e5ff !important; }
        .dir-der { background-color: #388e3c !important; border-color: #00e676 !important; }
        .dir-arr { background-color: #f57c00 !important; border-color: #ffea00 !important; }
        .dir-aba { background-color: #d32f2f !important; border-color: #ff1744 !important; }

        /* =========================================
           ADAPTACIÓN PARA PANTALLAS PEQUEÑAS
           ========================================= */
        @media (max-width: 900px) {
            .container { height: 98vh; width: 98vw; }
            .professional-badge { font-size: 1.4em; bottom: 15px; right: 20px; text-align: right; }
            .main-content { overflow-y: auto; justify-content: flex-start; gap: 20px; }
            .subjects-container { grid-template-columns: 1fr; gap: 10px; }
            .links-container { grid-template-columns: 1fr; gap: 10px; }
            .action-buttons-container { flex-direction: column; gap: 12px; align-items: center; }
        }
    </style>
</head>
