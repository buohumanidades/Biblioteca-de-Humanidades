<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Humanidades | Búsqueda</title>
    <style>
        /* Importar fuente elegante para encabezados */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            /* 👇 ZONA PARA RETOCAR EL TAMAÑO DE LA IMAGEN 👇 */
            --alto-de-la-imagen: 25vh;  
            --ancho-de-la-imagen: 100%; 
            /* 👆 ========================================== 👆 */
        }

        /* Estilos generales - Optimizados para ocupar exactamente la pantalla sin bajar (sin scroll) */
        body { 
            font-family: 'Inter', Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #eef2f5; 
            color: #2c3e50; 
            height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }
        
        /* Contenedor principal */
        .container { 
            width: 95vw; 
            max-width: 1300px; 
            height: 94vh; 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }
        
        /* =========================================
           SECCIÓN DE LA IMAGEN
           ========================================= */
        .hero-section {
            width: var(--ancho-de-la-imagen);
            flex: 0 0 var(--alto-de-la-imagen); 
            position: relative;
            background-color: #34495e;
            overflow: hidden;
        }

        .shelf-photo-panoramic {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center 60%;
            /* Un poco más oscuro para que el texto blanco resalte aún más */
            filter: brightness(0.85); 
        }

        /* "Necesito encontrar un libro" - Texto integrado en la imagen */
        .professional-badge {
            position: absolute;
            bottom: 25px;
            right: 35px;
            background: transparent; /* Sin fondo */
            color: #ffffff; /* Texto blanco */
            font-family: 'Playfair Display', serif;
            font-size: 1.8em; /* Un poco más grande para compensar la falta de recuadro */
            font-weight: 700;
            letter-spacing: 1px;
            /* Sombra oscura fuerte para garantizar que se lea sobre la foto */
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);
            padding: 0;
            border: none;
        }

        /* =========================================
           CONTENIDO PRINCIPAL (DISTRIBUCIÓN UNIFORME)
           ========================================= */
        .main-content {
            flex: 1; 
            padding: 2vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        /* Título */
        h1 { 
            font-family: 'Playfair Display', serif; 
            color: #1a252f; 
            text-align: center; 
            border-bottom: 1px solid #dce6f1; 
            padding-bottom: 1vh; 
            font-size: 2.2em; 
            margin: 0;
        }

        /* Recuadro de materias */
        .subjects-fieldset {
            border: 1px solid #dce6f1;
            border-radius: 10px;
            padding: 1.5vh 2vw;
            margin: 0;
            background-color: transparent;
        }

        .subjects-legend {
            font-weight: 600;
            color: #34495e;
            font-size: 1.1em;
            padding: 0 10px;
            margin-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Cuadrícula de botones */
        .subjects-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vh 2vw;
        }

        /* Botones de materias */
        .subject-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5vh 1.5vw; 
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #4b6584, #2c3e50); 
            font-weight: 500;
            font-size: 1.05em;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .subject-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #34495e, #1a252f);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Botón de Signatura */
        .signature-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 2vw; 
            background: transparent;
            border: 2px solid #34495e; 
            border-radius: 8px;
            text-decoration: none;
            color: #34495e;
            font-weight: 700;
            font-size: 1.15em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .signature-btn:hover {
            background: #34495e;
            color: #ffffff; 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 73, 94, 0.2);
        }

        /* Servicios Adicionales */
        .services-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        h2.section-title { 
            color: #7f8c8d; 
            font-size: 0.9em; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vw;
        }

        .links-container a { 
            display: block; 
            padding: 1.2vh 1vw; 
            background: #f8f9fa; 
            text-decoration: none; 
            color: #2c3e50; 
            border-radius: 6px; 
            text-align: center; 
            font-weight: 500; 
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            font-size: 0.95em;
        }
        
        .links-container a:hover { 
            background: #e2e8f0; 
            color: #1a252f;
        }

        /* =========================================
           ADAPTACIÓN PARA PANTALLAS PEQUEÑAS
           ========================================= */
        @media (max-width: 900px) {
            .container { height: 98vh; width: 98vw; }
            .professional-badge { font-size: 1.4em; bottom: 15px; right: 20px; text-align: right; }
            .main-content { overflow-y: auto; justify-content: flex-start; gap: 20px; }
            .subjects-container { grid-template-columns: 1fr; gap: 10px; }
            .links-container { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Sección Hero Panorámica -->
        <div class="hero-section">
            <!-- Usa la imagen de la sala panorámica -->
            <img src="sala.png" alt="Interior detallado de biblioteca moderna" class="shelf-photo-panoramic" onerror="this.src='https://via.placeholder.com/1300x400?text=Biblioteca+de+Humanidades'">
            
            <!-- Texto integrado sobre la foto, sin recuadro -->
            <div class="professional-badge">
                Necesito encontrar un libro
            </div>
        </div>

        <!-- Contenido Distribuido (Sin Scroll) -->
        <div class="main-content">
            
            <!-- Título Principal -->
            <h1>Biblioteca de Humanidades</h1>

            <!-- Materias -->
            <fieldset class="subjects-fieldset">
                <legend class="subjects-legend">Por materia</legend>
                <div class="subjects-container">
                    <a href="8.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">📖</span><span>Lenguaje, Lingüística, Literatura</span></div>
                        <span>➔</span>
                    </a>
                    <a href="9.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🌍</span><span>Geografía e Historia</span></div>
                        <span>➔</span>
                    </a>
                    <a href="7.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🎨</span><span>Arte y Arquitectura</span></div>
                        <span>➔</span>
                    </a>
                    <a href="1.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🧠</span><span>Filosofía y Ciencias Sociales</span></div>
                        <span>➔</span>
                    </a>
                </div>
            </fieldset>

            <!-- Signatura Destacado -->
            <a href="Signatura.html" class="signature-btn">
                <div class="btn-content">
                    <span class="btn-icon">📌</span>
                    <span>Sé la signatura</span>
                </div>
                <span>➔</span>
            </a>

            <!-- Servicios Adicionales -->
            <div class="services-wrapper">
                <h2 class="section-title">Servicios Adicionales</h2>
                <div class="links-container">
                    <a href="https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=101" target="_blank">Búsqueda general en el catálogo</a>
                    <a href="https://buo.uniovi.es/" target="_blank">Portal de la Biblioteca (BUO)</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Script de detección de SO -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const body = document.body;

            if (/windows/i.test(userAgent)) {
                body.classList.add('os-windows');
            }
            if (/android|iphone|ipad|ipod/i.test(userAgent)) {
                body.classList.add('is-mobile-device');
            }
        });
    </script>
</body>
</html>
