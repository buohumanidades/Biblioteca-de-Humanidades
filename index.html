<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Humanidades | Búsqueda</title>
    <style>
        /* Importar fuente elegante para encabezados */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');

        /* Estilos generales - Optimizados para ocupar exactamente la pantalla */
        body { 
            font-family: 'Inter', Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #eef2f5; 
            color: #2c3e50; 
            height: 100vh; /* Ocupa el 100% del alto de la ventana */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Evita el scroll en la página completa */
        }
        
        /* Contenedor principal mucho más ancho y ajustado a la pantalla */
        .container { 
            width: 95vw; 
            max-width: 1300px; /* Anchura máxima extendida */
            height: 94vh; /* Ocupa el 94% del alto de la pantalla */
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }
        
        /* =========================================
           SECCIÓN DE LA IMAGEN (MÁS ANCHA)
           ========================================= */
        .hero-section {
            width: 100%;
            flex: 0 0 35%; /* Ocupa exactamente el 35% de la altura de la tarjeta */
            position: relative;
            background-color: #34495e;
        }

        .shelf-photo-panoramic {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center 60%;
            filter: brightness(0.9); 
        }

        /* "Necesito encontrar un libro" - Diseño Profesional y Elegante */
        .professional-badge {
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px); /* Efecto cristal */
            padding: 12px 25px;
            border-radius: 6px;
            border-left: 5px solid #2c3e50;
            color: #1a252f;
            font-family: 'Playfair Display', serif;
            font-size: 1.4em;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .professional-badge::before {
            content: '🔍';
            font-size: 1.2em;
        }

        /* =========================================
           CONTENIDO PRINCIPAL (DISTRIBUCIÓN UNIFORME)
           ========================================= */
        .main-content {
            flex: 1; /* Ocupa el espacio restante (65%) */
            padding: 2vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribuye elementos sin necesidad de bajar */
        }

        /* Título */
        h1 { 
            font-family: 'Playfair Display', serif; 
            color: #1a252f; 
            text-align: center; 
            border-bottom: 1px solid #dce6f1; 
            padding-bottom: 1vh; 
            font-size: 2.2em; 
            margin: 0;
        }

        /* Recuadro de materias */
        .subjects-fieldset {
            border: 1px solid #dce6f1;
            border-radius: 10px;
            padding: 1.5vh 2vw;
            margin: 0;
            background-color: transparent;
        }

        .subjects-legend {
            font-weight: 600;
            color: #34495e;
            font-size: 1.1em;
            padding: 0 10px;
            margin-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Cuadrícula de botones (2x2 para ser más ancho) */
        .subjects-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vh 2vw;
        }

        /* Botones de materias */
        .subject-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5vh 1.5vw; 
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #4b6584, #2c3e50); 
            font-weight: 500;
            font-size: 1.05em;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .subject-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #34495e, #1a252f);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Botón de Signatura - Estilo más sobrio y profesional */
        .signature-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.8vh 2vw; 
            background: transparent;
            border: 2px solid #34495e; 
            border-radius: 8px;
            text-decoration: none;
            color: #34495e;
            font-weight: 700;
            font-size: 1.15em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .signature-btn:hover {
            background: #34495e;
            color: #ffffff; 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 73, 94, 0.2);
        }

        /* Servicios Adicionales */
        .services-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        h2.section-title { 
            color: #7f8c8d; 
            font-size: 0.9em; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vw;
        }

        .links-container a { 
            display: block; 
            padding: 1.2vh 1vw; 
            background: #f8f9fa; 
            text-decoration: none; 
            color: #2c3e50; 
            border-radius: 6px; 
            text-align: center; 
            font-weight: 500; 
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            font-size: 0.95em;
        }
        
        .links-container a:hover { 
            background: #e2e8f0; 
            color: #1a252f;
        }

        /* =========================================
           ADAPTACIÓN PARA PANTALLAS PEQUEÑAS
           ========================================= */
        @media (max-width: 900px) {
            .container { height: 98vh; width: 98vw; }
            .hero-section { flex: 0 0 25%; }
            .professional-badge { font-size: 1.1em; bottom: 10px; right: 10px; padding: 10px 15px; }
            .main-content { overflow-y: auto; justify-content: flex-start; gap: 20px; }
            .subjects-container { grid-template-columns: 1fr; gap: 10px; }
            .links-container { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Sección Hero Panorámica -->
        <div class="hero-section">
            <!-- Usa la imagen de la sala que me enviaste -->
            <img src="sala.jpg" alt="Interior detallado de biblioteca moderna" class="shelf-photo-panoramic" onerror="this.src='https://via.placeholder.com/1300x400?text=Biblioteca+de+Humanidades'">
            
            <!-- Etiqueta Profesional: Sustituye al círculo -->
            <div class="professional-badge">
                Necesito encontrar un libro
            </div>
        </div>

        <!-- Contenido Distribuido (Sin Scroll) -->
        <div class="main-content">
            
            <!-- Título Principal -->
            <h1>Biblioteca de Humanidades</h1>

            <!-- Materias -->
            <fieldset class="subjects-fieldset">
                <legend class="subjects-legend">Por materia</legend>
                <div class="subjects-container">
                    <a href="8.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">📖</span><span>Lenguaje, Lingüística, Literatura</span></div>
                        <span>➔</span>
                    </a>
                    <a href="9.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🌍</span><span>Geografía e Historia</span></div>
                        <span>➔</span>
                    </a>
                    <a href="7.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🎨</span><span>Arte y Arquitectura</span></div>
                        <span>➔</span>
                    </a>
                    <a href="1.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🧠</span><span>Filosofía y Ciencias Sociales</span></div>
                        <span>➔</span>
                    </a>
                </div>
            </fieldset>

            <!-- Signatura Destacado -->
            <a href="Signatura.html" class="signature-btn">
                <div class="btn-content">
                    <span class="btn-icon">📌</span>
                    <span>Sé la signatura</span>
                </div>
                <span>➔</span>
            </a>

            <!-- Servicios Adicionales -->
            <div class="services-wrapper">
                <h2 class="section-title">Servicios Adicionales</h2>
                <div class="links-container">
                    <a href="https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=101" target="_blank">Búsqueda general en el catálogo</a>
                    <a href="https://buo.uniovi.es/" target="_blank">Portal de la Biblioteca (BUO)</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Script de detección de SO -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const body = document.body;

            if (/windows/i.test(userAgent)) {
                body.classList.add('os-windows');
            }
            if (/android|iphone|ipad|ipod/i.test(userAgent)) {
                body.classList.add('is-mobile-device');
            }
        });
    </script>
</body>
</html>
