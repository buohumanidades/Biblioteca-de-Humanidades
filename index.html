<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Humanidades | Búsqueda</title>
    <style>
        /* Importar fuente elegante para encabezados */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --alto-de-la-imagen: 22vh;  
            --ancho-de-la-imagen: 100%; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            font-family: 'Inter', Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #e0c3fc, #ffc3a0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #2c3e50; 
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden; 
        }
        
        .container { 
            width: 96vw; 
            max-width: 1300px; 
            min-height: 96vh; 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px); 
            border-radius: 16px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            margin: 1vh auto;
        }
        
        .hero-section {
            width: var(--ancho-de-la-imagen);
            flex: 0 0 var(--alto-de-la-imagen); 
            position: relative;
            background-color: #34495e;
            overflow: hidden;
        }

        .shelf-photo-panoramic {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center 60%;
            filter: brightness(0.85); 
        }

        .professional-badge {
            position: absolute;
            bottom: 15px;
            right: 25px;
            background: transparent;
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);
            padding: 0;
            border: none;
        }

        .main-content {
            flex: 1; 
            padding: 1.5vh 3vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            gap: 1vh;
        }

        h1 { 
            font-family: 'Playfair Display', serif; 
            color: #1a252f; 
            text-align: center; 
            border-bottom: 1px solid #dce6f1; 
            padding-bottom: 0.5vh; 
            font-size: 1.8em; 
            margin: 0;
        }

        .subjects-fieldset {
            border: 1px solid #d3cbb8; 
            border-radius: 10px;
            padding: 1vh 1.5vw;
            margin: 0;
            background: linear-gradient(135deg, #fdfcfb 0%, #f4efe6 100%);
            box-shadow: inset 0 0 20px rgba(139, 115, 85, 0.03), 0 4px 15px rgba(0,0,0,0.02);
        }

        .subjects-legend {
            font-weight: 600;
            color: #5c4b37; 
            font-size: 0.95em;
            padding: 0 10px;
            margin-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #fdfcfb; 
            border-radius: 4px;
        }

        .subjects-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1vh 1.5vw;
        }

        .subject-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1vh 1.2vw; 
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #4b6584, #2c3e50); 
            font-weight: 500;
            font-size: 0.95em;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .subject-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #34495e, #1a252f);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .signature-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 35px 10px 10px; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #0f2027 100%); 
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px; 
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.15em; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(30, 60, 114, 0.4), 0 4px 6px rgba(0, 0, 0, 0.1);
            width: max-content; 
            margin: 0.5vh auto; 
            gap: 15px; 
            position: relative;
            z-index: 10;
        }

        .signature-btn:hover {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 50%, #1f4037 100%); 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 14px 30px rgba(30, 60, 114, 0.5);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .signature-icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: #ffffff; 
            border-radius: 50%; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .services-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
        }

        h2.section-title { 
            color: #7f8c8d; 
            font-size: 0.8em; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1vw;
        }

        .links-container a { 
            display: block; 
            padding: 1vh 1vw; 
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%); 
            text-decoration: none; 
            color: #1e293b; 
            border-radius: 6px; 
            text-align: center; 
            font-weight: 600; 
            border: 1px solid #cbd5e1; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-size: 0.85em; /* Reducido para garantizar visibilidad en móviles */
        }
        
        .links-container a:hover { 
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); 
            color: #0f172a;
            transform: translateY(-2px); 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); 
            border-color: #94a3b8;
        }

        /* Adaptación específica para móviles y pantallas compactas */
        @media (max-width: 900px) {
            body { height: auto; overflow-y: auto; padding: 10px 0; }
            .container { height: auto; min-height: unset; width: 95vw; overflow-y: visible; }
            .hero-section { --alto-de-la-imagen: 18vh; }
            .professional-badge { font-size: 1.2em; bottom: 10px; right: 15px; }
            .main-content { padding: 15px; gap: 12px; }
            h1 { font-size: 1.5em; }
            .subjects-container { grid-template-columns: 1fr; gap: 8px; }
            .links-container { grid-template-columns: 1fr; gap: 8px; }
            .links-container a { font-size: 0.9em; padding: 10px; }
            .signature-btn { font-size: 1.05em; padding: 8px 25px 8px 8px; gap: 10px; }
            .signature-icon-circle { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="hero-section">
            <img src="sala.png" alt="Interior detallado de biblioteca moderna" class="shelf-photo-panoramic" onerror="this.src='https://via.placeholder.com/1300x400?text=Biblioteca+de+Humanidades'">
            
            <div class="professional-badge">
                Necesito encontrar un libro
            </div>
        </div>

        <div class="main-content">
            
            <h1>Biblioteca de Humanidades</h1>

            <fieldset class="subjects-fieldset">
                <legend class="subjects-legend">Materias</legend>
                <div class="subjects-container">
                    <a href="8.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">📖</span><span>Lenguaje, Lingüística, Literatura</span></div>
                        <span>➔</span>
                    </a>
                    <a href="9.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🌍</span><span>Geografía e Historia</span></div>
                        <span>➔</span>
                    </a>
                    <a href="7.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🎨</span><span>Arte y Arquitectura</span></div>
                        <span>➔</span>
                    </a>
                    <a href="1.html" class="subject-btn">
                        <div class="btn-content"><span class="btn-icon">🧠</span><span>Filosofía y Ciencias Sociales</span></div>
                        <span>➔</span>
                    </a>
                </div>
            </fieldset>

            <a href="Signatura.html" class="signature-btn">
                <div class="signature-icon-circle">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 20.5C12 20.5 8.5 19 4 19C3.44772 19 3 18.5523 3 18V6C3 5.44772 3.44772 5 4 5C8.5 5 12 7.5 12 7.5" fill="#E2E8F0" stroke="#334155" stroke-width="1.2" stroke-linejoin="round"/>
                        <path d="M12 20.5C12 20.5 15.5 19 20 19C20.5523 19 21 18.5523 21 18V6C21 5.44772 20.5523 5 20 5C15.5 5 12 7.5 12 7.5" fill="#E2E8F0" stroke="#334155" stroke-width="1.2" stroke-linejoin="round"/>
                        <path d="M3 18C3 18.5523 3.44772 19 4 19C8.5 19 12 20.5 12 20.5V7.5C12 7.5 8.5 5 4 5" fill="#4ECDC4"/>
                        <path d="M21 18C21 18.5523 20.5523 19 20 19C15.5 19 12 20.5 12 20.5V7.5C12 7.5 15.5 5 20 5" fill="#FF6B6B"/>
                        <path d="M5.5 9.5H10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M5.5 12.5H8.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M14 9.5H18.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M14 12.5H17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M12 7.5V17L13.5 15.5L15 17V7.5" fill="#FFD166"/>
                        <path d="M12 20.5V7.5" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <span>Sé la SIGNATURA</span>
            </a>

            <div class="services-wrapper">
                <h2 class="section-title">Servicios Adicionales</h2>
                <div class="links-container">
                    <a href="https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=101" target="_blank">Búsqueda general en el catálogo</a>
                    <a href="https://buo.uniovi.es/" target="_blank">Portal de la Biblioteca (BUO)</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const body = document.body;

            if (/windows/i.test(userAgent)) {
                body.classList.add('os-windows');
            }
            if (/android|iphone|ipad|ipod/i.test(userAgent)) {
                body.classList.add('is-mobile-device');
            }
        });
    </script>
</body>
</html>
