<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esta etiqueta es crucial para que el diseño responsivo de tu página original siga funcionando dentro del iframe -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Humanidades</title>
    <meta name="description" content="Búsqueda en la Biblioteca de Humanidades">
    
    <style>
        /* Eliminamos cualquier margen para que tu página ocupe toda la pantalla */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita que salgan barras de desplazamiento dobles */
            background-color: #2c3e50; /* Un color de fondo por si la página tarda un segundo en cargar */
        }

        /* Hacemos que el iframe ocupe absolutamente todo el espacio disponible */
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- 👇 SUSTITUYE EL ENLACE DEL SRC POR LA DIRECCIÓN LARGA DONDE TIENES TU PÁGINA ORIGINAL 👇 -->
    <iframe 
        src="https://buohumanidades.github.io/Biblioteca-de-Humanidades/index.html" 
        title="Biblioteca de Humanidades">
    </iframe>
    <!-- 👆 =================================================================================== 👆 -->

</body>
</html>
