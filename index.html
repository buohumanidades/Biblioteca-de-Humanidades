<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Humanidades | Búsqueda</title>
    <style>
        /* Estilos generales optimizados para una experiencia profesional */
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            line-height: 1.6; 
            margin: 0; 
            padding: 0; /* Eliminado el relleno para una cabecera limpia */
            background-color: #f7f9fc; 
            color: #333; 
        }
        .container { 
            max-width: 900px; /* Un poco más ancho para la nueva imagen */
            margin: 0 auto; 
            background: #fff; 
            padding: 0; /* Relleno cero para la hero image, luego se ajustará */
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
            overflow: hidden; /* Para que la hero image respete las esquinas redondeadas */
            transition: all 0.3s ease;
        }
        
        /* Sección de la Cabecera Heroica Profresional */
        .hero-section {
            width: 100%;
            height: 350px; /* Altura de la nueva imagen panorámica */
            position: relative;
            background-color: #f4f6f7;
            overflow: hidden;
        }

        /* La nueva imagen panorámica de la biblioteca */
        .shelf-photo-panoramic {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que la imagen llene el espacio sin distorsionarse */
            z-index: 1;
            filter: brightness(0.95); /* Un toque sutil */
        }

        /* Círculo de texto superpuesto - Posicionado profesionalmente */
        .circle-badge {
            width: 180px;
            height: 180px;
            background-color: rgba(220, 230, 241, 0.95); /* Semi-transparente para ver el fondo */
            border: 12px solid #5b9bd5;
            border-radius: 50%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            padding: 20px;
            font-weight: 800;
            color: #1a252f;
            font-size: 1.15em;
            line-height: 1.25;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            position: absolute;
            right: 15%; /* Posición desde la derecha */
            bottom: -60px; /* Superposición sutil con la sección de abajo */
        }

        /* Ajustes para dispositivos móviles en la cabecera */
        @media (max-width: 768px) {
            .hero-section {
                height: 250px;
            }
            .circle-badge {
                width: 150px;
                height: 150px;
                font-size: 1.05em;
                right: 10%;
                bottom: -40px;
            }
        }

        /* Título Principal */
        h1 { 
            font-family: 'Playfair Display', serif; /* Una fuente más profesional y elegante */
            color: #1a252f; 
            text-align: center; 
            border-bottom: 2px solid #ecf0f1; 
            padding-bottom: 15px; 
            font-size: 2em; 
            margin-top: 60px; /* Espacio para el badge superpuesto */
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Contenedor del contenido principal */
        .main-content {
            padding: 30px 40px;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
            }
        }

        /* Estilos del recuadro de materias (Fieldset) */
        .subjects-fieldset {
            border: 1px solid #dce6f1;
            border-radius: 14px;
            padding: 20px;
            margin: 0 0 30px 0;
            background-color: transparent;
        }

        .subjects-legend {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.2em;
            padding: 0 15px;
            margin-left: 10px;
            background-color: #fff; /* Asegura que el texto se lea bien */
            border-radius: 8px;
        }

        /* Contenedor de las materias - Grid professional */
        .subjects-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 768px) {
            .subjects-container {
                grid-template-columns: 1fr;
            }
        }

        /* Botones de materias refinados */
        .subject-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px; 
            border-radius: 10px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #4b6584, #2c3e50); 
            font-weight: 600;
            font-size: 1.05em;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }

        .subject-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #34495e, #1a252f);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-icon {
            font-size: 1.2em;
        }

        /* Línea separadora */
        .divider {
            height: 3px;
            background-color: #ecf0f1;
            margin: 30px 0;
            border-radius: 3px;
        }

        /* Botón de Signatura Destacado - Ajuste de contraste */
        .signature-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 25px; 
            background: linear-gradient(135deg, #b3e5fc, #81d4fa); 
            border: 2px solid #4fc3f7; 
            border-radius: 12px;
            text-decoration: none;
            color: #1c3d5e; /* Texto más oscuro para mejor contraste */
            font-weight: 800;
            font-size: 1.25em;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(129, 212, 250, 0.4);
            animation: pulse-glow-soft 1.8s infinite;
        }

        .signature-btn:hover {
            background: #ffffff;
            color: #2c3e50; 
            transform: scale(1.01) translateY(-2px);
            box-shadow: 0 10px 25px rgba(129, 212, 250, 0.3);
            animation: none;
        }

        /* Animación de pulso más sutil */
        @keyframes pulse-glow-soft {
            0% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(79, 195, 247, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0); }
        }

        /* Servicios Adicionales */
        h2.section-title { 
            color: #2c3e50; 
            font-size: 1.25em; 
            margin-top: 45px; 
            border-left: 5px solid #34495e; 
            padding-left: 15px;
        }

        .links-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 768px) {
            .links-container {
                grid-template-columns: 1fr;
            }
        }

        .links-container a { 
            display: block; 
            padding: 16px; 
            background: #fdfefe; 
            text-decoration: none; 
            color: #2c3e50; 
            border-radius: 10px; 
            text-align: center; 
            font-weight: 600; 
            border: 1px solid #eaeef2;
            transition: background 0.3s, box-shadow 0.3s;
        }
        
        .links-container a:hover { 
            background: #f1f3f5; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        /* Fuentes personalizadas */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');
    </style>
</head>
<body>
    <div class="container">
        <!-- Sección Hero con la nueva imagen panorámica -->
        <div class="hero-section">
            <img src="biblioteca_completa.jpg" alt="Interior detallado de biblioteca moderna" class="shelf-photo-panoramic" onerror="this.src='https://via.placeholder.com/900x350?text=Biblioteca+Panorámica+Professional'">
            <!-- El círculo de texto superpuesto -->
            <div class="circle-badge">
                Necesito<br>encontrar<br>un libro
            </div>
        </div>

        <div class="main-content">
            <!-- Título Principal -->
            <h1>Biblioteca de Humanidades</h1>

            <!-- Recuadro con título integrado -->
            <fieldset class="subjects-fieldset">
                <legend class="subjects-legend">Por materia</legend>
                
                <!-- Botones en grid professional -->
                <div class="subjects-container">
                    <a href="8.html" class="subject-btn">
                        <div class="btn-content">
                            <span class="btn-icon">📖</span>
                            <span>Lenguaje, Lingüística, Literatura</span>
                        </div>
                        <span>➔</span>
                    </a>

                    <a href="9.html" class="subject-btn">
                        <div class="btn-content">
                            <span class="btn-icon">🌍</span>
                            <span>Geografía e Historia</span>
                        </div>
                        <span>➔</span>
                    </a>

                    <a href="7.html" class="subject-btn">
                        <div class="btn-content">
                            <span class="btn-icon">🎨</span>
                            <span>Arte y Arquitectura</span>
                        </div>
                        <span>➔</span>
                    </a>

                    <a href="1.html" class="subject-btn">
                        <div class="btn-content">
                            <span class="btn-icon">🧠</span>
                            <span>Filosofía y Ciencias Sociales</span>
                        </div>
                        <span>➔</span>
                    </a>
                </div>
            </fieldset>

            <!-- Separador visual -->
            <div class="divider"></div>

            <!-- Acceso por signatura separado -->
            <a href="Signatura.html" class="signature-btn">
                <div class="btn-content">
                    <span class="btn-icon">📌</span>
                    <span>Sé la signatura</span>
                </div>
                <span>➔</span>
            </a>

            <!-- Servicios Adicionales -->
            <h2 class="section-title">💻 Servicios Adicionales</h2>
            <div class="links-container">
                <a href="https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=101" target="_blank">Búsqueda general en el catálogo</a>
                <a href="https://buo.uniovi.es/" target="_blank">Portal de la Biblioteca (BUO)</a>
            </div>
        </div>
    </div>

    <!-- Script para lógica JS específica de detección -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const body = document.body;

            // Detección de Windows
            if (/windows/i.test(userAgent)) {
                body.classList.add('os-windows');
                console.log("Acceso desde un dispositivo con Windows.");
            }

            // Detección de Móviles (Android, iOS)
            if (/android|iphone|ipad|ipod/i.test(userAgent)) {
                body.classList.add('is-mobile-device');
                console.log("Acceso desde un dispositivo móvil.");
            }
        });
    </script>
</body>
</html>
