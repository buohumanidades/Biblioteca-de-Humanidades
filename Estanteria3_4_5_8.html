<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación del Libro | Biblioteca</title>
    <style>
        /* Ajuste estricto a la pantalla del móvil sin scroll */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: #f4f6f7;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px; 
            box-sizing: border-box;
        }

        .container { 
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: 100%; 
            background: #fff; 
            padding: 15px; 
            border-radius: 12px; 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        
        /* Cabecera compacta */
        h1 { 
            font-family: 'Romana Moderna', Georgia, serif; 
            color: #1a252f; 
            text-align: center; 
            border-bottom: 2px solid #ecf0f1; 
            padding-bottom: 8px; 
            font-size: 1.4em; 
            margin: 0 0 12px 0;
            flex-shrink: 0; 
        }

        /* Diseño de la ruta */
        .location-route {
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 10px 10px 10px 15px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px; 
            flex-shrink: 0;
        }

        .route-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em; 
            color: #34495e;
            font-weight: 600;
        }

        /* Ajustes específicos para el paso de la PLANTA 2 */
        .step-planta {
            justify-content: space-between;
            width: 100%;
            padding-right: 5px; 
            box-sizing: border-box;
        }

        .planta-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Etiqueta de la signatura a la derecha */
        .signatura-badge {
            font-size: 0.85em;
            color: #d35400; 
            background-color: #fdf2e9;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #e67e22;
            font-weight: bold;
            box-shadow: 0 2px 4px rgba(230, 126, 34, 0.1);
        }

        .route-step.final-step {
            color: #2980b9;
            font-size: 1.1em;
            font-weight: 800;
            background: #ebf5fb;
            padding: 6px 12px;
            border-radius: 6px;
            margin-left: -10px; 
            box-shadow: 0 2px 4px rgba(41, 128, 185, 0.15);
            border: 1px solid #d6eaf8;
        }

        .icon {
            font-size: 1.1em;
        }

        /* Contenedor de las imágenes alineadas horizontalmente */
        .image-container {
            flex-grow: 1; 
            min-height: 0; 
            display: flex;
            justify-content: center; /* Centra el grupo de imágenes */
            align-items: center;
            gap: 10px; /* Separación entre las imágenes */
            margin-bottom: 12px;
            overflow: hidden;
        }

        .shelf-image {
            flex: 1; /* Permite que las imágenes compartan el espacio equitativamente */
            max-width: 31%; /* Limita el ancho para que quepan 3 imágenes con el gap */
            max-height: 100%; 
            width: 100%;
            height: auto;
            object-fit: contain; 
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            border: 1px solid #ecf0f1;
        }

        /* Botón de Nueva Búsqueda */
        .btn-new-search {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            font-size: 1.05em;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.3);
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .btn-new-search:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(44, 62, 80, 0.3);
            background: #1a252f;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cabecera -->
        <h1>Biblioteca de Humanidades</h1>

        <!-- Ruta de localización -->
        <div class="location-route">
            <!-- Paso Planta 2 adaptado -->
            <div class="route-step step-planta">
                <div class="planta-left">
                    <span class="icon">📍</span> PLANTA 2
                </div>
                <!-- Aquí se inyectará la signatura -->
                <div id="display-signatura" class="signatura-badge" style="display: none;"></div>
            </div>
            
            <div class="route-step">
                <span class="icon">➡️</span> Sala de la derecha
            </div>
            <div class="route-step">
                <span class="icon">➡️</span> En las estanterías de la derecha
            </div>
            <div class="route-step final-step">
                <span class="icon">📚</span> Estanterías nº 3, 4 y 5
            </div>
        </div>

        <!-- Imágenes de las estanterías -->
        <div class="image-container">
            <img src="Estanteria5_8.jpg" alt="Vista del Estante nº 5" class="shelf-image">
            <img src="Estanteria4_8.jpg" alt="Vista del Estante nº 4" class="shelf-image">
            <img src="Estanteria3_8.jpg" alt="Vista del Estante nº 3" class="shelf-image">
        </div>

        <!-- Botón para nueva búsqueda -->
        <a href="Signatura.html" class="btn-new-search">
            <span class="icon">🔄</span> Nueva búsqueda
        </a>
    </div>

   <!-- Script para recuperar la signatura -->
    <script>
    function cargarSignatura() {
        const params = new URLSearchParams(window.location.search);
        
        // Primero buscamos el texto completo en la memoria del navegador.
        // Solo si no existe (como respaldo), usamos la signatura recortada de la URL.
        let sigBuscada = sessionStorage.getItem('signaturaActual') || params.get('sig');

        if (sigBuscada) {
            const badge = document.getElementById('display-signatura');
            if (badge) {
                badge.textContent = sigBuscada;
                badge.style.display = 'inline-block';
            }
        }
    }

    // Se ejecuta al cargar la página en cualquier navegador móvil
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', cargarSignatura);
    } else {
        cargarSignatura();
    }
    </script>
</body>
</html>
