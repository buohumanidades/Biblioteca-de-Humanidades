<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación del Libro | Biblioteca</title>
    <!-- Enlace a FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Enlace a Google icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <style>
        html, body {
            height: 100%;
            height: 100dvh; 
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; 
            box-sizing: border-box;
            
            /* Animación de fondo de colores */
            background: linear-gradient(45deg, #a8edea, #fed6e3, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        /* Keyframes para el fondo animado */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { 
            display: flex;
            flex-direction: column;
            width: 95vw;
            max-width: 1300px;
            height: 94dvh; 
            background: #fff; 
            padding: 15px; 
            border-radius: 12px; 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            transition: all 0.3s ease;
        }
        h1 { 
            font-family: 'Romana Moderna', Georgia, serif; 
            color: #1a252f; 
            text-align: center; 
            border-bottom: 2px solid #ecf0f1; 
            padding-bottom: 8px; 
            font-size: 1.4em; 
            margin: 0 0 12px 0;
            flex-shrink: 0; 
        }
        .location-route {
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 10px 10px 10px 15px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px; 
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .route-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em; 
            color: #34495e;
            font-weight: 600;
        }
        .step-planta {
            justify-content: space-between;
            width: 100%;
            padding-right: 5px; 
            box-sizing: border-box;
        }
        .planta-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .signatura-badge {
            font-size: 0.85em;
            color: #d35400; 
            background-color: #fdf2e9;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #e67e22;
            font-weight: bold;
            box-shadow: 0 2px 4px rgba(230, 126, 34, 0.1);
        }
        .route-step.final-step {
            color: #2980b9;
            font-size: 1.1em;
            font-weight: 800;
            background: #ebf5fb;
            padding: 6px 12px;
            border-radius: 6px;
            margin-left: -10px; 
            box-shadow: 0 2px 4px rgba(41, 128, 185, 0.15);
            border: 1px solid #d6eaf8;
            transition: all 0.3s ease;
        }
        .icon {
            font-size: 1.1em;
        }
        .iframe-container {
            flex-grow: 1; 
            min-height: 0; 
            width: 100%;
            margin-bottom: 12px;
            border-radius: 8px;
            overflow: hidden; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            border: 1px solid #ecf0f1;
            background-color: #ffffff;
            display: flex; 
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .btn-new-search {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            font-size: 1.05em;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.3);
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn-new-search:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(44, 62, 80, 0.3);
            background: #1a252f;
        }

        /* =========================================================
           ADAPTACIÓN PARA PANTALLAS GRANDES Y MÓVILES
           ========================================================= */

        /* 💻 PANTALLAS GRANDES / ORDENADORES */
        @media (min-width: 901px) {
            body {
                padding: 0; 
            }
            .container { 
                padding: 25px 35px; 
            }
            h1 {
                font-size: 2em;
                margin-bottom: 20px;
                padding-bottom: 12px;
            }
            
            /* Hacemos que la ruta sea horizontal en lugar de vertical */
            .location-route {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 15px;
                padding: 15px;
                border-left: none; /* Cambiamos la barra lateral por una superior */
                border-top: 4px solid #3498db;
                border-radius: 10px;
            }
            
            .step-planta {
                width: auto;
                padding-right: 0;
                gap: 15px;
            }
            
            .route-step.final-step {
                margin-left: 0;
                padding: 8px 16px;
            }
            
            .iframe-container {
                margin-bottom: 20px;
            }

            .btn-new-search {
                width: 30%; /* Botón proporcionado al tamaño del PC */
                margin: 0 auto; 
                padding: 14px;
                font-size: 1.1em;
            }
            .btn-new-search:hover {
                background: #1a252f;
            }
        }

        /* 📱 PANTALLAS PEQUEÑAS / MÓVILES */
        @media (max-width: 900px) {
            body {
                align-items: flex-start;
                padding: 0;
            }
            .container { 
                height: 100dvh;
                width: 100vw; 
                border-radius: 0;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Biblioteca de Humanidades</h1>

        <!-- Ruta de localización con IDs -->
        <div class="location-route">
            <div class="route-step step-planta">
                <div class="planta-left">
                   <i class="fa-solid fa-school" style="color: #3498db; font-size: 24px;"></i>
  <span id="txt-planta">PLANTA 2</span>
                </div>
                <div id="display-signatura" class="signatura-badge" style="display: none;"></div>
            </div>
            <div class="route-step">
                <span class="icon">➡️</span> <span id="txt-sala">Sala de la derecha</span>
            </div>
            <div class="route-step">
                <span class="icon">➡️</span> <span id="txt-ubicacion">Estanterías de la derecha</span>
            </div>
            <div class="route-step final-step">
                <span class="icon">📚</span> <span id="txt-estanteria">Estantería 3</span>
            </div>
        </div>

        <!-- Iframe con los resultados del catálogo -->
        <div class="iframe-container">
            <iframe id="iframeCatalogo" title="Resultados en el catálogo de la biblioteca"></iframe>
        </div>

        <a href="Signatura.html" class="btn-new-search">
            <span class="icon">🔄</span> Nueva búsqueda
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Obtenemos las dos versiones de la signatura y los textos
        const sigBuscada = params.get('sig'); // La recortada
        const sigOriginal = params.get('orig') || sigBuscada; // La completa
        const valPlanta = params.get('planta');
        const valSala = params.get('sala');
        const valUbicacion = params.get('ubicacion');
        const valEstanteria = params.get('estanteria');

        // Textos dinámicos
        if (valPlanta) document.getElementById('txt-planta').textContent = valPlanta;
        if (valSala) document.getElementById('txt-sala').textContent = valSala;
        if (valUbicacion) document.getElementById('txt-ubicacion').textContent = valUbicacion;
        if (valEstanteria) document.getElementById('txt-estanteria').textContent = valEstanteria;

        // Mostrar la etiqueta de la signatura RECORTADA a la derecha
        if (sigBuscada) {
            const badge = document.getElementById('display-signatura');
            badge.textContent = sigBuscada;
            badge.style.display = 'inline-block';
        }

        const iframe = document.getElementById('iframeCatalogo');

        // Buscar en el catálogo usando la signatura COMPLETA original
        if (sigOriginal) {
            const urlBase = "https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=131&xsqf01=";
            const urlFinal = urlBase + encodeURIComponent('"'+ sigOriginal+ '"') + "&START=1&FORM=1";
            iframe.src = urlFinal;
        } else {
            iframe.srcdoc = `
                <div style="font-family: Arial, sans-serif; height: 100%; display: flex; 
                            align-items: center; justify-content: center; color: #7f8c8d; text-align: center; padding: 20px;">
                    No se ha detectado ninguna signatura en la búsqueda.
                </div>
            `;
        }
    </script>
</body>
</html>
