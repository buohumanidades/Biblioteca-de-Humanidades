<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación del Libro · Biblioteca de Humanidades</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        stone: { 50: '#FAF8F5', 100: '#F4F0E8', 200: '#E6DFC', 300: '#D5CBBF', 800: '#2A2725', 900: '#1A1817' }, 
                        sand: '#C5A059' 
                    }, 
                    fontFamily: { 
                        serif: ['Cormorant Garamond', 'serif'], 
                        sans: ['Plus Jakarta Sans', 'sans-serif'], 
                        mono: ['Space Grotesk', 'monospace'] 
                    } 
                } 
            } 
        }
    </script>
    <style>
        body { 
            background-color: transparent; 
            color: #1A1817; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            margin: 0; 
            padding: 0; 
        }
        .editorial-title { font-family: 'Cormorant Garamond', serif; letter-spacing: -0.02em; line-height: 0.95; }
        .grid-line-b { border-bottom: 1px solid rgba(26, 24, 23, 0.12); }

        /* Estilo y animación para el punto rojo parpadeante */
        @keyframes parpadeo {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.3); }
        }
        .punto-rojo {
            position: absolute;
            background-color: #ef4444;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.85);
            animation: parpadeo 1.5s ease-in-out infinite;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="antialiased selection:bg-stone-800 selection:text-stone-50 bg-[#FAF8F5]">

    <!-- CABECERA: SIGNATURA Y TÍTULO -->
    <header class="bg-stone-100/90 backdrop-blur-md grid-line-b shrink-0 z-10 bg-white">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex flex-col md:flex-row justify-between md:items-center w-full gap-2">
            <div class="overflow-hidden flex-1 pr-4">
                <span id="header-signatura" class="block text-base md:text-lg font-mono font-bold tracking-widest text-stone-900 uppercase truncate" title="Signatura">
                    CARGANDO...
                </span>
                <span id="header-titulo" class="text-sm md:text-base text-stone-700 font-sans font-semibold block mt-1 truncate" title="Título del Libro">
                    Cargando título...
                </span>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL: UBICACIÓN Y PLANO -->
    <main class="flex-1 flex flex-col items-center max-w-5xl mx-auto w-full px-4 md:px-8 py-6 overflow-y-auto">
        
        <!-- TARJETA PRINCIPAL -->
        <div class="shadow-2xl shrink-0 rounded-sm w-full flex flex-col border-l-4 border-sand overflow-hidden">
            
            <!-- ZONA SUPERIOR OSCURA (Piso, Zona, Sector) -->
            <div class="bg-stone-900 text-stone-100 p-6 md:p-8 lg:p-10 flex flex-col md:flex-row gap-6 md:gap-8 items-start md:items-center w-full">
                
                <!-- PLANTA -->
                <div class="flex items-center gap-4 shrink-0">
                    <i class="fa-solid fa-map-location-dot text-2xl md:text-3xl text-stone-500 hidden md:block"></i>
                    <div class="flex flex-col">
                        <span class="text-[11px] font-mono text-stone-500 uppercase tracking-widest mb-1">Piso</span>
                        <span id="txt-planta" class="font-serif text-2xl md:text-3xl lg:text-4xl">--</span>
                    </div>
                </div>

                <i class="fa-solid fa-chevron-right text-stone-700 text-xl hidden md:block shrink-0"></i>
                <i class="fa-solid fa-chevron-down text-stone-700 text-xl md:hidden shrink-0 -my-2 ml-4"></i>

                <!-- SALA -->
                <div class="flex flex-col shrink-0">
                    <span class="text-[11px] font-mono text-stone-500 uppercase tracking-widest mb-1">Zona</span>
                    <span id="txt-sala" class="font-serif text-2xl md:text-3xl lg:text-4xl">--</span>
                </div>

                <i class="fa-solid fa-chevron-right text-stone-700 text-xl hidden md:block shrink-0"></i>
                <i class="fa-solid fa-chevron-down text-stone-700 text-xl md:hidden shrink-0 -my-2 ml-4"></i>

                <!-- UBICACIÓN (Sector) -->
                <div class="flex flex-col flex-1 min-w-0">
                    <span class="text-[11px] font-mono text-stone-500 uppercase tracking-widest mb-1">Sector</span>
                    <span id="txt-ubicacion" class="font-serif text-2xl md:text-3xl lg:text-4xl break-words leading-tight">--</span>
                </div>
            </div>

            <!-- ZONA INFERIOR DORADA (Destino Exacto) -->
            <div class="bg-sand text-stone-900 p-6 md:px-10 md:py-8 flex flex-col md:flex-row md:items-center justify-between w-full gap-4">
                
                <div class="flex flex-col gap-3">
                    <span class="text-xs md:text-sm font-mono uppercase tracking-widest font-bold opacity-80">DESTINO EXACTO</span>
                    <div id="display-signatura" class="bg-stone-900 text-sand text-[11px] md:text-xs font-mono font-bold px-3 py-1.5 w-max hidden rounded-sm shadow-sm"></div>
                </div>
                
                <div class="md:text-right">
                    <span id="txt-estanteria" class="font-serif text-4xl md:text-5xl lg:text-6xl font-bold">--</span>
                </div>

            </div>

        </div>

        <!-- ZONA DEL MAPA DE UBICACIÓN -->
        <div id="contenedor-mapa" class="w-full mt-6 relative rounded-sm shadow-xl overflow-hidden hidden bg-white border border-stone-200 shrink-0">
            <img id="img-mapa" src="" alt="Plano de ubicación de la estantería" class="w-full h-auto block">
            <div id="indicador-posicion" class="punto-rojo hidden"></div>
        </div>

    </main>

    <!-- LÓGICA DE DATOS Y RENDERIZADO DEL PLANO -->
    <script>
        // Extraer los datos de la URL
        const params = new URLSearchParams(window.location.search);
        
        const sigBuscada = params.get('sig'); 
        const sigOriginal = params.get('orig') || sigBuscada; 
        const valPlanta = params.get('planta');
        const valSala = params.get('sala');
        const valUbicacion = params.get('ubicacion');
        const valEstanteria = params.get('estanteria');
        const valTitulo = params.get('titulo') || 'Sin título especificado';

        // Captura de datos del plano
        const valMapa = params.get('mapa');
        const valPosX = params.get('pos_x');
        const valPosY = params.get('pos_y');
        const valTamPunto = params.get('tam_punto');

        // Insertar datos en la cabecera
        document.getElementById('header-signatura').textContent = sigOriginal || 'S/S';
        document.getElementById('header-titulo').textContent = valTitulo;

        // Insertar datos en la tarjeta de ubicación
        if (valPlanta) document.getElementById('txt-planta').textContent = valPlanta;
        if (valSala) document.getElementById('txt-sala').textContent = valSala;
        if (valUbicacion) document.getElementById('txt-ubicacion').textContent = valUbicacion;
        if (valEstanteria) document.getElementById('txt-estanteria').textContent = valEstanteria;

        if (sigBuscada) {
            const badge = document.getElementById('display-signatura');
            badge.textContent = sigBuscada;
            badge.style.display = 'inline-block';
        }

        // Cargar plano e indicador si existen en los parámetros
        if (valMapa) {
            const contenedorMapa = document.getElementById('contenedor-mapa');
            const imgMapa = document.getElementById('img-mapa');
            const indicador = document.getElementById('indicador-posicion');

            contenedorMapa.classList.remove('hidden');
            imgMapa.src = valMapa;

            if (valPosX !== null && valPosY !== null && valPosX !== '' && valPosY !== '') {
                indicador.classList.remove('hidden');
                indicador.style.left = valPosX + '%';
                indicador.style.top = valPosY + '%';
                
                const tamano = valTamPunto ? valTamPunto + 'px' : '20px';
                indicador.style.width = tamano;
                indicador.style.height = tamano;
            }
        }
    </script>

    <!-- CONTROL DE VISITAS Y CAMBIO DE DÍA -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxL7egiu3-kyNvDc9KS6AWHcn1iEs3DD8_ty6DkeCHHeUdMghmnjyFSBMFqfwUWi9FN/exec";
            const hoy = new Date();
            const fechaString = hoy.getFullYear() + "-" + String(hoy.getMonth() + 1).padStart(2, '0') + "-" + String(hoy.getDate()).padStart(2, '0');
            const fechaTexto = "TEXTO_" + fechaString; 
            const timestamp = hoy.getTime(); 

            fetch(`${GOOGLE_SCRIPT_URL}?tipo=encontrados&accion=sumar_con_fecha&fecha=${fechaTexto}&t=${timestamp}`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(respuesta => respuesta.json())
            .then(datos => {
                if (datos && datos.visitas !== undefined) {
                    const nuevoTotal = datos.visitas;
                    localStorage.setItem('ultimo_encontrados_global', nuevoTotal);
                    try {
                        const canal = new BroadcastChannel('canal_contador_encontrados');
                        canal.postMessage({ nuevoConteo: nuevoTotal });
                        canal.close();
                    } catch (e) { }
                }
            }).catch(error => console.error(error));
        });
    </script>
</body>
</html>
