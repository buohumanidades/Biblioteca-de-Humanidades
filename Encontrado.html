<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro Localizado | Biblioteca</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f2f2f7; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            color: #1c1c1e;
        }
        
        .container {
            background: white;
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 { color: #34C759; margin-top: 0; font-size: 1.8em; }
        
        .signatura-display {
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
            color: #007AFF;
            padding: 15px;
            background: #e5e5ea;
            border-radius: 12px;
            letter-spacing: 1px;
        }
        
        .info-text {
            color: #8e8e93;
            font-size: 0.95em;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .action-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            width: 100%; 
            padding: 16px; 
            font-size: 1.1em; 
            font-weight: 600; 
            border-radius: 14px; 
            cursor: pointer; 
            border: none; 
            text-decoration: none;
            transition: transform 0.15s ease, background-color 0.2s ease; 
        }

        .btn-camera { 
            background: linear-gradient(135deg, #FF9500, #FF5E3A); 
            color: #ffffff; 
            box-shadow: 0 8px 20px rgba(255, 149, 0, 0.4); 
            margin-bottom: 15px;
        }
        .btn-camera:active { 
            transform: scale(0.95); 
            background: #cc7700; 
        }

        .btn-back { 
            background: #e5e5ea; 
            color: #007AFF; 
        }
        .btn-back:active {
            background: #d1d1d6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 ¡Estantería Localizada!</h1>
        <p class="info-text">El libro que buscas se encuentra en esta sección. Signatura:</p>
        
        <div id="sig-display" class="signatura-display">Cargando...</div>
        
        <p class="info-text" style="color: #1c1c1e; font-weight: 500;">¿No lo ves a simple vista? Usa la cámara para guiarte libro por libro hacia la izquierda o la derecha.</p>

        <button class="action-btn btn-camera" onclick="abrirEscaner()">
            <span>📷</span> Búsqueda precisa en estantería
        </button>

        <a href="signatura.html" class="action-btn btn-back">⬅ Buscar otro libro</a>
    </div>

    <script>
        const signaturaObjetivo = localStorage.getItem('signaturaObjetivo');
        
        if (signaturaObjetivo) {
            document.getElementById('sig-display').innerText = signaturaObjetivo;
        } else {
            document.getElementById('sig-display').innerText = "Signatura desconocida";
        }

        function abrirEscaner() {
            if (signaturaObjetivo) {
                window.location.href = "escaner.html";
            } else {
                alert("No se ha podido recuperar la signatura. Vuelve a realizar la búsqueda inicial.");
            }
        }
    </script>
</body>
</html>
