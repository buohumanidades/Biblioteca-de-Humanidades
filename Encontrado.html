<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación del Libro · Biblioteca de Humanidades</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        stone: { 50: '#FAF8F5', 100: '#F4F0E8', 200: '#E6DFC', 300: '#D5CBBF', 800: '#2A2725', 900: '#1A1817' }, 
                        sand: '#C5A059' 
                    }, 
                    fontFamily: { 
                        serif: ['Cormorant Garamond', 'serif'], 
                        sans: ['Plus Jakarta Sans', 'sans-serif'], 
                        mono: ['Space Grotesk', 'monospace'] 
                    } 
                } 
            } 
        }
    </script>
    <style>
        body { 
            background-color: #FAF8F5; 
            color: #1A1817; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Evita el scroll principal */
            margin: 0; 
            padding: 0; 
        }
        .editorial-title { font-family: 'Cormorant Garamond', serif; letter-spacing: -0.02em; line-height: 0.95; }
        .grid-line-b { border-bottom: 1px solid rgba(26, 24, 23, 0.12); }

        /* Animación punto rojo */
        @keyframes parpadeo {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.3); }
        }
        .punto-rojo {
            position: absolute;
            background-color: #ef4444;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.85);
            animation: parpadeo 1.5s ease-in-out infinite;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="antialiased selection:bg-stone-800 selection:text-stone-50">

    <!-- CABECERA: SIGNATURA Y TÍTULO -->
    <header class="bg-white/90 backdrop-blur-md grid-line-b shrink-0 z-10 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-col w-full">
            <span id="header-signatura" class="text-base font-mono font-bold tracking-widest text-stone-900 uppercase truncate" title="Signatura">
                CARGANDO...
            </span>
            <span id="header-titulo" class="text-sm text-stone-600 font-sans font-medium truncate" title="Título del Libro">
                Cargando título...
            </span>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL (Flex Layout Horizontal en MD+) -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center max-w-[1600px] mx-auto w-full px-4 py-4 gap-4 overflow-hidden">
        
        <!-- COLUMNA IZQ: TARJETA DE TEXTO (Aproximadamente 25%-33% ancho en PC) -->
        <div class="w-full lg:w-1/3 xl:w-1/4 flex flex-col shadow-xl rounded-sm border-l-4 border-sand bg-stone-900 shrink-0">
            
            <!-- ZONA SUPERIOR OSCURA -->
            <div class="p-4 md:p-5 flex flex-col gap-4 text-stone-100">
                
                <div class="grid grid-cols-2 gap-3">
                    <!-- PLANTA -->
                    <div class="flex flex-col border-b border-stone-700 pb-2">
                        <span class="text-[10px] md:text-xs font-mono text-stone-400 uppercase tracking-widest mb-1">Piso</span>
                        <span id="txt-planta" class="font-serif text-lg md:text-2xl text-white">--</span>
                    </div>

                    <!-- SALA -->
                    <div class="flex flex-col border-b border-stone-700 pb-2">
                        <span class="text-[10px] md:text-xs font-mono text-stone-400 uppercase tracking-widest mb-1">Zona</span>
                        <span id="txt-sala" class="font-serif text-lg md:text-2xl text-white">--</span>
                    </div>
                </div>

                <!-- UBICACIÓN (Sector) -->
                <div class="flex flex-col">
                    <span class="text-[10px] md:text-xs font-mono text-stone-400 uppercase tracking-widest mb-1">Sector</span>
                    <span id="txt-ubicacion" class="font-serif text-xl md:text-3xl text-white break-words leading-tight">--</span>
                </div>
            </div>

            <!-- ZONA INFERIOR DORADA (Destino Exacto) -->
            <div class="bg-sand p-4 md:p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-3 mt-auto">
                <div class="flex flex-col gap-1.5">
                    <span class="text-[10px] md:text-xs font-mono uppercase tracking-widest font-bold opacity-80 text-stone-900">DESTINO EXACTO</span>
                    <div id="display-signatura" class="bg-stone-900 text-sand text-[10px] font-mono font-bold px-2 py-1 rounded-sm w-max hidden"></div>
                </div>
                <div class="text-left md:text-right">
                    <span id="txt-estanteria" class="font-serif text-2xl md:text-4xl font-bold text-stone-900 leading-none">--</span>
                </div>
            </div>
        </div>

        <!-- COLUMNA DER: MAPA (Aproximadamente 66%-75% ancho en PC) -->
        <div id="contenedor-mapa" class="w-full lg:w-2/3 xl:w-3/4 h-full min-h-[350px] lg:min-h-0 relative rounded-sm shadow-xl bg-white border border-stone-200 hidden flex items-center justify-center p-2 overflow-hidden">
            <div class="relative w-full h-full flex justify-center items-center">
                 <!-- max-h-full y object-contain aseguran que la imagen encaje sin requerir scroll -->
                <img id="img-mapa" src="" alt="Plano de ubicación" class="max-w-full max-h-full object-contain block">
                <div id="indicador-posicion" class="punto-rojo hidden"></div>
            </div>
        </div>

    </main>

    <!-- SCRIPTS LÓGICA -->
    <script>
        const params = new URLSearchParams(window.location.search);
        
        const sigBuscada = params.get('sig'); 
        const sigOriginal = params.get('orig') || sigBuscada; 
        const valPlanta = params.get('planta');
        const valSala = params.get('sala');
        const valUbicacion = params.get('ubicacion');
        const valEstanteria = params.get('estanteria');
        const valTitulo = params.get('titulo') || 'Sin título especificado';

        const valMapa = params.get('mapa');
        const valPosX = params.get('pos_x');
        const valPosY = params.get('pos_y');
        const valTamPunto = params.get('tam_punto');

        document.getElementById('header-signatura').textContent = sigOriginal || 'S/S';
        document.getElementById('header-titulo').textContent = valTitulo;

        if (valPlanta) document.getElementById('txt-planta').textContent = valPlanta;
        if (valSala) document.getElementById('txt-sala').textContent = valSala;
        if (valUbicacion) document.getElementById('txt-ubicacion').textContent = valUbicacion;
        if (valEstanteria) document.getElementById('txt-estanteria').textContent = valEstanteria;

        if (sigBuscada) {
            const badge = document.getElementById('display-signatura');
            badge.textContent = sigBuscada;
            badge.style.display = 'inline-block';
        }

        if (valMapa) {
            const contenedorMapa = document.getElementById('contenedor-mapa');
            const imgMapa = document.getElementById('img-mapa');
            const indicador = document.getElementById('indicador-posicion');

            contenedorMapa.classList.remove('hidden');
            imgMapa.src = valMapa;

            if (valPosX !== null && valPosY !== null && valPosX !== '' && valPosY !== '') {
                indicador.classList.remove('hidden');
                indicador.style.left = valPosX + '%';
                indicador.style.top = valPosY + '%';
                
                const tamano = valTamPunto ? valTamPunto + 'px' : '20px';
                indicador.style.width = tamano;
                indicador.style.height = tamano;
            }
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxL7egiu3-kyNvDc9KS6AWHcn1iEs3DD8_ty6DkeCHHeUdMghmnjyFSBMFqfwUWi9FN/exec";
            const hoy = new Date();
            const fechaString = hoy.getFullYear() + "-" + String(hoy.getMonth() + 1).padStart(2, '0') + "-" + String(hoy.getDate()).padStart(2, '0');
            const fechaTexto = "TEXTO_" + fechaString; 
            const timestamp = hoy.getTime(); 

            fetch(`${GOOGLE_SCRIPT_URL}?tipo=encontrados&accion=sumar_con_fecha&fecha=${fechaTexto}&t=${timestamp}`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(respuesta => respuesta.json())
            .then(datos => {
                if (datos && datos.visitas !== undefined) {
                    const nuevoTotal = datos.visitas;
                    localStorage.setItem('ultimo_encontrados_global', nuevoTotal);
                    try {
                        const canal = new BroadcastChannel('canal_contador_encontrados');
                        canal.postMessage({ nuevoConteo: nuevoTotal });
                        canal.close();
                    } catch (e) { }
                }
            }).catch(error => console.error(error));
        });
    </script>
</body>
</html>
