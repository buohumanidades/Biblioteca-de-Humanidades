<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizador de Biblioteca - Biblioteca de Humanidades</title>
    <!-- Tailwind CSS para un diseño limpio y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-start p-6">

    <div class="max-w-3xl w-full bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">Localizador de Bibliografía y Signaturas</h1>
        <p class="text-gray-600 text-center mb-6">Introduce el título, autor o signatura para localizar el ejemplar en la biblioteca.</p>

        <!-- Formulario de Búsqueda -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="inputBusqueda" placeholder="Buscar por título, autor o signatura..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" onkeypress="if(event.key === 'Enter') realizarBusqueda()">
            <button onclick="realizarBusqueda()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Buscar</button>
        </div>

        <!-- Contenedor de Resultados -->
        <div id="resultadosContainer" class="space-y-4">
            <p class="text-gray-500 text-center">Realiza una búsqueda para ver los resultados.</p>
        </div>
    </div>

    <script>
        let mapaDescripciones = {};
        let librosData = [];

        // Cargar los archivos JSON al iniciar la página
        async function inicializarDatos() {
            try {
                // 1. Cargar el mapa de signaturas y descripciones desde todassignaturas.json
                const respuestaAsignaturas = await fetch('todassignaturas.json');
                const todassignaturasData = await respuestaAsignaturas.json();
                
                todassignaturasData.forEach(row => {
                    const sig = row.signaturas || row.signatura;
                    if (sig) {
                        mapaDescripciones[sig.trim()] = row.descripcion;
                    }
                });

                // 2. Cargar los archivos de libros (p. ej., libros1.json, libros2.json)
                const [resp1, resp2] = await Promise.all([
                    fetch('libros1.json').catch(() => ({ json: () => [] })),
                    fetch('libros2.json').catch(() => ({ json: () => [] }))
                ]);
                
                const data1 = await resp1.json();
                const data2 = await resp2.json();
                librosData = [...data1, ...data2];

                console.log("Datos de signaturas y libros cargados correctamente.");
            } catch (error) {
                console.error("Error al cargar los datos JSON:", error);
            }
        }

        // Función de búsqueda y renderizado con la sustitución de estantería por descripción
        function realizarBusqueda() {
            const query = document.getElementById('inputBusqueda').value.toLowerCase().trim();
            const container = document.getElementById('resultadosContainer');
            container.innerHTML = '';

            if (!query) {
                container.innerHTML = '<p class="text-gray-500 text-center">Por favor, introduce un término de búsqueda.</p>';
                return;
            }

            // Filtrar libros que coincidan con título, autor o signatura
            const resultados = librosData.filter(libro => 
                (libro.titulo && libro.titulo.toLowerCase().includes(query)) ||
                (libro.autor && libro.autor.toLowerCase().includes(query)) ||
                (libro.signatura && libro.signatura.toLowerCase().includes(query)) ||
                (libro.sigbuscada && libro.sigbuscada.toLowerCase().includes(query))
            );

            if (resultados.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center">No se han encontrado resultados para tu búsqueda.</p>';
                return;
            }

            resultados.forEach(libro => {
                // Tomar la signatura a buscar (sigbuscada o signatura)
                const sigBusqueda = (libro.sigbuscada || libro.signatura || '').trim();

                // Buscar la descripción correspondiente en todassignaturas.json
                // Si no se encuentra, se utiliza el campo estantería original como respaldo (fallback)
                const descripcionSustituta = mapaDescripciones[sigBusqueda] || libro.estanteria || 'Ubicación general';

                const card = document.createElement('div');
                card.className = 'border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow transition bg-white';
                card.innerHTML = `
                    <h3 class="text-lg font-semibold text-blue-800">${libro.titulo || 'Sin título'}</h3>
                    <p class="text-sm text-gray-700"><strong>Autor:</strong> ${libro.autor || 'Desconocido'}</p>
                    <p class="text-sm text-gray-700"><strong>Signatura:</strong> ${sigBusqueda}</p>
                    <div class="mt-3 p-3 bg-blue-50 border-l-4 border-blue-600 rounded">
                        <p class="text-sm text-blue-900"><strong>Ubicación / Descripción:</strong> <span id="ubicacion-estanteria">${descripcionSustituta}</span></p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Inicializar al cargar la ventana
        window.onload = inicializarDatos;
    </script>
</body>
</html>
