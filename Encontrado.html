<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación del Libro · Biblioteca de Humanidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { stone: { 50: '#FAF8F5', 100: '#F4F0E8', 200: '#E6DFC', 300: '#D5CBBF', 800: '#2A2725', 900: '#1A1817' }, sand: '#C5A059' }, fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['Space Grotesk', 'monospace'] } } } }
    </script>
    <style>
        body { background-color: #F4F0E8; color: #1A1817; font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; margin: 0; padding: 0; }
        .editorial-title { font-family: 'Cormorant Garamond', serif; letter-spacing: -0.02em; line-height: 0.95; }
        .grid-line-b { border-bottom: 1px solid rgba(26, 24, 23, 0.12); }
    </style>
</head>
<body class="antialiased selection:bg-stone-800 selection:text-stone-50">

    <header class="bg-stone-100/90 backdrop-blur-md grid-line-b shrink-0 z-10">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-4 flex justify-between items-center w-full">
            <div>
                <span class="block text-xs font-mono font-medium tracking-[0.3em] text-stone-800 uppercase">B . U . O</span>
                <span class="text-[10px] md:text-[11px] text-stone-500 font-mono tracking-wider block mt-0.5">BIBLIOTECA DE HUMANIDADES</span>
            </div>
            
            <a href="index.html" class="inline-flex items-center space-x-2 text-[10px] md:text-xs font-mono px-3 md:px-4 py-2 border border-stone-800 text-stone-800 hover:bg-stone-900 hover:text-stone-100 transition-all uppercase tracking-wider">
                <i class="fa-solid fa-house"></i>
                <span class="hidden sm:inline">Inicio</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex flex-col max-w-7xl mx-auto w-full px-3 md:px-6 py-4 overflow-hidden gap-4">
        
        <div class="bg-stone-900 text-stone-100 border-l-4 border-sand shadow-lg shrink-0 rounded-r-sm">
            <div class="flex flex-col md:flex-row md:items-stretch justify-between h-full">
                
                <div class="p-5 md:p-8 flex flex-col md:flex-row gap-4 md:gap-8 items-start md:items-center flex-1">
                    
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-map-location-dot text-2xl text-stone-500 hidden md:block"></i>
                        <div class="flex flex-col">
                            <span class="text-[10px] font-mono text-stone-500 uppercase tracking-widest mb-1">Piso</span>
                            <span id="txt-planta" class="font-serif text-xl md:text-2xl whitespace-nowrap">PLANTA 2</span>
                        </div>
                    </div>

                    <i class="fa-solid fa-chevron-right text-stone-700 text-sm hidden md:block"></i>
                    <i class="fa-solid fa-chevron-down text-stone-700 text-sm md:hidden ml-4 -my-1"></i>

                    <div class="flex flex-col">
                        <span class="text-[10px] font-mono text-stone-500 uppercase tracking-widest mb-1">Zona</span>
                        <span id="txt-sala" class="font-serif text-xl md:text-2xl whitespace-nowrap">Sala de la derecha</span>
                    </div>

                    <i class="fa-solid fa-chevron-right text-stone-700 text-sm hidden md:block"></i>
                    <i class="fa-solid fa-chevron-down text-stone-700 text-sm md:hidden ml-4 -my-1"></i>

                    <div class="flex flex-col">
                        <span class="text-[10px] font-mono text-stone-500 uppercase tracking-widest mb-1">Sector</span>
                        <span id="txt-ubicacion" class="font-serif text-xl md:text-2xl">Estanterías de la derecha</span>
                    </div>
                </div>

                <div class="bg-sand text-stone-900 p-5 md:p-8 flex flex-col justify-center min-w-[280px]">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-mono uppercase tracking-widest font-bold">DESTINO EXACTO</span>
                        <div id="display-signatura" class="bg-stone-900 text-sand text-[10px] font-mono font-bold px-2 py-1 hidden rounded-sm shadow-sm"></div>
                    </div>
                    <span id="txt-estanteria" class="font-serif text-3xl font-bold mb-1">Estantería 3</span>
                </div>
            </div>
        </div>

        <div class="flex-1 w-full bg-white border border-stone-200 shadow-sm relative overflow-hidden rounded-sm">
            <iframe id="iframeCatalogo" class="absolute inset-0 w-full h-full border-none bg-stone-50" title="Resultados en el catálogo de la biblioteca"></iframe>
        </div>

        <!-- BOTONERA DE ACCIÓN -->
        <div class="shrink-0 flex flex-col sm:flex-row gap-3 w-full">
            <a id="btnCamera" href="#" class="flex-1 bg-emerald-700 text-stone-50 font-mono text-[11px] md:text-xs uppercase tracking-widest flex items-center justify-center py-4 rounded-sm hover:bg-emerald-800 transition-colors">
                <i class="fa-solid fa-camera mr-2"></i> Buscar con la cámara
            </a>
            <a href="#" onclick="event.preventDefault(); window.close();" class="flex-1 bg-stone-900 text-stone-100 font-mono text-[11px] md:text-xs uppercase tracking-widest flex items-center justify-center py-4 rounded-sm hover:bg-sand hover:text-stone-900 transition-colors border border-transparent">
                <i class="fa-solid fa-xmark mr-2"></i> Cerrar ventana
            </a>
        </div>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const sigBuscada = params.get('sig'); 
        const sigOriginal = params.get('orig') || sigBuscada; 
        const valPlanta = params.get('planta');
        const valSala = params.get('sala');
        const valUbicacion = params.get('ubicacion');
        const valEstanteria = params.get('estanteria');

        if (valPlanta) document.getElementById('txt-planta').textContent = valPlanta;
        if (valSala) document.getElementById('txt-sala').textContent = valSala;
        if (valUbicacion) document.getElementById('txt-ubicacion').textContent = valUbicacion;
        if (valEstanteria) document.getElementById('txt-estanteria').textContent = valEstanteria;

        if (sigBuscada) {
            const badge = document.getElementById('display-signatura');
            badge.textContent = sigBuscada;
            badge.style.display = 'inline-block';
        }

        const btnCamera = document.getElementById('btnCamera');
        if (sigOriginal) {
            btnCamera.href = `escaner.html?buscar=${encodeURIComponent(sigOriginal)}`;
        } else {
            btnCamera.style.display = 'none';
        }

        const iframe = document.getElementById('iframeCatalogo');

        if (sigOriginal) {
            const urlBase = "https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=131&xsqf01=";
            const urlFinal = urlBase + encodeURIComponent('"' + sigOriginal + '"') + "&START=1&FORM=1";
            iframe.src = urlFinal;
        } else {
            iframe.srcdoc = `<div style="font-family: 'Plus Jakarta Sans', sans-serif; height: 100%; display: flex; align-items: center; justify-content: center; color: #7f8c8d; text-align: center; padding: 20px;"><p>No se ha detectado ninguna signatura en la búsqueda.</p></div>`;
        }
    </script>

    <!-- CONTROL DE VISITAS Y CAMBIO DE DÍA -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxL7egiu3-kyNvDc9KS6AWHcn1iEs3DD8_ty6DkeCHHeUdMghmnjyFSBMFqfwUWi9FN/exec";
            const hoy = new Date();
            const fechaString = hoy.getFullYear() + "-" + String(hoy.getMonth() + 1).padStart(2, '0') + "-" + String(hoy.getDate()).padStart(2, '0');
            const fechaTexto = "TEXTO_" + fechaString; 
            const timestamp = hoy.getTime(); 

            fetch(`${GOOGLE_SCRIPT_URL}?tipo=encontrados&accion=sumar_con_fecha&fecha=${fechaTexto}&t=${timestamp}`, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(respuesta => respuesta.json())
            .then(datos => {
                if (datos && datos.visitas !== undefined) {
                    const nuevoTotal = datos.visitas;
                    localStorage.setItem('ultimo_encontrados_global', nuevoTotal);
                    try {
                        const canal = new BroadcastChannel('canal_contador_encontrados');
                        canal.postMessage({ nuevoConteo: nuevoTotal });
                        canal.close();
                    } catch (e) { }
                }
            }).catch(error => console.error(error));
        });
    </script>
</body>
</html>
