<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación del Libro | Biblioteca</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <style>
        html, body {
            height: 100%;
            height: 100dvh; 
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; 
            box-sizing: border-box;
            background: linear-gradient(45deg, #a8edea, #fed6e3, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Estilo del contador diario global optimizado para imagen --- */
        .contador-diario {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .contador-diario img {
            display: block;
            height: 26px;
            pointer-events: none; /* Evita que la imagen intercepte los clics o intente arrastrarse */
        }

        .container { 
            display: flex;
            flex-direction: column;
            width: 95vw;
            max-width: 1300px;
            height: 94dvh; 
            background: #fff; 
            padding: 15px; 
            border-radius: 12px; 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            transition: all 0.3s ease;
        }
        h1 { 
            font-family: 'Romana Moderna', Georgia, serif; 
            color: #1a252f; 
            text-align: center; 
            border-bottom: 2px solid #ecf0f1; 
            padding-bottom: 8px; 
            font-size: 1.4em; 
            margin: 0 0 12px 0;
            flex-shrink: 0; 
        }
        .location-route {
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 10px 10px 10px 15px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px; 
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .route-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em; 
            color: #34495e;
            font-weight: 600;
        }
        .step-planta {
            justify-content: space-between;
            width: 100%;
            padding-right: 5px; 
            box-sizing: border-box;
        }
        .planta-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .signatura-badge {
            font-size: 0.85em;
            color: #d35400; 
            background-color: #fdf2e9;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #e67e22;
            font-weight: bold;
            box-shadow: 0 2px 4px rgba(230, 126, 34, 0.1);
        }
        .route-step.final-step {
            color: #2980b9;
            font-size: 1.1em;
            font-weight: 800;
            background: #ebf5fb;
            padding: 6px 12px;
            border-radius: 6px;
            margin-left: -10px; 
            box-shadow: 0 2px 4px rgba(41, 128, 185, 0.15);
            border: 1px solid #d6eaf8;
            transition: all 0.3s ease;
        }
        .icon {
            font-size: 1.1em;
        }
        .iframe-container {
            flex-grow: 1; 
            min-height: 0; 
            width: 100%;
            margin-bottom: 12px;
            border-radius: 8px;
            overflow: hidden; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            border: 1px solid #ecf0f1;
            background-color: #ffffff;
            display: flex; 
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            width: 100%;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            font-size: 1.05em;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
            box-sizing: border-box;
            cursor: pointer;
        }
        
        .btn-new-search {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.3);
        }
        
        .btn-new-search:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(44, 62, 80, 0.3);
            background: #1a252f;
        }

        .btn-camera {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }

        .btn-camera:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(39, 174, 96, 0.3);
            background: #219a52;
        }

        @media (min-width: 901px) {
            body { padding: 0; }
            .container { padding: 25px 35px; }
            h1 { font-size: 2em; margin-bottom: 20px; padding-bottom: 12px; }
            .location-route {
                flex-direction: row; flex-wrap: wrap; align-items: center;
                justify-content: center; gap: 15px; padding: 15px;
                border-left: none; border-top: 4px solid #3498db; border-radius: 10px;
            }
            .step-planta { width: auto; padding-right: 0; gap: 15px; }
            .route-step.final-step { margin-left: 0; padding: 8px 16px; }
            .iframe-container { margin-bottom: 20px; }
            .action-buttons { flex-direction: row; justify-content: center; }
            .btn-action { width: 30%; padding: 14px; font-size: 1.1em; }
            .btn-new-search:hover { background: #1a252f; }
            .btn-camera { display: none; }
        }

        @media (max-width: 900px) {
            body { align-items: flex-start; padding: 0; }
            .container { height: 100dvh; width: 100vw; border-radius: 0; padding: 15px; }
            .btn-camera { display: flex; }
        }
    </style>
</head>
<body>
    <!-- Contenedor del contador visual (Badge) -->
    <div id="contadorVisitas" class="contador-diario" style="display: none;" title="Haz doble clic o pulsa F2 para resetear las visitas"></div>

    <div class="container">
        <h1>Biblioteca de Humanidades</h1>

        <div class="location-route">
            <div class="route-step step-planta">
                <div class="planta-left">
                   <i class="fa-solid fa-school" style="color: #3498db; font-size: 24px;"></i>
                   <span id="txt-planta">PLANTA 2</span>
                </div>
                <div id="display-signatura" class="signatura-badge" style="display: none;"></div>
            </div>
            <div class="route-step">
                <span class="icon">➡️</span> <span id="txt-sala">Sala de la derecha</span>
            </div>
            <div class="route-step">
                <span class="icon">➡️</span> <span id="txt-ubicacion">Estanterías de la derecha</span>
            </div>
            <div class="route-step final-step">
                <span class="icon">📚</span> <span id="txt-estanteria">Estantería 3</span>
            </div>
        </div>

        <div class="iframe-container">
            <iframe id="iframeCatalogo" title="Resultados en el catálogo de la biblioteca"></iframe>
        </div>

        <div class="action-buttons">
            <a id="btnCamera" href="#" class="btn-action btn-camera">
                <i class="fa-solid fa-camera"></i> Buscar con la cámara
            </a>
            <a href="#" onclick="event.preventDefault(); window.close();" class="btn-action btn-new-search">
                <span class="icon">✖</span> Cerrar ventana
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const sigBuscada = params.get('sig'); 
        const sigOriginal = params.get('orig') || sigBuscada; 
        const valPlanta = params.get('planta');
        const valSala = params.get('sala');
        const valUbicacion = params.get('ubicacion');
        const valEstanteria = params.get('estanteria');

        if (valPlanta) document.getElementById('txt-planta').textContent = valPlanta;
        if (valSala) document.getElementById('txt-sala').textContent = valSala;
        if (valUbicacion) document.getElementById('txt-ubicacion').textContent = valUbicacion;
        if (valEstanteria) document.getElementById('txt-estanteria').textContent = valEstanteria;

        if (sigBuscada) {
            const badge = document.getElementById('display-signatura');
            badge.textContent = sigBuscada;
            badge.style.display = 'inline-block';
        }

        const btnCamera = document.getElementById('btnCamera');
        if (sigOriginal) {
            btnCamera.href = `escaner.html?buscar=${encodeURIComponent(sigOriginal)}`;
        } else {
            btnCamera.style.display = 'none';
        }

        const iframe = document.getElementById('iframeCatalogo');

        if (sigOriginal) {
            const urlBase = "https://absysweb.cpd.uniovi.es/cgi-bin/abnetopac?ACC=131&xsqf01=";
            const urlFinal = urlBase + encodeURIComponent('"'+ sigOriginal+ '"') + "&START=1&FORM=1";
            iframe.src = urlFinal;
        } else {
            iframe.srcdoc = `
                <div style="font-family: Arial, sans-serif; height: 100%; display: flex; 
                            align-items: center; justify-content: center; color: #7f8c8d; text-align: center; padding: 20px;">
                    No se ha detectado ninguna signatura en la búsqueda.
                </div>
            `;
        }

        // --- LÓGICA DEL CONTADOR Y RESETEO MANUAL ---
        function obtenerClaveReset() {
            const fecha = new Date();
            const dia = String(fecha.getDate()).padStart(2, '0');
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const anio = fecha.getFullYear();
            return `reset_${anio}${mes}${dia}`;
        }

        function mostrarContadorVisualDiario() {
            const divContador = document.getElementById('contadorVisitas');
            if (!divContador) return; 

            const fecha = new Date();
            const dia = String(fecha.getDate()).padStart(2, '0');
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const anio = fecha.getFullYear();
            
            const clave = obtenerClaveReset();
            const vReset = localStorage.getItem(clave) || '0';
            
            const rutaUnica = `biblioteca_humanidades/visitas_${anio}${mes}${dia}_v${vReset}`;
            const urlImagenBadge = `https://hits.sh/uniovi.es/${rutaUnica}.svg?label=%20&color=2980b9&labelColor=1a252f&nocache=${Date.now()}`;
            
            divContador.innerHTML = `<img src="${urlImagenBadge}" alt="Contador de visitas de hoy">`;
            divContador.style.display = 'flex';
        }

        function resetearContadorManual() {
            if (confirm("¿Quieres poner a cero el contador de visitas para la sesión actual de hoy?")) {
                const clave = obtenerClaveReset();
                let vReset = parseInt(localStorage.getItem(clave) || '0', 10);
                vReset++;
                localStorage.setItem(clave, vReset);
                mostrarContadorVisualDiario();
            }
        }

        // 1. Escuchar la tecla F2 para resetear
        document.addEventListener('keydown', function(event) {
            if (event.key === 'F2') {
                event.preventDefault();
                resetearContadorManual();
            }
        });

        // 2. Control de doble clic o doble toque universal (PC y móviles)
        let ultimoClic = 0;
        document.getElementById('contadorVisitas').addEventListener('click', function(e) {
            e.preventDefault();
            const tiempoActual = new Date().getTime();
            const diferencia = tiempoActual - ultimoClic;

            if (diferencia < 400 && diferencia > 0) {
                resetearContadorManual();
                ultimoClic = 0;
            } else {
                ultimoClic = tiempoActual;
            }
        });

        // Ejecutar al cargar la página
        mostrarContadorVisualDiario();
    </script>
    <script>
    // Suma +1 al contador global de libros encontrados y notifica instantáneamente a index_2.html
    document.addEventListener("DOMContentLoaded", function() {
        fetch('https://api.counterapi.dev/v1/bib_humanidades/encontrados_global/up')
            .then(respuesta => respuesta.json())
            .then(datos => {
                if (datos && datos.count !== undefined) {
                    // 1. Emisión por BroadcastChannel
                    try {
                        const canal = new BroadcastChannel('canal_contador_encontrados');
                        canal.postMessage({ nuevoConteo: datos.count });
                        canal.close();
                    } catch (e) {
                        console.log("Error al transmitir vía BroadcastChannel", e);
                    }

                    // 2. Emisión de respaldo por localStorage
                    localStorage.setItem('contador_encontrados_val', datos.count);
                }
            })
            .catch(error => console.error("Error de conexión con el contador:", error));
    });
</script>
</body>
</html>
