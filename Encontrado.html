<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación del Libro · Biblioteca de Humanidades</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        stone: { 50: '#FAF8F5', 100: '#F4F0E8', 200: '#E6DFC', 300: '#D5CBBF', 800: '#2A2725', 900: '#1A1817' }, 
                        sand: '#C5A059' 
                    }, 
                    fontFamily: { 
                        serif: ['Cormorant Garamond', 'serif'], 
                        sans: ['Plus Jakarta Sans', 'sans-serif'], 
                        mono: ['Space Grotesk', 'monospace'] 
                    } 
                } 
            } 
        }
    </script>
    <style>
        body { 
            background-color: #FAF8F5; 
            color: #1A1817; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            margin: 0; 
            padding: 0; 
        }
        .editorial-title { font-family: 'Cormorant Garamond', serif; letter-spacing: -0.02em; line-height: 0.95; }
        .grid-line-b { border-bottom: 1px solid rgba(26, 24, 23, 0.12); }

        /* Animación punto rojo */
        @keyframes parpadeo {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.3); }
        }
        .punto-rojo {
            position: absolute;
            background-color: #ef4444;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.85);
            animation: parpadeo 1.5s ease-in-out infinite;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="antialiased selection:bg-stone-800 selection:text-stone-50">

    <!-- CABECERA PRINCIPAL (Blanca) -->
    <header class="bg-white/90 backdrop-blur-md grid-line-b shrink-0 z-10 shadow-sm">
        <div class="max-w-full mx-auto px-4 py-2 flex flex-col w-full">
            <span id="header-signatura" class="text-base font-mono font-bold tracking-widest text-stone-900 uppercase truncate" title="Signatura">
                CARGANDO...
            </span>
            <span id="header-titulo" class="text-xs md:text-sm text-stone-600 font-sans font-medium truncate" title="Título del Libro">
                Cargando título...
            </span>
        </div>
    </header>

    <!-- CONTENEDOR DE LA APLICACIÓN (Pantalla completa ampliada) -->
    <main class="flex-1 flex flex-col max-w-full mx-auto w-full px-2 md:px-4 py-2 gap-2 overflow-hidden">
        
        <!-- BANDA HORIZONTAL NEGRA DE UBICACIÓN -->
        <div class="w-full flex flex-col md:flex-row justify-between shadow-lg rounded-sm border-l-4 border-sand bg-stone-900 shrink-0 text-stone-100 p-3 md:p-4 gap-3">
            
            <!-- Bloque Izquierdo: Piso, Zona, Sector -->
            <div class="flex-1 flex flex-col md:flex-row gap-3 md:gap-6 border-b md:border-b-0 md:border-r border-stone-700 pb-3 md:pb-0 md:pr-6">
                
                <div class="flex flex-row md:flex-col gap-3 md:gap-1">
                    <!-- PLANTA -->
                    <div class="flex flex-col min-w-[70px]">
                        <span class="text-[9px] md:text-[10px] font-mono text-stone-400 uppercase tracking-widest">Piso</span>
                        <span id="txt-planta" class="font-serif text-base md:text-xl text-white">--</span>
                    </div>

                    <!-- SALA -->
                    <div class="flex flex-col">
                        <span class="text-[9px] md:text-[10px] font-mono text-stone-400 uppercase tracking-widest">Zona</span>
                        <span id="txt-sala" class="font-serif text-base md:text-xl text-white">--</span>
                    </div>
                </div>

                <!-- UBICACIÓN (Sector) -->
                <div class="flex flex-col flex-1">
                    <span class="text-[9px] md:text-[10px] font-mono text-stone-400 uppercase tracking-widest">Sector</span>
                    <span id="txt-ubicacion" class="font-serif text-lg md:text-2xl text-white break-words leading-tight">--</span>
                </div>
            </div>

            <!-- Bloque Derecho: Destino Exacto y Estantería (Descripción de todassignaturas.json) -->
            <div class="md:w-1/3 flex flex-col items-start md:items-end justify-center">
                <div class="flex flex-row md:flex-col items-center md:items-end gap-2 md:gap-1 mb-1 w-full md:w-auto">
                    <span class="text-[9px] md:text-[10px] font-mono uppercase tracking-widest font-bold text-sand opacity-80">DESTINO EXACTO</span>
                    <div id="display-signatura" class="bg-sand text-stone-900 text-[10px] font-mono font-bold px-2 py-0.5 rounded-sm hidden"></div>
                </div>
                <div class="text-left md:text-right">
                    <span id="txt-estanteria" class="font-serif text-lg md:text-2xl font-bold text-sand leading-tight">--</span>
                </div>
            </div>

        </div> <!-- Fin Banda Horizontal -->

        <!-- ZONA DEL MAPA DE UBICACIÓN (Maximizado para ocupar todo el espacio restante) -->
        <div id="contenedor-mapa" class="flex-1 w-full relative rounded-sm shadow-xl bg-white border border-stone-200 hidden flex items-center justify-center p-1 overflow-hidden">
            <div class="relative w-full h-full flex justify-center items-center">
                <img id="img-mapa" src="" alt="Plano de ubicación" class="max-w-full max-h-full object-contain block">
                <div id="indicador-posicion" class="punto-rojo hidden"></div>
            </div>
        </div>

    </main>

    <!-- SCRIPTS LÓGICA -->
    <script>
        const params = new URLSearchParams(window.location.search);
        
        const sigBuscada = params.get('sig'); 
        const sigOriginal = params.get('orig') || sigBuscada; 
        const valPlanta = params.get('planta');
        const valSala = params.get('sala');
        const valUbicacion = params.get('ubicacion');
        const valEstanteria = params.get('estanteria');
        const valTitulo = params.get('titulo') || 'Sin título especificado';

        const valMapa = params.get('mapa');
        const valPosX = params.get('pos_x');
        const valPosY = params.get('pos_y');
        const valTamPunto = params.get('tam_punto');

        document.getElementById('header-signatura').textContent = sigOriginal || 'S/S';
        document.getElementById('header-titulo').textContent = valTitulo;

        if (valPlanta) document.getElementById('txt-planta').textContent = valPlanta;
        if (valSala) document.getElementById('txt-sala').textContent = valSala;
        if (valUbicacion) document.getElementById('txt-ubicacion').textContent = valUbicacion;

        // Cargar todassignaturas.json para buscar la descripción basándonos en display-signatura (sigBuscada)
        if (sigBuscada) {
            const badge = document.getElementById('display-signatura');
            badge.textContent = sigBuscada;
            badge.style.display = 'inline-block';

            fetch('todassignaturas.json')
                .then(res => {
                    if (!res.ok) throw new Error("Error al cargar todassignaturas.json");
                    return res.json();
                })
                .then(data => {
                    let sigUpper = sigBuscada.trim().toUpperCase();
                    let descripcionEncontrada = '';

                    let matchExacto = data.find(item => (item.signaturas || '').trim().toUpperCase() === sigUpper);
                    if (matchExacto) {
                        descripcionEncontrada = matchExacto.descripcion || '';
                    } else {
                        let candidatos = data.filter(item => {
                            let itemSig = (item.signaturas || '').trim().toUpperCase();
                            if (!itemSig) return false;
                            if (sigUpper === itemSig) return true;
                            if (sigUpper.startsWith(itemSig)) {
                                let nextChar = sigUpper.charAt(itemSig.length);
                                if (/[0-9]/.test(nextChar) && /[0-9]/.test(itemSig.slice(-1))) {
                                    return false;
                                }
                                return true;
                            }
                            return false;
                        });

                        candidatos.sort((a, b) => (b.signaturas || '').trim().length - (a.signaturas || '').trim().length);

                        if (candidatos.length > 0) {
                            descripcionEncontrada = candidatos[0].descripcion || '';
                        }
                    }

                    if (descripcionEncontrada) {
                        document.getElementById('txt-estanteria').textContent = descripcionEncontrada;
                    } else if (valEstanteria) {
                        document.getElementById('txt-estanteria').textContent = valEstanteria;
                    } else {
                        document.getElementById('txt-estanteria').textContent = '--';
                    }
                })
                .catch(err => {
                    console.error("Error:", err);
                    if (valEstanteria) document.getElementById('txt-estanteria').textContent = valEstanteria;
                });
        } else if (valEstanteria) {
            document.getElementById('txt-estanteria').textContent = valEstanteria;
        }

        if (valMapa) {
            const contenedorMapa = document.getElementById('contenedor-mapa');
            const imgMapa = document.getElementById('img-mapa');
            const indicador = document.getElementById('indicador-posicion');

            contenedorMapa.classList.remove('hidden');
            imgMapa.src = valMapa;

            if (valPosX !== null && valPosY !== null && valPosX !== '' && valPosY !== '') {
                indicador.classList.remove('hidden');
                indicador.style.left = valPosX + '%';
                indicador.style.top = valPosY + '%';
                
                const tamano = valTamPunto ? valTamPunto + 'px' : '20px';
                indicador.style.width = tamano;
                indicador.style.height = tamano;
            }
        }
    </script>
</body>
</html>
