<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Ultrarrápido HG</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            color: #4da6ff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #aaa;
        }
        
        /* Estilos para el bloque de búsqueda objetivo */
        .target-search-banner {
            display: none; /* Oculto por defecto si no hay búsqueda */
            background-color: rgba(77, 166, 255, 0.15);
            border: 1px solid #4da6ff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 520px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .target-search-banner .target-value {
            color: #4da6ff;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.15rem;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 60vh;
            max-height: 500px;
            background-color: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #ff9800;
        }

        .status-dot.active {
            background-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .status-dot.detected {
            background-color: #00e676;
            box-shadow: 0 0 10px #00e676;
        }

        .scan-region {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            height: 75%;
            border: 2px dashed #ffeb3b;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        }

        /* Indicador de Dirección Llamativo */
        .direction-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffeb3b;
            border-radius: 20px;
            padding: 20px 30px;
            z-index: 20;
            box-shadow: 0 0 25px rgba(255, 235, 59, 0.6);
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .direction-arrow {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        .direction-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 520px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #2196f3;
            color: white;
        }

        .btn-secondary {
            background-color: #333;
            color: white;
        }

        .results-container {
            margin-top: 12px;
            width: 100%;
            max-width: 520px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #333;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .results-title {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            font-weight: bold;
        }

        .match-count {
            font-size: 0.75rem;
            background: #2b384c;
            color: #4da6ff;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-card {
            background-color: #0d0d0d;
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #222;
            border-left: 4px solid #00e676;
        }

        .match-value {
            color: #00e676;
            font-size: 1.35rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .empty-state {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 10px;
            font-style: italic;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Escáner Ultrarrápido HG</h1>
        <p class="subtitle">Optimizado para máxima velocidad y precisión</p>
    </header>

    <!-- Banner que muestra la signatura buscada -->
    <div id="targetSearchBanner" class="target-search-banner">
        <span>Buscando:</span>
        <span id="targetValue" class="target-value"></span>
    </div>

    <div class="camera-container">
        <video id="webcam" playsinline autoplay muted></video>
        <div class="overlay">
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Cargando...</span>
            </div>
            <div class="scan-region"></div>
            
            <!-- Flechas direccionales en pantalla -->
            <div id="directionOverlay" class="direction-overlay">
                <div id="directionArrow" class="direction-arrow">⬅️</div>
                <div id="directionText" class="direction-text">Mover a la izquierda</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-primary">Iniciar Cámara</button>
        <button id="btnStop" class="btn-secondary" disabled>Detener</button>
    </div>

    <div class="results-container">
        <div class="results-header">
            <span class="results-title">Código Capturado</span>
            <span class="match-count" id="matchCount">Esperando...</span>
        </div>
        <div class="matches-list" id="matchesList">
            <div class="empty-state">Inicia la cámara para comenzar el escaneo...</div>
        </div>
    </div>

    <canvas id="captureCanvas"></canvas>
    <canvas id="processingCanvas"></canvas>

    <script>
        // Cargar el parámetro "buscar" de la URL y limpiarlo (sin símbolos)
        const urlParams = new URLSearchParams(window.location.search);
        const signatureToFind = urlParams.get('buscar') || '';
        
        // Variable que guarda la signatura a buscar limpia (solo letras y números)
        const targetSignatureClean = signatureToFind.toUpperCase().replace(/[^A-Z0-9]/g, '');

        if (signatureToFind) {
            const banner = document.getElementById('targetSearchBanner');
            const targetSpan = document.getElementById('targetValue');
            targetSpan.textContent = signatureToFind;
            banner.style.display = 'flex';
        }

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const procCanvas = document.getElementById('processingCanvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const matchesList = document.getElementById('matchesList');
        const matchCount = document.getElementById('matchCount');

        const directionOverlay = document.getElementById('directionOverlay');
        const directionArrow = document.getElementById('directionArrow');
        const directionText = document.getElementById('directionText');

        let stream = null;
        let isProcessing = false;
        let scanInterval = null;
        let worker = null;

        let lastScannedSignature = '';
        let arrowTimeout = null;

        async function initOCR() {
            statusText.textContent = "Iniciando Motor IA...";
            worker = await Tesseract.createWorker('eng');
            
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789/-.,',
                tessedit_pageseg_mode: '11', 
            });
            
            statusText.textContent = "Sistema Listo";
        }
        initOCR();

        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                btnStart.disabled = true;
                btnStop.disabled = false;
                statusDot.className = 'status-dot active';
                statusText.textContent = "Escaneando...";

                scanInterval = setInterval(processFrame, 100);
            } catch (err) {
                console.error(err);
                alert("No se pudo acceder a la cámara.");
            }
        });

        btnStop.addEventListener('click', stopCamera);

        function stopCamera() {
            if (scanInterval) clearInterval(scanInterval);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusDot.className = 'status-dot';
            statusText.textContent = "Cámara apagada";
            hideDirection();
        }

        function showDirection(arrow, text, isMatch = false) {
            directionArrow.textContent = arrow;
            directionText.textContent = text;
            directionOverlay.style.borderColor = isMatch ? '#00e676' : '#ffeb3b';
            directionOverlay.style.boxShadow = isMatch ? '0 0 25px rgba(0, 230, 118, 0.8)' : '0 0 25px rgba(255, 235, 59, 0.6)';
            directionOverlay.style.display = 'flex';

            // Ejecutar vibración si el dispositivo la soporta
            if (navigator.vibrate) {
                if (isMatch) {
                    navigator.vibrate([100, 50, 100, 50, 200]); // Patrón de éxito
                } else {
                    navigator.vibrate(200); // Vibración simple
                }
            }

            // Reiniciar el temporizador de 2 segundos
            if (arrowTimeout) clearTimeout(arrowTimeout);
            arrowTimeout = setTimeout(() => {
                hideDirection();
            }, 2000);
        }

        function hideDirection() {
            directionOverlay.style.display = 'none';
        }

        async function processFrame() {
            if (isProcessing || !worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            const cropWidth = video.videoWidth * 0.92;
            const cropHeight = video.videoHeight * 0.75;
            const startX = (video.videoWidth - cropWidth) / 2;
            const startY = (video.videoHeight - cropHeight) / 2;

            canvas.width = cropWidth;
            canvas.height = cropHeight;
            ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            const targetWidth = Math.min(cropWidth, 800);
            const scaleFactor = targetWidth / cropWidth;
            const targetHeight = cropHeight * scaleFactor;

            procCanvas.width = targetWidth;
            procCanvas.height = targetHeight;
            procCtx.drawImage(canvas, 0, 0, targetWidth, targetHeight);

            try {
                const { data } = await worker.recognize(procCanvas);
                
                let rightmostWord = null;
                let maxX = -1;

                if (data.words) {
                    data.words.forEach(word => {
                        if (word.text.toUpperCase().includes('HG')) {
                            if (word.bbox.x0 > maxX) {
                                maxX = word.bbox.x0;
                                rightmostWord = word;
                            }
                        }
                    });
                }

                if (rightmostWord) {
                    const hgLeft = rightmostWord.bbox.x0;
                    const hgTop = rightmostWord.bbox.y0;
                    const hgBottom = rightmostWord.bbox.y1;

                    let candidateWords = data.words.filter(w => {
                        const isBelowOrSameLine = w.bbox.y0 >= hgTop - 8;
                        const isWithinVerticalRange = w.bbox.y0 <= hgBottom + 120;
                        const matchesLeftColumn = Math.abs(w.bbox.x0 - hgLeft) < 25 || (w.bbox.x0 >= hgLeft - 8 && w.bbox.x0 < hgLeft + 60);

                        return isBelowOrSameLine && isWithinVerticalRange && matchesLeftColumn;
                    });

                    candidateWords.sort((a, b) => {
                        if (Math.abs(a.bbox.y0 - b.bbox.y0) < 14) {
                            return a.bbox.x0 - b.bbox.x0;
                        }
                        return a.bbox.y0 - b.bbox.y0;
                    });

                    let rawExtracted = candidateWords.map(w => w.text).join(' ');
                    let cleanedText = rawExtracted.toUpperCase().replace(/[^A-Z0-9]/g, '');

                    const regex = /HG\d+[A-Z0-9]+/;
                    const match = cleanedText.match(regex);

                    if (match) {
                        const finalSignature = match[0];
                        const scannedClean = finalSignature.toUpperCase().replace(/[^A-Z0-9]/g, '');
                        
                        statusDot.className = 'status-dot detected';
                        statusText.textContent = `¡Capturado!`;
                        matchCount.textContent = `1 Aislado`;

                        matchesList.innerHTML = `
                            <div class="match-card">
                                <span class="match-value">${finalSignature}</span>
                                <span style="font-size:0.75rem; color:#888;">(Rápido)</span>
                            </div>
                        `;

                        // Si la signatura ha cambiado con respecto a la última escaneada
                        if (scannedClean !== lastScannedSignature) {
                            lastScannedSignature = scannedClean;

                            if (targetSignatureClean) {
                                if (targetSignatureClean > scannedClean) {
                                    // La buscada es MAYOR -> Flecha a la izquierda
                                    showDirection('⬅️', 'Ir a la izquierda');
                                } else if (targetSignatureClean < scannedClean) {
                                    // La buscada es MENOR -> Flecha a la derecha
                                    showDirection('➡️', 'Ir a la derecha');
                                } else {
                                    // Coincidencia exacta
                                    showDirection('🎉', '¡Encontrado!', true);
                                }
                            }
                        }

                        setTimeout(() => {
                            if (stream && stream.active) {
                                statusDot.className = 'status-dot active';
                                statusText.textContent = "Escaneando...";
                            }
                        }, 400);
                    }
                }
            } catch (err) {
                console.error("Error en escaneo rápido:", err);
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
