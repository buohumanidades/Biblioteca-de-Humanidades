<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner OCR - Alineación Vertical HG</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            color: #4da6ff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #aaa;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 60vh;
            max-height: 500px;
            background-color: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #ff9800;
        }

        .status-dot.active {
            background-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .status-dot.detected {
            background-color: #00e676;
            box-shadow: 0 0 10px #00e676;
        }

        .scan-region {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            height: 75%;
            border: 2px dashed #ffeb3b;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 520px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #2196f3;
            color: white;
        }

        .btn-secondary {
            background-color: #333;
            color: white;
        }

        .results-container {
            margin-top: 12px;
            width: 100%;
            max-width: 520px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #333;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .results-title {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            font-weight: bold;
        }

        .match-count {
            font-size: 0.75rem;
            background: #2b384c;
            color: #4da6ff;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-card {
            background-color: #0d0d0d;
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #222;
            border-left: 4px solid #00e676;
        }

        .match-value {
            color: #00e676;
            font-size: 1.35rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .empty-state {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 10px;
            font-style: italic;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Escáner Alineación Vertical HG</h1>
        <p class="subtitle">Prioriza derecha y respeta columna izquierda</p>
    </header>

    <div class="camera-container">
        <video id="webcam" playsinline autoplay muted></video>
        <div class="overlay">
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Cargando...</span>
            </div>
            <div class="scan-region"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-primary">Iniciar Cámara</button>
        <button id="btnStop" class="btn-secondary" disabled>Detener</button>
    </div>

    <div class="results-container">
        <div class="results-header">
            <span class="results-title">Código Capturado</span>
            <span class="match-count" id="matchCount">Esperando...</span>
        </div>
        <div class="matches-list" id="matchesList">
            <div class="empty-state">Inicia la cámara para comenzar el escaneo...</div>
        </div>
    </div>

    <canvas id="captureCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const matchesList = document.getElementById('matchesList');
        const matchCount = document.getElementById('matchCount');

        let stream = null;
        let isProcessing = false;
        let scanInterval = null;
        let worker = null;

        async function initOCR() {
            statusText.textContent = "Iniciando Motor IA...";
            worker = await Tesseract.createWorker('eng');
            
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789/-.,',
                tessedit_pageseg_mode: '11', 
            });
            
            statusText.textContent = "Sistema Listo";
        }
        initOCR();

        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                btnStart.disabled = true;
                btnStop.disabled = false;
                statusDot.className = 'status-dot active';
                statusText.textContent = "Escaneando...";

                scanInterval = setInterval(processFrame, 200);
            } catch (err) {
                console.error(err);
                alert("No se pudo acceder a la cámara.");
            }
        });

        btnStop.addEventListener('click', stopCamera);

        function stopCamera() {
            if (scanInterval) clearInterval(scanInterval);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusDot.className = 'status-dot';
            statusText.textContent = "Cámara apagada";
        }

        async function processFrame() {
            if (isProcessing || !worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            const cropWidth = video.videoWidth * 0.92;
            const cropHeight = video.videoHeight * 0.75;
            const startX = (video.videoWidth - cropWidth) / 2;
            const startY = (video.videoHeight - cropHeight) / 2;

            canvas.width = cropWidth;
            canvas.height = cropHeight;

            ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            try {
                const { data } = await worker.recognize(canvas);
                
                let rightmostWord = null;
                let maxX = -1;

                // PASO 1: Encontrar el "HG" más a la derecha en la pantalla
                if (data.words) {
                    data.words.forEach(word => {
                        if (word.text.toUpperCase().includes('HG')) {
                            if (word.bbox.x0 > maxX) {
                                maxX = word.bbox.x0;
                                rightmostWord = word;
                            }
                        }
                    });
                }

                if (rightmostWord) {
                    const hgLeft = rightmostWord.bbox.x0; // Margen izquierdo de la H de HG
                    const hgTop = rightmostWord.bbox.y0;
                    const hgBottom = rightmostWord.bbox.y1;

                    // PASO 2: Filtrar estrictamente por columna vertical izquierda (alineados con la H)
                    // y que estén en la misma línea o debajo (hasta 3 líneas aprox).
                    let candidateWords = data.words.filter(w => {
                        const isBelowOrSameLine = w.bbox.y0 >= hgTop - 10;
                        const isWithinVerticalRange = w.bbox.y0 <= hgBottom + 160; // 2 o 3 líneas abajo
                        
                        // Coincidencia estricta en el Eje X: 
                        // El texto de abajo debe compartir la misma línea vertical izquierda (margen de tolerancia de +-30 píxeles)
                        // O estar extendido hacia la derecha de ese mismo bloque.
                        const matchesLeftColumn = Math.abs(w.bbox.x0 - hgLeft) < 35 || (w.bbox.x0 >= hgLeft - 10 && w.bbox.x0 < hgLeft + 80);

                        return isBelowOrSameLine && isWithinVerticalRange && matchesLeftColumn;
                    });

                    // Ordenar de arriba hacia abajo (respetando las líneas)
                    candidateWords.sort((a, b) => {
                        if (Math.abs(a.bbox.y0 - b.bbox.y0) < 18) {
                            return a.bbox.x0 - b.bbox.x0; // Si están en la misma línea, de izquierda a derecha
                        }
                        return a.bbox.y0 - b.bbox.y0; // Si están en líneas distintas, de arriba a abajo
                    });

                    let rawExtracted = candidateWords.map(w => w.text).join(' ');

                    // PASO 3: RECHAZAR SÍMBOLOS (Solo se permiten letras y números)
                    let cleanedText = rawExtracted.toUpperCase().replace(/[^A-Z0-9]/g, '');

                    // PASO 4: Asegurar que empiece exactamente con HG seguido de números y texto
                    const regex = /HG\d+[A-Z0-9]+/;
                    const match = cleanedText.match(regex);

                    if (match) {
                        const finalSignature = match[0];
                        
                        statusDot.className = 'status-dot detected';
                        statusText.textContent = `¡Alineado correctamente!`;
                        matchCount.textContent = `1 Aislado`;

                        matchesList.innerHTML = `
                            <div class="match-card">
                                <span class="match-value">${finalSignature}</span>
                                <span style="font-size:0.75rem; color:#888;">(Vertical)</span>
                            </div>
                        `;

                        setTimeout(() => {
                            if (stream && stream.active) {
                                statusDot.className = 'status-dot active';
                                statusText.textContent = "Escaneando...";
                            }
                        }, 600);
                    }
                }
            } catch (err) {
                console.error("Error en alineación vertical:", err);
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
