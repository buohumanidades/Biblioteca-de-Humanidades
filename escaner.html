<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner OCR - Captura Ampliada "HG"</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            color: #4da6ff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #aaa;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 60vh;
            max-height: 500px;
            background-color: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #ff9800;
        }

        .status-dot.active {
            background-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .status-dot.detected {
            background-color: #00e676;
            box-shadow: 0 0 10px #00e676;
        }

        /* Área de escaneo amplia (92% de ancho, 75% de alto) */
        .scan-region {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            height: 75%;
            border: 2px dashed #ffeb3b;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        }

        .scan-region::before {
            content: "Área de Escaneo Ampliada (Busca todos los 'HG')";
            position: absolute;
            top: -24px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffeb3b;
            font-size: 0.75rem;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 520px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #2196f3;
            color: white;
        }

        .btn-secondary {
            background-color: #333;
            color: white;
        }

        .results-container {
            margin-top: 12px;
            width: 100%;
            max-width: 520px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #333;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .results-title {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .match-count {
            font-size: 0.75rem;
            background: #2b384c;
            color: #4da6ff;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .match-card {
            background-color: #0d0d0d;
            border-left: 4px solid #00e676;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: monospace;
            border-top: 1px solid #222;
            border-right: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        .match-label {
            color: #ffeb3b;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 6px;
        }

        .match-value {
            color: #00e676;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .empty-state {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 10px;
            font-style: italic;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Escáner Multidetección HG</h1>
        <p class="subtitle">Captura ampliada. Muestra todo lo que encuentra tras "HG"</p>
    </header>

    <div class="camera-container">
        <video id="webcam" playsinline autoplay muted></video>
        <div class="overlay">
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Cargando...</span>
            </div>
            <div class="scan-region"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-primary">Iniciar Cámara</button>
        <button id="btnStop" class="btn-secondary" disabled>Detener</button>
    </div>

    <div class="results-container">
        <div class="results-header">
            <span class="results-title">Coincidencias Encontradas</span>
            <span class="match-count" id="matchCount">0 detectados</span>
        </div>
        <div class="matches-list" id="matchesList">
            <div class="empty-state">Inicia la cámara para comenzar el escaneo amplio...</div>
        </div>
    </div>

    <canvas id="captureCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const matchesList = document.getElementById('matchesList');
        const matchCount = document.getElementById('matchCount');

        let stream = null;
        let isProcessing = false;
        let scanInterval = null;
        let worker = null;

        async function initOCR() {
            statusText.textContent = "Cargando motor OCR...";
            worker = await Tesseract.createWorker('eng');
            
            // Permitir solo letras mayúsculas y números para máxima precisión y velocidad
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                tessedit_pageseg_mode: '6', // Trata la imagen como un bloque continuo de texto
            });
            
            statusText.textContent = "OCR listo";
        }
        initOCR();

        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                btnStart.disabled = true;
                btnStop.disabled = false;
                statusDot.className = 'status-dot active';
                statusText.textContent = "Escaneando pantalla...";

                // Escaneo rápido cada 350ms
                scanInterval = setInterval(processFrame, 350);
            } catch (err) {
                console.error(err);
                alert("No se pudo acceder a la cámara.");
                statusText.textContent = "Error de cámara";
            }
        });

        btnStop.addEventListener('click', stopCamera);

        function stopCamera() {
            if (scanInterval) clearInterval(scanInterval);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusDot.className = 'status-dot';
            statusText.textContent = "Cámara apagada";
        }

        async function processFrame() {
            if (isProcessing || !worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            // Recuadro ampliado: 92% del ancho y 75% del alto del vídeo
            const cropWidth = video.videoWidth * 0.92;
            const cropHeight = video.videoHeight * 0.75;
            const startX = (video.videoWidth - cropWidth) / 2;
            const startY = (video.videoHeight - cropHeight) / 2;

            canvas.width = cropWidth;
            canvas.height = cropHeight;

            // Dibujar recuadro en el canvas
            ctx.drawImage(
                video,
                startX, startY, cropWidth, cropHeight,
                0, 0, cropWidth, cropHeight
            );

            try {
                const { data } = await worker.recognize(canvas);
                
                // 1. Eliminar caracteres especiales (/, -, _, espacios, etc.) conservando solo A-Z y 0-9
                const cleanedText = data.text.replace(/[^A-Z0-9]/g, '');

                // 2. Buscar todas las ocurrencias de "HG" y extraer el texto inmediatamente posterior
                // La Expresión Regular busca "HG" y captura todos los caracteres válidos siguientes hasta el próximo "HG" o final
                const regex = /HG([A-Z0-9]+)/g;
                let match;
                const results = [];

                while ((match = regex.exec(cleanedText)) !== null) {
                    if (match[1] && match[1].length > 0) {
                        results.push(match[1]);
                    }
                }

                // 3. Si se encontraron resultados, actualizar la pantalla
                if (results.length > 0) {
                    statusDot.className = 'status-dot detected';
                    statusText.textContent = `¡${results.length} encontrado(s)!`;
                    matchCount.textContent = `${results.length} detectado(s)`;

                    // Generar lista en pantalla
                    matchesList.innerHTML = results.map((val, idx) => `
                        <div class="match-card">
                            <div>
                                <span class="match-label">HG</span>
                                <span class="match-value">${val}</span>
                            </div>
                            <span style="font-size:0.75rem; color:#888;">#${idx + 1}</span>
                        </div>
                    `).join('');

                    setTimeout(() => {
                        if (stream && stream.active) {
                            statusDot.className = 'status-dot active';
                            statusText.textContent = "Escaneando pantalla...";
                        }
                    }, 600);
                }
            } catch (err) {
                console.error("Error en lectura OCR:", err);
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
