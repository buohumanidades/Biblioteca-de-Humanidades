<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Ultrarrápido HG</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            color: #4da6ff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #aaa;
        }
        
        .target-search-banner {
            display: none; 
            background-color: rgba(77, 166, 255, 0.15);
            border: 1px solid #4da6ff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 520px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .target-search-banner .target-value {
            color: #4da6ff;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.15rem;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 60vh;
            max-height: 500px;
            background-color: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #ff9800;
        }

        .status-dot.active {
            background-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .status-dot.detected {
            background-color: #00e676;
            box-shadow: 0 0 10px #00e676;
        }

        .scan-region {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Área reducida para obligar al usuario a centrar y capturar menos ruido */
            width: 80%;
            height: 40%;
            border: 2px dashed #ffeb3b;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
        }

        .highway-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: none; 
            flex-direction: row;
            align-items: center;
            justify-content: center;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 10px 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .highway-indicator.left {
            left: 10px;
        }

        .highway-indicator.right {
            right: 10px;
        }

        .chevron {
            font-size: 3.5rem;
            color: #ffeb3b;
            font-weight: 900;
            line-height: 1;
            margin: 0 -8px; 
            text-shadow: 0 0 15px #ffeb3b, 0 0 30px #ffeb3b;
        }

        .highway-indicator.right .chevron { animation: slideRight 1s infinite linear; }
        .highway-indicator.right .chevron:nth-child(1) { animation-delay: 0s; }
        .highway-indicator.right .chevron:nth-child(2) { animation-delay: 0.2s; }
        .highway-indicator.right .chevron:nth-child(3) { animation-delay: 0.4s; }

        .highway-indicator.left .chevron { animation: slideLeft 1s infinite linear; }
        .highway-indicator.left .chevron:nth-child(3) { animation-delay: 0s; }
        .highway-indicator.left .chevron:nth-child(2) { animation-delay: 0.2s; }
        .highway-indicator.left .chevron:nth-child(1) { animation-delay: 0.4s; }

        @keyframes slideRight {
            0% { opacity: 0; transform: translateX(-15px); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateX(15px); }
        }

        @keyframes slideLeft {
            0% { opacity: 0; transform: translateX(15px); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-15px); }
        }

        .red-alert-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background-color: #ff0000;
            border-radius: 50%;
            display: none; 
            z-index: 30;
            box-shadow: 0 0 40px #ff0000, inset 0 0 20px rgba(0,0,0,0.5);
            animation: flashRed 0.25s infinite alternate;
        }

        @keyframes flashRed {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.6); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 60px #ff0000, 0 0 100px #ff0000; }
        }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 520px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary { background-color: #2196f3; color: white; }
        .btn-secondary { background-color: #333; color: white; }

        .results-container {
            margin-top: 12px;
            width: 100%;
            max-width: 520px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #333;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .results-title {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            font-weight: bold;
        }

        .match-count {
            font-size: 0.75rem;
            background: #2b384c;
            color: #4da6ff;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-card {
            background-color: #0d0d0d;
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #222;
            border-left: 4px solid #00e676;
        }

        .match-value {
            color: #00e676;
            font-size: 1.35rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .empty-state {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 10px;
            font-style: italic;
        }

        .bottom-action-container {
            width: 100%;
            max-width: 520px;
            margin-top: 15px;
        }
        
        .btn-new-search-bottom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            font-size: 1.05em;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.3);
            transition: all 0.2s ease;
        }

        .btn-new-search-bottom:active {
            transform: translateY(2px);
            background: #1a252f;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Escáner Ultrarrápido HG</h1>
        <p class="subtitle">Apunte el recuadro a las signaturas</p>
    </header>

    <div id="targetSearchBanner" class="target-search-banner">
        <span>Buscando:</span>
        <span id="targetValue" class="target-value"></span>
    </div>

    <div class="camera-container">
        <video id="webcam" playsinline autoplay muted></video>
        <div class="overlay">
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Cargando...</span>
            </div>
            <div class="scan-region"></div>
            
            <!-- Indicador Izquierda -->
            <div id="indicatorLeft" class="highway-indicator left">
                <span class="chevron">❮</span><span class="chevron">❮</span><span class="chevron">❮</span>
            </div>

            <!-- Indicador Derecha -->
            <div id="indicatorRight" class="highway-indicator right">
                <span class="chevron">❯</span><span class="chevron">❯</span><span class="chevron">❯</span>
            </div>

            <!-- Círculo Rojo Parpadeante (Coincidencia) -->
            <div id="indicatorMatch" class="red-alert-circle"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-primary">Iniciar Cámara</button>
        <button id="btnStop" class="btn-secondary" disabled>Detener</button>
    </div>

    <div class="results-container">
        <div class="results-header">
            <span class="results-title">Código Capturado</span>
            <span class="match-count" id="matchCount">Esperando...</span>
        </div>
        <div class="matches-list" id="matchesList">
            <div class="empty-state">Inicia la cámara para comenzar el escaneo...</div>
        </div>
    </div>

    <div class="bottom-action-container">
        <a href="Signatura.html" class="btn-new-search-bottom">
            🔄 Nueva búsqueda
        </a>
    </div>

    <canvas id="captureCanvas"></canvas>
    <canvas id="processingCanvas"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const signatureToFind = urlParams.get('buscar') || '';
        
        const targetSignatureClean = signatureToFind.toUpperCase().replace(/[^A-Z0-9]/g, '');

        if (signatureToFind) {
            const banner = document.getElementById('targetSearchBanner');
            const targetSpan = document.getElementById('targetValue');
            targetSpan.textContent = signatureToFind;
            banner.style.display = 'flex';
        }

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const procCanvas = document.getElementById('processingCanvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const matchesList = document.getElementById('matchesList');
        const matchCount = document.getElementById('matchCount');

        const indicatorLeft = document.getElementById('indicatorLeft');
        const indicatorRight = document.getElementById('indicatorRight');
        const indicatorMatch = document.getElementById('indicatorMatch');

        let stream = null;
        let isProcessing = false;
        let isScanning = false;
        let worker = null;

        let lastScannedSignature = '';
        let indicatorTimeout = null;
        let audioCtx = null;

        async function initOCR() {
            statusText.textContent = "Iniciando Motor IA...";
            worker = await Tesseract.createWorker('eng');
            
            // OPTIMIZACIÓN: Se excluyen minúsculas si no aplican y se utiliza PSM 6 para un bloque uniforme de texto
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/-.,',
                tessedit_pageseg_mode: '6', 
            });
            
            statusText.textContent = "Sistema Listo";
        }
        initOCR();

        function triggerVibration(pattern) {
            try {
                if (navigator.vibrate) {
                    navigator.vibrate(pattern);
                }
            } catch (e) {
                console.warn("La vibración no está soportada.", e);
            }
        }

        function playBeepAlert() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {
                console.warn("No se pudo reproducir el audio.", e);
            }
        }

        function getCharWeight(c) {
            if (!c) return 0;
            if (/[0-9]/.test(c)) {
                return 100 + parseInt(c, 10);
            } else if (/[A-Z]/.test(c)) {
                return c.charCodeAt(0);
            }
            return c.charCodeAt(0);
        }

        function compareCustom(str1, str2) {
            const len = Math.max(str1.length, str2.length);
            for (let i = 0; i < len; i++) {
                const c1 = str1[i] || '';
                const c2 = str2[i] || '';
                if (c1 === c2) continue;
                const w1 = getCharWeight(c1);
                const w2 = getCharWeight(c2);
                if (w1 !== w2) {
                    return w1 < w2 ? -1 : 1;
                }
            }
            return 0;
        }

        function scanLoop() {
            if (!isScanning) return;
            
            if (!isProcessing) {
                processFrame(); 
            }
            
            requestAnimationFrame(scanLoop);
        }

        btnStart.addEventListener('click', async () => {
            triggerVibration(1);
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                btnStart.disabled = true;
                btnStop.disabled = false;
                statusDot.className = 'status-dot active';
                statusText.textContent = "Escaneando...";

                isScanning = true;
                requestAnimationFrame(scanLoop);
            } catch (err) {
                console.error(err);
                alert("No se pudo acceder a la cámara.");
            }
        });

        btnStop.addEventListener('click', stopCamera);

        function stopCamera() {
            isScanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusDot.className = 'status-dot';
            statusText.textContent = "Cámara apagada";
            hideAllIndicators();
        }

        function showIndicator(type) {
            hideAllIndicators();
            
            if (type === 'left') {
                indicatorLeft.style.display = 'flex';
                triggerVibration([200, 100, 200]);
            } else if (type === 'right') {
                indicatorRight.style.display = 'flex';
                triggerVibration([200, 100, 200]);
            } else if (type === 'match') {
                indicatorMatch.style.display = 'block';
                playBeepAlert();
                triggerVibration([100, 50, 100, 50, 300]);
            }

            if (indicatorTimeout) clearTimeout(indicatorTimeout);
            indicatorTimeout = setTimeout(() => {
                hideAllIndicators();
            }, 2000);
        }

        function hideAllIndicators() {
            indicatorLeft.style.display = 'none';
            indicatorRight.style.display = 'none';
            indicatorMatch.style.display = 'none';
        }

        async function processFrame() {
            if (!worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            // OPTIMIZACIÓN: Reducción del área de escaneo (Crop) a un 80% ancho y 40% alto
            const cropWidth = video.videoWidth * 0.80;
            const cropHeight = video.videoHeight * 0.40;
            const startX = (video.videoWidth - cropWidth) / 2;
            const startY = (video.videoHeight - cropHeight) / 2;

            canvas.width = cropWidth;
            canvas.height = cropHeight;
            ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            // OPTIMIZACIÓN: Reducción masiva de la resolución destino a un máximo de 500px
            const targetWidth = Math.min(cropWidth, 500);
            const scaleFactor = targetWidth / cropWidth;
            const targetHeight = cropHeight * scaleFactor;

            procCanvas.width = targetWidth;
            procCanvas.height = targetHeight;
            procCtx.drawImage(canvas, 0, 0, targetWidth, targetHeight);

            // OPTIMIZACIÓN: Binarización (Blanco y Negro puro) para simplificar la lectura OCR
            const imageData = procCtx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
                const color = brightness > 120 ? 255 : 0; 
                data[i] = data[i + 1] = data[i + 2] = color;
            }
            procCtx.putImageData(imageData, 0, 0);

            try {
                const { data: ocrData } = await worker.recognize(procCanvas);
                
                let rightmostWord = null;
                let maxX = -1;

                if (ocrData.words) {
                    ocrData.words.forEach(word => {
                        if (word.text.toUpperCase().includes('HG')) {
                            if (word.bbox.x0 > maxX) {
                                maxX = word.bbox.x0;
                                rightmostWord = word;
                            }
                        }
                    });
                }

                if (rightmostWord) {
                    const hgLeft = rightmostWord.bbox.x0;
                    const hgTop = rightmostWord.bbox.y0;
                    const hgBottom = rightmostWord.bbox.y1;

                    let candidateWords = ocrData.words.filter(w => {
                        const isBelowOrSameLine = w.bbox.y0 >= hgTop - 8;
                        const isWithinVerticalRange = w.bbox.y0 <= hgBottom + 120;
                        const matchesLeftColumn = Math.abs(w.bbox.x0 - hgLeft) < 25 || (w.bbox.x0 >= hgLeft - 8 && w.bbox.x0 < hgLeft + 60);

                        return isBelowOrSameLine && isWithinVerticalRange && matchesLeftColumn;
                    });

                    candidateWords.sort((a, b) => {
                        if (Math.abs(a.bbox.y0 - b.bbox.y0) < 14) {
                            return a.bbox.x0 - b.bbox.x0;
                        }
                        return a.bbox.y0 - b.bbox.y0;
                    });

                    let rawExtracted = candidateWords.map(w => w.text).join(' ');
                    let cleanedText = rawExtracted.toUpperCase().replace(/[^A-Z0-9]/g, '');

                    const regex = /HG\d+[A-Z0-9]+/;
                    const match = cleanedText.match(regex);

                    if (match) {
                        const finalSignature = match[0];
                        const scannedClean = finalSignature.toUpperCase().replace(/[^A-Z0-9]/g, '');
                        
                        statusDot.className = 'status-dot detected';
                        statusText.textContent = `¡Capturado!`;
                        matchCount.textContent = `1 Aislado`;

                        matchesList.innerHTML = `
                            <div class="match-card">
                                <span class="match-value">${finalSignature}</span>
                                <span style="font-size:0.75rem; color:#888;">(Rápido)</span>
                            </div>
                        `;

                        if (scannedClean !== lastScannedSignature) {
                            lastScannedSignature = scannedClean;

                            if (targetSignatureClean) {
                                const comparisonResult = compareCustom(targetSignatureClean, scannedClean);

                                if (comparisonResult < 0) {
                                    showIndicator('left');
                                } else if (comparisonResult > 0) {
                                    showIndicator('right');
                                } else {
                                    showIndicator('match');
                                }
                            }
                        }

                        setTimeout(() => {
                            if (stream && stream.active) {
                                statusDot.className = 'status-dot active';
                                statusText.textContent = "Escaneando...";
                            }
                        }, 400);
                    }
                }
            } catch (err) {
                console.error("Error en escaneo rápido:", err);
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
