<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Texto Rápido - "HG"</title>
    <!-- Usamos la versión mínima de Tesseract -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        header { text-align: center; margin-bottom: 15px; }
        h1 { font-size: 1.4rem; color: #4da6ff; margin-bottom: 5px; }
        .camera-container { position: relative; width: 100%; max-width: 480px; aspect-ratio: 4/3; background-color: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 15px; }
        .status-badge { display: inline-flex; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ff9800; }
        .status-dot.active { background-color: #4caf50; }
        .scan-region { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70%; height: 30%; border: 2px dashed rgba(255, 255, 255, 0.5); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35); }
        .controls { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 480px; }
        button { flex: 1; padding: 12px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-primary { background-color: #2196f3; color: white; }
        .btn-secondary { background-color: #424242; color: white; }
        .results-container { margin-top: 15px; width: 100%; max-width: 480px; background-color: #1e1e1e; border-radius: 12px; padding: 15px; }
        .output-box { background-color: #0d0d0d; border-radius: 8px; padding: 12px; min-height: 80px; font-family: monospace; white-space: pre-wrap; word-break: break-all; color: #e0e0e0; }
        .highlight-hg { background-color: #ffeb3b; color: #000; font-weight: bold; padding: 1px 4px; border-radius: 3px; }
        canvas { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Escáner Rápido "HG"</h1>
    </header>

    <div class="camera-container">
        <video id="webcam" playsinline autoplay muted></video>
        <div class="overlay">
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Cámara apagada</span>
            </div>
            <div class="scan-region"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-primary">Iniciar</button>
        <button id="btnStop" class="btn-secondary" disabled>Detener</button>
    </div>

    <div class="results-container">
        <div id="outputBox" class="output-box">Esperando cámara...</div>
    </div>

    <!-- Canvas oculto para procesar imágenes -->
    <canvas id="captureCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const outputBox = document.getElementById('outputBox');
        
        let stream = null;
        let isProcessing = false;
        let scanInterval = null;
        let worker = null;

        // Factor de escala (0.4 significa reducir la imagen al 40% de su tamaño original)
        // Esto hace que el OCR sea muchísimo más rápido.
        const SCALE_FACTOR = 0.4; 

        async function initOCR() {
            document.getElementById('statusText').textContent = "Cargando IA...";
            worker = await Tesseract.createWorker('eng');
            
            // OPTIMIZACIÓN: Restringir a mayúsculas y números acelera el motor
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ',
            });
            
            document.getElementById('statusText').textContent = "Listo para escanear";
        }
        initOCR();

        document.getElementById('btnStart').addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 } } // Solicitamos resolución baja
                });
                video.srcObject = stream;
                
                document.getElementById('btnStart').disabled = true;
                document.getElementById('btnStop').disabled = false;
                document.getElementById('statusDot').className = 'status-dot active';
                document.getElementById('statusText').textContent = "Buscando HG...";
                
                // Reducimos el intervalo de 1200ms a 500ms para mayor fluidez
                scanInterval = setInterval(processFrame, 500);
            } catch (err) {
                alert("Error de cámara");
            }
        });

        document.getElementById('btnStop').addEventListener('click', () => {
            clearInterval(scanInterval);
            if (stream) stream.getTracks().forEach(track => track.stop());
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('statusText').textContent = "Apagada";
        });

        async function processFrame() {
            if (isProcessing || !worker || video.videoWidth === 0) return;
            isProcessing = true;
            
            // OPTIMIZACIÓN: Dibujar solo una versión reducida en el canvas
            canvas.width = video.videoWidth * SCALE_FACTOR;
            canvas.height = video.videoHeight * SCALE_FACTOR;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const { data } = await worker.recognize(canvas);
                const text = data.text.trim();

                if (text.includes('HG')) {
                    const highlighted = text
                        .replace(/</g, "&lt;").replace(/>/g, "&gt;") // Seguridad básica
                        .replace(/HG/g, '<span class="highlight-hg">HG</span>');
                    
                    outputBox.innerHTML = highlighted;
                    document.getElementById('statusText').textContent = "¡ENCONTRADO!";
                    document.getElementById('statusDot').style.backgroundColor = "#00e676";
                    
                    setTimeout(() => {
                        document.getElementById('statusText').textContent = "Buscando HG...";
                        document.getElementById('statusDot').style.backgroundColor = "#4caf50";
                    }, 1000);
                }
            } catch (err) {
                console.error(err);
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
