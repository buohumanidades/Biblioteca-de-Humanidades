<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Ultra Rápido - Texto Horizontal Limpio</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        header { text-align: center; margin-bottom: 15px; }
        h1 { font-size: 1.4rem; color: #4da6ff; margin-bottom: 5px; }
        
        .camera-container { 
            position: relative; width: 100%; max-width: 480px; aspect-ratio: 4/3; 
            background-color: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .status-badge { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ff9800; }
        .status-dot.active { background-color: #4caf50; }
        
        /* Caja de escaneo HORIZONTAL */
        .scan-region { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; height: 25%; 
            border: 3px solid #ffeb3b; border-radius: 8px; 
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); 
        }
        .scan-region::after {
            content: "Alinea texto aquí";
            position: absolute; top: -25px; left: 0; width: 100%; text-align: center;
            color: #ffeb3b; font-size: 0.8rem; font-weight: bold;
        }

        .controls { margin-top: 15px; display: flex; gap: 10px; width: 100%; max-width: 480px; }
        button { flex: 1; padding: 12px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-primary { background-color: #2196f3; color: white; }
        .btn-secondary { background-color: #424242; color: white; }
        
        .results-container { margin-top: 15px; width: 100%; max-width: 480px; background-color: #1e1e1e; border-radius: 12px; padding: 15px; }
        .output-box { background-color: #0d0d0d; border-radius: 8px; padding: 12px; min-height: 80px; font-family: monospace; font-size: 1.1rem; color: #00e676; font-weight: bold; text-align: center; letter-spacing: 2px;}
        
        canvas { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Escáner Rápido (HG) Limpio</h1>
    </header>

    <div class="camera-container">
        <video id="webcam" playsinline autoplay muted></video>
        <div class="overlay">
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Iniciando...</span>
            </div>
            <div class="scan-region" id="scanBox"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-primary">Iniciar</button>
        <button id="btnStop" class="btn-secondary" disabled>Detener</button>
    </div>

    <div class="results-container">
        <div id="outputBox" class="output-box">-</div>
    </div>

    <canvas id="captureCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const outputBox = document.getElementById('outputBox');
        
        let stream = null;
        let isProcessing = false;
        let scanInterval = null;
        let worker = null;

        async function initOCR() {
            document.getElementById('statusText').textContent = "Cargando IA...";
            worker = await Tesseract.createWorker('eng');
            
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                tessedit_pageseg_mode: '6', 
            });
            
            document.getElementById('statusText').textContent = "Listo";
        }
        initOCR();

        document.getElementById('btnStart').addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                
                document.getElementById('btnStart').disabled = true;
                document.getElementById('btnStop').disabled = false;
                document.getElementById('statusDot').className = 'status-dot active';
                document.getElementById('statusText').textContent = "Escaneando";
                
                scanInterval = setInterval(processFrame, 300);
            } catch (err) {
                alert("Error de cámara");
            }
        });

        document.getElementById('btnStop').addEventListener('click', () => {
            clearInterval(scanInterval);
            if (stream) stream.getTracks().forEach(track => track.stop());
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('statusText').textContent = "Apagada";
        });

        async function processFrame() {
            if (isProcessing || !worker || video.videoWidth === 0) return;
            isProcessing = true;
            
            const cropWidth = video.videoWidth * 0.70;  
            const cropHeight = video.videoHeight * 0.25; 
            const startX = (video.videoWidth - cropWidth) / 2;
            const startY = (video.videoHeight - cropHeight) / 2;

            canvas.width = cropWidth; 
            canvas.height = cropHeight;

            ctx.drawImage(
                video, 
                startX, startY, cropWidth, cropHeight, 
                0, 0, cropWidth, cropHeight            
            );

            try {
                const { data } = await worker.recognize(canvas);
                
                // LIMPIEZA DE TEXTO: Elimina todo lo que NO sea letra mayúscula (A-Z) o número (0-9).
                // Esto elimina automáticamente /, -, _, espacios y cualquier otro símbolo.
                const text = data.text.replace(/[^A-Z0-9]/g, '');

                if (text.includes('HG')) {
                    outputBox.textContent = text;
                    document.getElementById('statusDot').style.backgroundColor = "#00e676";
                    
                    setTimeout(() => {
                        document.getElementById('statusDot').style.backgroundColor = "#4caf50";
                    }, 500);
                }
            } catch (err) {
                console.error(err);
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
